# Wapakoneta WRF — what the DMRs carry for total filterable residue, 2024-12 through 2026-09
#
# Issue 2184 · corpus, NOT a RecordItem (no `action:`/`permit:` block).
#
# WHY THIS EXISTS. The City's seven self-reports on 2PD00019 (2025-12-18 to 2026-09-18, extracted
# under data/extracted/oepa/wapakoneta/) report one TFR exceedance (November 2025) and none after
# January 2026. Whether TFR met its limits in the months no self-report covers was [open] until
# the DMRs were read. The generated pull (wwtp-oh0027952.dmr.yaml) carries flow and ECHO-flagged
# exceedances only; it cannot show a month the DMR left blank. This file is the per-tier grid that
# shows the blanks.
#
# TAG VOCABULARY:
#   [verified]  — the value or code as ECHO returns it. A fact about the ECHO record, not about the
#                 river or the plant.
#   [inference] — this file's reading.
#   [open]      — not established.

as_of: '2026-10-28'
site: wapakoneta
issue: 'watermark-directory/the-watermark-directory#2184'
status: measured
tag: verified

source:
  service: >-
    EPA ECHO effluent-chart service (eff_rest_services.get_effluent_chart) for NPDES OH0027952,
    window 2024-12-01 to 2026-10-28, pulled 2026-10-28 through
    watermark.hydrology.connectors.echo_dmr.fetch_effluent_chart. The latest month carried is
    2026-09, and only outfall 020 has a 2026-09 row so far.
  generated_pull: data/extracted/wapakoneta/wwtp-oh0027952.dmr.yaml
  parameter: '70300 Solids, total dissolved- 180 deg. C (the permit''s "total filterable residue")'
  tiers: >-
    Permit 2PD00019*SD Part I.A.3-6 (data/extracted/oepa/wapakoneta/2PD00019.npdes.yaml,
    total_filterable_residue_tiers): fictitious outfall 020 < 7 cfs, 1561 mg/l; 021 7 to < 16 cfs,
    1687 mg/l; 022 16 to < 25 cfs, 1927 mg/l; 023 >= 25 cfs, 2167 mg/l (30-day averages). A tier
    applies on the day a sample is taken, by the upstream flow at station 802, so one month can
    carry values at several tiers.
  nodi_codes: >-
    Decoded from ECHO's own NODIDesc returned with each code in this pull, not from outside
    knowledge: C "No Discharge", R "Administratively Resolved", 2 "Operation Shutdown". ECHO's
    description does not say what was resolved, by whom, or why.
  station_label_trap: >-
    ECHO labels internal station 603 "Raw Sewage Influent". The permit defines 603 as the internal
    station for secondary-treatment limits, measured BEFORE flow augmentation (2PD00019.npdes.yaml
    sampling_stations). The TSS and CBOD exceedances ECHO lists at 603 are secondary-effluent
    results, not influent.

