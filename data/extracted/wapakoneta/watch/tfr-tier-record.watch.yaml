load_rows: >-
  The kg/day rows at every tier carry a NODI code (mostly R) in every month except 2026-04, where
  each tier's kg/day row repeats its mg/l figure exactly (1075, 1056, 890). A load equal to the
  concentration is not plausible at a multi-MGD plant, so those three kg/day entries look like a
  data-entry error [inference]. They are not used here.

findings:
  - tag: '[verified]'
    finding: >-
      ECHO flags five TFR exceedances in the window: 2025-05 (021, 1900 against 1687), 2025-06
      (021, 1754 against 1687), 2025-07 (021, 2314 against 1687; 022, 2236.6 against 1927) and
      2025-12 (020, 1687 against 1561). No self-report for 2025-05 to 2025-07 is in the corpus
      [open].
  - tag: '[inference]'
    finding: >-
      The City's 2026-01-15 notice (eDoc 3971298) names no month, but both of its figures (TFR 1687
      against 1561 mg/l; C. dubia 1.1 against 1 TUc) equal ECHO's 2025-12 values exactly, so it
      reports December 2025.
  - tag: '[verified]'
    finding: >-
      November 2025 carries no TFR value at any tier: 020 and 023 are NODI R, 021 and 022 NODI C,
      and ECHO lists no violation. The City's 2025-12-18 self-report (eDoc 3944611) gives
      1718 mg/l against 1561 for that month. So the City's own November number is not on the
      ECHO record.
  - tag: '[verified]'
    finding: >-
      Eleven of the 22 months have no TFR value at any tier: 2025-02, 2025-08 through 2025-11,
      2026-01, 2026-02, 2026-05, and 2026-07 through 2026-09 (2026-09 partial). In each, at least
      one tier is NODI R. In 2025-08 through 2025-11 the low-flow tiers (020 and 021) are R, the
      months with the lowest upstream flow (5.6 to 9.5 cfs) and the highest influent TFR of the
      window (1990 to 2490 mg/l).
  - tag: '[verified]'
    finding: >-
      Where 2026 has values (2026-03, 2026-04, 2026-06), every tier is below its limit, and
      ECHO flags no TFR exceedance in 2026.
  - tag: '[inference]'
    finding: >-
      The months coded R are the ones that could have shown an exceedance: low upstream flow, the
      strictest tiers, and the highest influent. A blank in exactly those months does not show
      compliance. "Administratively Resolved" is the code's whole description; it does not say
      whether a value was withdrawn, waived under the DFFO, or never submitted.
  - tag: '[open]'
    finding: >-
      Why the low-flow TFR tiers are coded "Administratively Resolved" in 2025-08 to 2025-11 and
      2026-01/02, and whether that relates to the DFFO's interim conditions (which run in specific
      conductance and were extended to 2025-12-31 by eDoc 3301212). The signed DMR forms, or Ohio
      EPA's DMR review, would show it. ECHO cannot.

