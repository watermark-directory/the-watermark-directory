  note: 'THE LEVEL TWO ISOLATED WETLAND PERMIT APPLICATION for CMH-232. The form heading
    defines Level Two as ''impacts greater than 1/2 acre of Category 1 isolated wetlands
    and greater than 1/2 acre but not exceeding 3 acres for Category 2''. Its own
    Category 1 total is 0.74 ac. The 2025 file (251911W) was a Level One general-permit
    notice for 0.24 ac forested Cat 2 plus 0.18 ac non-forested Cat 1. This table
    re-lists the main-campus impacts (Wetland 1 0.24 forested; 2, 3a and 3b, 0.19
    non-forested) and adds the parking-lot wetlands A, B and C (0.55). MITIGATION
    (Section 2): wetland mitigation bank, ''Norton Run MB, Big Island MB''; forested
    credits 1.00, non-forested credits 1.10; proof of reservation checked. The uploads
    include the Big Island MB deposit email chain, NORTON-11 final payment letter,
    NOR-11 purchase agreement, ''EBIZ-W3myhuuj-251911W Credit Purchase Complete CMH-232.pdf'',
    and the NOR-43 executed purchase agreement and deposit verification. ALTERNATIVES
    (p. 3, in the applicant''s words): the design team shifted building footprints,
    used shared utility corridors and underground retention, but complete avoidance
    was ''not practicable due to the site''s topographic constraints and the project''s
    operational needs, including emergency vehicle access and cooling infrastructure
    layouts. The site''s unique location within an existing high-capacity power and
    fiber corridor ... further constrains alternative siting options.'' The parking
    lot (981 spaces, bus and worker entrances, a stormwater basin) follows WSP''s
    December 2025 Construction Traffic Impact Study (4298287.pdf). Wetland 1 is called
    ''general high-quality water'' under OAC 3745-1-05 as a Category 2 wetland. Its
    east and west portions ''will be impacted by electrical and water utilities''
    and are to be restored afterwards. ''No isolated wetlands will be fully avoided.''
    Buffers: 295 ft (Wetland 3a / temporary construction access drive), 195 ft (Stormwater
    Basin 3), 25 ft (West Millcreek Road widening). T&E (p. 4): an IPaC report dated
    2025-07-31 lists five species; ODNR letters are dated 2025-08-08 (campus) and
    2026-06-18 (parking lot); ODNR coordination was on 2026-04-16 and a 2026-07-23
    follow-up had no reply; a USFWS letter dated 2026-04-24 recommends winter tree
    clearing (Oct 1-Mar 31). Post-development stormwater: three retention ponds on
    the campus and one at the parking lot. The form states NO electrical load.'
