  note: 'THE SECOND 401 FILE ON CMH-232, and the first that is not a general-permit
    notice. Electronically submitted 2026-10-26 by Shannon Moore, Regional Environmental
    Manager (submitter 71278698). In the applicant''s own words: ''The proposed project
    will convert 251.9 acres of agricultural, residential, and vacant land into a
    data center campus ... The project area consists of two (2) sites. The proposed
    data center will be situated on a 236.7-acre site, and a 15.2-acre site will be
    used as a parking lot during construction.'' The stated purpose is ''cloud computing
    and artificial intelligence applications''. Construction runs 03/01/2027 to 03/01/2030,
    compared with 2026-03-01 to 2026-10-31 on the 2025 application (3935117.pdf).
    The form states no electrical load: neither ''MW'' nor ''megawatt'' appears in
    the text layer. The applicant contact email is now mmailhot@amazon.com (Robert
    Truedinger, Director, Enviro, is still the named contact). The applicant-side
    contacts are Amazon staff and are recorded here, not as outside representation.
    Section 4 lists the uploads: delineation reports, photos, ORAM forms, ODNR comment
    letters (25-1064, 26-0867), USACE JD LRH-2024-927 (Joslin Site JD; AJD letter),
    mapping including ''CMH-232 Parking Lot Site Plan_08042026.pdf'', ''Off Site Logistics.pdf''
    and ''Combined Wetland Overlay.pdf'', and the mitigation plan ''IWP Cover Letter_09282026.pdf''
    + ''IWP (OEPA) Level 2 - CMH232_REV2.pdf''. The Level Two IWP application itself
    is 4298321.pdf (DSW401262560W.iwp-application.epa.yaml).'
