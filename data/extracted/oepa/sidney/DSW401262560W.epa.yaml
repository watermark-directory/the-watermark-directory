source_text_excerpt: 'Application ID: 540722745; Rev. 8/2014 Page 1. Application for
  Section 401 Water Quality Certification Division of Surface Water 401 Water Quality
  Certification and Isolated Wetland Permitting Unit Section 1: Applicant (Project
  Proponent) and Consultant/Agent Information Applicant (Project Proponent) Consultant/Agent
  Company/Agency Name: Amazon Data Services, Inc. Smart Services, Inc Address: 410
  Terry Ave N, Seattle, WA 98109 88 W Church St, Newark, OH 43055 Contact Name/Title:
  Robert Truedinge'
action:
  confidence: high
  warnings:
  - As printed, the form gives the project ZIP as 43103 for 'Millcreek Road, Sidney,
    OH', the same error as the 2025 application (3935117.pdf). 43103 is Ashville;
    Sidney is 45365. Recorded as printed.
  - 'All seven ORAM forms give ''Hydrologic Unit Code (HUC8): 05120103 Mississinewa'',
    a Wabash-basin HUC, while the form''s Section H gives the Great Miami HUC-12s
    050800010604 and 050800010703. Recorded as printed; neither value is corrected
    or reused as a fact.'
  - Main-campus ORAM site visits are dated 07/08/2024; parking-lot ORAM site visits
    (Wetlands A, B, C) are dated 05/07/2026.
  - 'Section 3, as printed, is internally inconsistent: ''Wetland Acres Impacted 0.98
    x $500.00 = $490.00'', then ''Total Review Fees = $0.00'', then ''Total Fees ...
    = $690.00'' ($200 + $490). Recorded as printed.'
  - 'Section 2.L checks only ''NPDES Permit — Permit Type: General — Will be Submitted
    on: 12/01/2026''. It does NOT check ''Isolated Wetland Permit'', although the
    Level Two IWP application under the same Application ID was filed the same day
    (4298321.pdf). The form does not say which general NPDES permit; that it is construction
    stormwater is [inference].'
  - 'Checkboxes were read from the rendered pp. 1-2. The text layer does not show
    which box is ticked. Pre-filing meeting: No. Any portion complete: No. After-the-fact:
    No. Impact type: Fill only. Fee-exempt: No.'
  - Wetland 2's ORAM form (p. 40) gives FINAL SCORE 20.0. The IWP impact table (4298321.pdf,
    p. 5) gives Wetland 2 an ORAM score of 19.0. Both give Category 1. Recorded as
    printed.
