# Adams County Regional Water District — Ohio EPA's 2026 contaminant monitoring schedule for
# public water system OH0100012, effective 2026-01-01.
#
# Hand-read from the committed PDF's text layer (pdftotext -layout), checked against a render of
# every page. The file is a Paper-Capture PDF, so the text layer is OCR over a scan rather than
# the agency's own bytes. Every value below was legible in both, and the text agrees with the
# render on each one.
#
# SCOPE FENCE: the source holds six Adams County systems. This file transcribes ONLY OH0100012
# (PDF pp. 4-6). The other five are listed in the filename map and not read here. A monitoring
# schedule is a list of sampling OBLIGATIONS, not results: nothing here says what any sample
# found, and nothing here says anything about any data-center customer.
