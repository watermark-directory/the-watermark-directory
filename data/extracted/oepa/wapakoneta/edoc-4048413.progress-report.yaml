  summary: 'The City reported an upset at its WRF from 2026-03-11 09:00 to 2026-03-12 11:00: after weather
    events and power fluctuations the return-sludge pumps failed to restart, settled sludge was not removed
    and floc overflowed the weirs to the Auglaize River. It gave an approximate volume of 9,000,000 gallons
    and a TSS value of 118 mg/l against a 12 mg/l 30-day limit. It traced the cause to a programming fault
    and brought an additional clarifier on line.'
