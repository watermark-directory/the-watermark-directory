  status: modified
  summary: 'Ohio EPA''s 2019-02-06 Director''s Final Findings and Orders to the City of Wapakoneta, issued
    by consent (the City waived appeal), address Total Filterable Residue in the WWTP discharge under
    NPDES 2PD00019*ND: the drinking water plant''s ion-exchange brine reaches the WWTP, the 1,523 mg/l
    monthly TFR limit had been periodically exceeded since 2017, and expected water-demand and industrial
    growth (production at Pratt Industries) would raise TFR further. The Orders require a general plan
    with PWS work complete by 2022-12-31 and WWTP work by 2024-09-01, substitute interim specific-conductance
    limits with per-exceedance mitigation fees once Pratt production begins, and require annual biological
    sampling of the Auglaize River. Modified 2024-11-20 (eDoc 3301212): the WWTP deadline and the interim
    limits were extended to 2025-12-31.'
  note: 'Jurisdiction: R.C. 6111.03, 6109.04 and 3745.01. Signed for Ohio EPA by Director Laurie A. Stevenson;
    for the City by Mayor Thomas A. Stinebaugh (handwritten). Termination on Respondent''s certification
    and acknowledgement by the Chiefs of DSW and DDAGW (§VII). Deadlines for Orders 1 (plan) and 10 are
    COMPUTED from the 2019-02-06 effective date (90 and 30 days); the Orders state durations, not dates.
    Retrieved as eDoc 992359 — the DSW enforcement listing links this row to 1080081, a different Jefferson
    County order (see data/research/oepa-dffo-wapakoneta-2026-10-18/manifest.yaml).'
