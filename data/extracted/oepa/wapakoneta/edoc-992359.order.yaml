order:
  confidence: high
  warnings:
  - Effective date 2019-02-06 is read from the machine-printed journal stamp on p. 2 ('Ohio EPA FEB 6
    '19 Entered Directors Journal'); §XIV makes the journal-entry date the effective date, and the transmittal
    is dated 2/6/2019. The Mayor's signature date on p. 10 ('Feb. 5, 2019') is HANDWRITTEN and is not
    relied on for any date field.
  - The cover letter's text layer reads the street as '701 Pariette Court'; the body of the Orders reads
    '701 Parlette Court'. The garble is the cover's; the address is not otherwise relied on.
  - 'Order 8 states the conversion factor as 0.625 ''to convert TFR levels from mg/l to micromhos/cm'';
    the Orders'' own pairs fix the direction as TFR mg/l = 0.625 x specific conductance (Order 7.c: 4,800
    micromhos/cm <-> 3,000 mg/l). Read that way, Order 6''s 3051 / 3886 micromhos/cm are ~1,907 / ~2,429
    mg/l TFR — the figures the 2019 OWEA deck quotes. The Orders themselves state the limits in specific
    conductance, not TFR.'
  - Order 10 prints 'TRF' once for TFR; recorded as a typo in the source, not corrected in the requirement
    text beyond this note.
  - No civil penalty is assessed. Order 7 sets per-exceedance MITIGATION FEES, carried in stipulated_penalties,
    not penalty_usd.
  - 'status is ''modified'': the 2024-11-20 modified DFFO (eDoc 3301212, extracted/oepa/wapakoneta/edoc-3301212.order.yaml)
    extends Order 1''s WWTP deadline and Order 6''s interim-limit end date from 2024-09-01 to 2025-12-31
    and leaves every other Order in force. Whether the Orders have since been terminated under §VII is
    [open].'
  - The 2024 modification's findings date the PWS lime-softening upgrades as completed 2023-08-07, about
    seven months AFTER this Order 1's 2022-12-31 PWS deadline. Neither order records an extension of the
    PWS deadline or says whether lime softening was the whole of the PWS general-plan work. [open]
