source_text_excerpt: >-
  "Ohio EPA Permit No.: 2PD00019*SD / Application No: OH0027952 / Action Date: November 5, 2024
  / Effective Date: December 1, 2024 / Expiration Date: November 30, 2029 ... City of Wapakoneta
  is authorized by the Ohio Environmental Protection Agency ... to discharge from the City of
  Wapakoneta WRF (and associated combined sewer overflows), located at 201 Herbstritt Court,
  Wapakoneta, Ohio, Auglaize County, to Auglaize River at River Mile 84.9 in accordance with the
  conditions specified in Part I, II, III, IV, V, and VI of this permit. ... Anne M. Vogel,
  Director ... Total Pages: 82"

# Reviewed transcription from this digitally generated PDF's embedded text layer. Page citations
# are the permit's own printed sheet numbers ("Page N"). The 37-page Fact Sheet IS bound into
# this PDF after the 82 permit sheets (PDF pages 84-120, 1-based), and is ALSO served standalone
# as 2PD00019.fs.pdf with an identical text layer; fact-sheet content is transcribed and cited in
# data/extracted/oepa/wapakoneta/2PD00019.fs.npdes.yaml, not re-cited here. The one image-only
# permit sheet (Page 28, a notes continuation) was rendered and viewed. Fetched from the Ohio
# EPA DAM by permit number on 2026-10-17 while the eDocument portal returned HTTP 503.

permit:
  confidence: high
  warnings:
  - >-
    THE LIMIT TABLE YOU WANT DEPENDS ON THE DATE. Part I.A carries two complete Outfall 001
    tables. Item 1 governs "the period beginning on the effective date of this permit and lasting
    24 months"; Item 2 governs "the period beginning 25 months after the effective date of this
    permit and lasting through the expiration date." The interim table has NO numeric limit for
    selenium, cadmium, dibromochloromethane or carcinogenic additivity (monitor only). With an
    effective date of 2024-12-01 the changeover falls on or about 2026-12-01 [inference — the
    permit prints month offsets, not dates; the bracketed "[specific calendar dates will be
    inserted upon final issuance]" in Item 1 was never filled in].
  - >-
    The changeover month and the compliance deadline disagree inside the permit itself. The
    final table begins at month 25, but Part I.C.1 gives the permittee until "36 months after the
    permit effective date" (Event Code 05699, on or about 2027-12-01) to attain compliance with
    the same four limits. The fact sheet carries the same split (24 months on its p. 15, 36 on
    p. 17). Which governs for an exceedance in months 25-36 is a legal question this
    transcription does not answer. [open]
  - >-
    Outfall 001 is measured AFTER flow augmentation; internal station 603 is measured BEFORE it.
    Note j: Outfall 001 flow "shall be calculated as the sum of flows from 2PD00019603 (secondary
    treatment effluent) and the flow augmentation system." The water-quality-based limits
    (cadmium, selenium, mercury, DBCM, toxicity, TFR tiers) therefore apply to treated effluent
    plus augmentation water, while secondary-treatment performance is policed at 603. Neither the
    permit nor the fact sheet names the source of the augmentation water; a 2019 [reference]
    deck names treated groundwater as an option under investigation then
    (wapakoneta/reference/owea-2019-tds-challenges.yaml). [open]
  - >-
    The issued permit's tables correct two fact-sheet misprints: station 603 winter ammonia is
    4.5 / 3.0 mg/L here (fact sheet Table 18 prints "30"), and the toxicity rows are in TUa/TUc
    here (fact sheet Table 17 prints "mg/L"). Chronic toxicity is 1.0 TUc in both documents,
    although the fact-sheet narrative proposed 1.1.
  - >-
    The carcinogenic additivity equation in Part II Item AA divides by 180 / 890 / 150 / 1700 /
    190, while the WLA table printed immediately above it lists 238 / 1175 / 198 / 2245 / 251 ug/L
    for the same five carcinogens. The denominators are not the WLAs, and the permit does not say
    what they are. The 150 for dibromochloromethane equals its 30-day limit. Recorded as printed.
    [open]
  - >-
    The fact sheet's proposed 0.019 mg/L total residual chlorine limit does not appear in the
    issued Part I.A tables, although the station notes still cross-reference chlorine to Part II
    Item M. See final_effluent_limits.note_chlorine. [open]

