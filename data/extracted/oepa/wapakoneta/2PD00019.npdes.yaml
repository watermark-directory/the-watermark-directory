  other_requirements_of_note:
    citation: 'Permit 2PD00019*SD, Part II'
    tag: '[verified]'
    operator_class: >-
      Item A — Class III treatment works; tributary collection systems Class II sewerage systems.
    percent_removal: Item L — at least 85 percent removal of CBOD5 and TSS.
    reopener: >-
      Item O — WQBELs "may be revised based on updated wasteload allocations or use designation
      rules"; the permit may be modified or reissued to comply with a revised WLA or approved
      TMDL.
    maumee_tp: >-
      Item V.2 — "The Maumee Watershed Nutrient Total Maximum Daily Load (TMDL) Report was
      approved in September 2023. The TMDL assigned an individual wasteload allocation to
      Wapakoneta WRF of 1500 kg of total phosphorus for the critical season (March through July).
      Compliance with this individual wasteload allocation will be regulated through the Maumee
      Watershed Total Phosphorus NPDES General Permit, under which Wapakoneta WRF has been granted
      coverage." Seasonal load = Veff x Ceff x 3.7854, March 1 - July 31, reported on the July
      DMR (Item V.1; the fact sheet prints the factor as 3.78548).
    pretreatment: Item Y — pretreatment program requirements.
    biomonitoring: >-
      Item Z — continue the effluent biomonitoring program; chronic and definitive acute tests on
      Ceriodaphnia dubia and Pimephales promelas at 001; lab SOP due within three months of the
      effective date.
