    tier_selection: >-
      Each tier "is only applicable when the Auglaize River upstream flow rate is measured as
      [in range] on the day the sample for total filterable residue was collected. Upstream flow
      rate is determined based on monitoring at station 2PD00019802."
    rating_curve: >-
      Item N: "To maintain applicability of flow-tiered effluent limits for total filterable
      residue, the permittee must re-evaluate the relationship between river stage and flow rate
      at 2PD00019802 for each subsequent NPDES permit renewal," submitting an updated stage vs.
      flow curve with the next renewal application, and also "upon visual observation that the
      river bed has shifted significantly."
    note: >-
      The limit that applies on a given day is selected by the permittee's own stage reading
      converted through the permittee's own curve. Any outside check of a TFR result must first
      establish which tier the day fell in.

