# Method note: this is a DIGITALLY GENERATED Ohio EPA PDF, not a scan. Its text layer is the
# document's own embedded text, not an OCR guess, so every figure below is read from it verbatim
# rather than re-keyed from a render. This is a REVIEWED TRANSCRIPTION, not a `watermark extract
# --kind npdes` run: no vision pass was made, `pages_read` is therefore empty, and each block
# cites the 1-based printed sheet ("Page N of 37"). The two image-only sheets (pp. 19-20,
# Figure 1 location map and Figure 2 process schematic) were rendered and viewed for the
# publication screen; they carry no figures transcribed here.
#
# The same 37 sheets are ALSO bound into the issued permit (2PD00019.pdf, PDF pages 84-120,
# 1-based) with an identical text layer. This standalone copy is the one cited. Fetched from the
# Ohio EPA DAM by permit number on 2026-10-17 while the eDocument portal was returning HTTP 503
# (data/research/oepa-discovery-wapakoneta-2026-10-17/manifest.yaml).
#
# SCOPE TRAP, stated once: this is the City's WASTEWATER plant. It says nothing about the CTS
# data-center proposal, whose 5,000-10,000 GPD figure is a stated DEMAND on the city's water
# system, not a discharge to this plant (docs/sites/wapakoneta). Nothing below connects the two.

permit:
  confidence: high
  warnings:
  - >-
    THE LOW FLOWS ARE NOT A GAGE RECORD. Table 14 (p. 29) gives the 7Q10 as 2.29 cfs with basis
    "Streamstats", and its footnote is explicit about where it came from: "In a 2021 technical
    memo, the permittee used a 7Q10 value in its justification for tiered limits for total
    filterable residue. The 7Q10 is based on a value generated in Streamstats (using a drainage
    area of 110 square miles), then reduced by the standard error of the calculation." The same
    approach was applied to the 1Q10, 30Q10-summer and 90Q10; the 30Q10-winter is the summer
    value times 3.86, a ratio from the historical record at USGS gage 04186500. Only the
    harmonic mean (11.9 cfs) is gage-derived. Treat 2.29 cfs as the REGULATORY denominator these
    limits were computed against — originating in the permittee's own memo — not as a
    measurement of the Auglaize at RM 84.9, and do not reconcile it against a derived value by
    preferring one.
  - >-
    The plant is larger than the river it discharges into at low flow. Table 14 prints the
    discharger flow as 9.283 cfs (6.0 MGD) against an annual 7Q10 of 2.29 cfs in the same table.
    At design flow under 7Q10 conditions effluent would be about 9.283 / (9.283 + 2.29) = 80%
    of the river below the outfall. The two inputs are [verified]; the 80% is arithmetic and
    is [inference] wherever it is asserted.
  - >-
    The plant's 2019-2023 violation record (Table 2, p. 21) is dominated by what this permit was
    rewritten to manage: 178 violations in five years — 150 at Outfall 001 itself and 28 TFR
    violations at fictitious outfalls 020-022, all in a table titled "Outfall 001" — of which 62 are E. coli, 53 are total
    filterable residue across outfalls 001/020/021/022, 17 are chronic toxicity, and 20 are TSS
    (12 in 2023 alone). A Director's Final Findings and Orders was issued on 2019-02-06 "to
    address the excessive discharge of total filterable residue" (p. 8). The DFFO itself is NOT
    in the captured record — it is an eDocument-portal record and the portal was down at fetch.
    [open]
  - >-
    The effluent is acutely AND chronically toxic to both test species, and the fact sheet ties
    that, provisionally, to dissolved solids: "Toxic impacts of the permittee's effluent may be
    associated with elevated concentrations of total filterable residue. The permittee has plans
    to implement a flow augmentation program to reduce these high concentrations, therefore
    additional toxicity source identification is needed" (p. 15). The SOURCE of the augmentation
    water is not stated anywhere in the fact sheet or the permit. The City's 2019 OWEA deck
    (wapakoneta/reference/owea-2019-tds-challenges.yaml) names treated groundwater as an option
    then under investigation — [reference], and not evidence of what was built. [open]
  - >-
    Station 603 winter ammonia is printed "4.5 d 30 103 d 68" in Table 18 (p. 34). The 30-day
    concentration "30" is a typo for 3.0 in the FACT SHEET only: the issued permit's Part I.A.7
    table prints 3.0 for the same cell, and 68 kg/day at 6.0 MGD is 3.0 mg/L. Recorded as
    printed with this note; the permit governs.
  - >-
    Three internal inconsistencies, recorded and not resolved: (1) p. 15 says new limits for the
    Group 5 parameters take effect after a 24-month schedule, p. 17 (and the permit's Part I.C)
    says 36 months — the permit's own final-limit table nonetheless begins at month 25; (2) the
    narrative on p. 15 proposes "a monthly average limit of 1.1 TUc" for chronic toxicity, but
    Table 17 and the permit both print 1.0 TUc, and Table 17 labels all four toxicity rows "mg/L"
    where the unit is toxic units; (3) dibromochloromethane's human-health WLA is 198 ug/L
    (Table 15, Attachment 1) while the 30-day limit is 150 ug/L — 150 is the denominator the
    additivity equation uses, but no sentence in the fact sheet says why the limit is not the
    WLA. [open]
  - >-
    The receiving water's 2019 biological survey is "validated but unpublished" and "conducted
    prior to the facility expansion and arrival of a new industrial user" (p. 9). The new
    industrial user is NOT named anywhere in the document. Table 8 (p. 23) shows the three
    brominated trihalomethanes NOT DETECTED ("AA") in all five samples from 2019-04-09 through
    2021-09-10, then present at 2022-09-14 and higher at 2023-09-19 (dibromochloromethane 45 ->
    142 ug/L). The new limits for dibromochloromethane and additivity rest on two samples. That
    the appearance is the new user is [inference] at most, and who the user is remains [open].
  - >-
    Zero-background assumptions: Table 14 sets background to 0 for antimony, bromodichloromethane,
    bromoform, total residual chlorine, dibromochloromethane, chloroform, dissolved hexavalent
    chromium, free cyanide, diethyl phthalate, mercury, methyl ethyl ketone, molybdenum and
    2,4,6-trichlorophenol, each "No representative data available." A WLA computed over a zero
    background is a ceiling on the assumption, not a measurement of the river.

