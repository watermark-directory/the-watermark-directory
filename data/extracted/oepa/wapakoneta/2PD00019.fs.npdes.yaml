  summary_of_permit_conditions:
    citation: 'Fact Sheet 2PD00019*SD, Pages 2-3, 17-18'
    tag: '[verified]'
    changes: >-
      New or lower limits accompany the expansion to 6.0 MGD. New internal station 603 carries
      technology-based limits before flow augmentation; Outfall 001 carries water-quality-based
      limits after it. TFR is tiered across fictitious outfalls 020-023. New limits for
      dibromochloromethane, cadmium, selenium and carcinogenic additivity; new monitoring for
      bromodichloromethane, bromoform, chloroform and 2,4,6-trichlorophenol. Acute and chronic
      toxicity limits for both species. Sludge stations 586 and 588 added, 582 removed. E. coli
      monitoring at 801/901 reduced to once per two weeks, June-August. Total cyanide monitoring
      at 901 removed.
    schedules: >-
      CSO post-construction compliance monitoring schedule; 18-month local-limits review that
      must consider a 0.5 mg/L monthly total-phosphorus TARGET (a target, not a limit);
      36-month schedule to meet the new limits. CSO public-notification plan approved 2018-10-04,
      annual report due by May 1.
    operator_class: III
    storm_water: >-
      Parts IV-VI (industrial storm water) were included in the draft; the fact sheet says they
      would be removed from the final permit if the WRF obtained OHR000006 general-permit coverage
      or a No Exposure Certification first. The issued permit retains Parts IV-VI (see
      2PD00019.npdes.yaml).
