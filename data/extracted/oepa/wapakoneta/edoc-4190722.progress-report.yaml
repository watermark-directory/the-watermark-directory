progress_report:
  confidence: high
  warnings:
  - This is the CITY'S self-report, not an agency finding. Every value and stated cause is [verified]
    as what the City told Ohio EPA, nothing more.
  - 'Filed under a permit condition, not an order: the form cites Part III, Section 12 of the NPDES permit.
    case_no and paragraph are therefore null. The form does not cite the 2019 DFFO or its 2024 modification.'
  - The form's period of exceedance reads "1.00 hrs" with a first-of-month date. A 30-day average cannot
    be a one-hour event, so the field is transcribed as printed; the date is read as the monitoring month
    and is the form's, not an inference about when the discharge occurred.
  - The exceedance is for Pimephales promelas (61428), but the laboratory note the City pastes as both
    the comment and the cause discusses the Ceriodaphnia dubia test (its PMSD and the male-dominated blocks).
    The form states no cause specific to P. promelas. The mismatch is transcribed, not resolved. [open]
