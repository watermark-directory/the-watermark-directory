inspection:
  confidence: high
  warnings:
  - 'The document gives TWO start-up dates for the new plant and they disagree. Cover-letter Finding 1
    reads "The new went into operation on August 21, 2024" (a word is missing in the source). The Section
    D comment on p. 6 reads "The new plant went online on August 1, 2025". Both are transcribed as printed;
    neither is corrected. The August 2024 date agrees with the 2024-11-15 performance audit (PAI) of the
    plant in the same report, and with a Jacobs CSO post-construction monitoring document on the same portal
    (eDoc 3940468, read but not shelved: "expansion construction completed August 2024") [inference]; which date Ohio EPA meant is not settled here. [open]'
  - 'The report never mentions flow augmentation, the wells, or the 2019 DFFO and its 2024 modification.
    Section E answers "Permittee has a compliance schedule: Yes", names its source as "NPDES", and answers
    "Permittee is meeting compliance schedule: Yes". The eight milestones it tabulates are all permit milestones
    (December 2025 to June 2028). The report is therefore no evidence either way on the DFFO''s 2025-12-31
    WWTP deadline.'
  - The two limit violations are from the agency's compliance-data printout for 4/17/2025-6/30/2025 (p. 4),
    not from an inspector's finding. Every value in that table was read off the rendered page image and
    agrees with the text layer. The TFR limit there (station 021, 1687 mg/l) is a permit tier at a
    fictitious outfall, not a DFFO interim limit.
  - Page 3's signature block carries a date (8/13/2025) only for Alexander Young; the supervisor's (Thomas
    Poffenbarger) date field is blank. report_date is the cover letter's printed date.
