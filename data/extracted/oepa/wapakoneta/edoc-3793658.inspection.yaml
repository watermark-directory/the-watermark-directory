  summary: Ohio EPA's Northwest District Office inspected the Wapakoneta WRF on 2025-07-29 and recorded
    no significant noncompliance. Its findings say the new 6 MGD plant went into operation 2024-08-21 with
    minimal start-up issues, but a form comment gives 2025-08-01. The agency's compliance printout shows
    a May 2025 TFR violation at fictitious outfall 021 (1900 against 1687 mg/l) and a TSS quantity violation
    at station 603. The one recommendation, which is not an order, is to finish and implement a new SWPPP.
  note: The letter states its recommendations "are not Orders". Design flow 6 MGD and daily average 4 MGD
    are the letter's facility description. Compliance-schedule milestones not entered as of the printout
    (8) are permit milestones only, the earliest due December 2025. The Section F answer on high-flow events
    reads "It has automated flow for high-flow events"; the report does not say what that is. The facility
    accepts trucked-in home septic waste and land-applies Class A biosolids.
