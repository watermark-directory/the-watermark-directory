  summary: On 2026-01-15 the City of Wapakoneta notified Ohio EPA of two 30-day-average exceedances at
    its WRF, TFR (1687 against 1561 mg/l) and chronic toxicity to Ceriodaphnia dubia (1.1 against 1 TUc).
    It blamed high industrial loading for the TFR and gave no cause for the toxicity, noting the river
    upstream is also above water-quality limits. It reported that it "now" has flow augmentation online.
    This is the first document in the record that says the augmentation system is running.
  note: 'Filed on Ohio EPA DSW''s "Non-compliance Notification for Exceedance of a Daily Maximum Discharge
    Limit" e-form, which cites Part III, Section 12 of the permit. Application ID 23327580; contact Justin Waid, Superintendent. Description field: "TFR and bioassay".
    Reporting non-compliance with a permit condition: No. The 2025-12-31 DFFO deadline is two weeks before
    this form; the form does not say when augmentation came online.'
