source_text_excerpt: "Division of Surface Water\nNon-compliance Notification for\nExceedance of a Daily\
  \ Maximum Discharge Limit\nUse this form to report non-compliance that is the result of any violation\
  \ of a daily maximum discharge limit for any of\nthe pollutants listed by the Director in your NPDES\
  \ permit (see Part III, Section 12 of your NPDES permit for details). The\nform should be completed\
  \ and e-mailed to the approp"
progress_report:
  confidence: high
  warnings:
  - 'This is the CITY''S self-report, not an agency finding. "now have flow augmentation online which
    is meeting effluent limits" is [verified] as what the City told Ohio EPA on 2026-01-15. It is not
    proof that the augmentation system is complete, that it meets the permit''s limits in general, or
    that the DFFO''s WWTP work was finished by 2025-12-31. The same form reports a TFR exceedance, so
    the claim that augmentation "is meeting effluent limits" is the City''s, and its own form qualifies it.'
  - 'Filed under a permit condition, not an order: the form cites "Part III, Section 12" of the NPDES permit.
    case_no and paragraph are therefore null. The form does not cite the 2019 DFFO or its 2024 modification.'
  - 'The form''s period of exceedance reads "1.00 hrs" on 01/15/2026, the same day as the form date. A 30-day
    concentration average cannot be a one-hour event, so the field is transcribed as printed and not interpreted.
    The averaging period behind each 30-day figure is not stated. [open]'
  - The TFR limit printed (1561 mg/l) is the permit's 30-day TFR tier at one of the fictitious outfalls
    020-023, selected by river flow; the form does not say which outfall or flow tier applied. The figure
    matches no DFFO interim limit (those are in specific conductance).
