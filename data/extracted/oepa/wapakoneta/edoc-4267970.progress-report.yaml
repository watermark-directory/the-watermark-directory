  summary: On 2026-09-18 the City notified Ohio EPA of four TSS exceedances (30-day and 7-day, quantity
    and concentration) for the period dated 2026-08-01, which it blamed on high flows from heavy rain,
    and chronic toxicity to Ceriodaphnia dubia of 4.4 TUc against a 1 TUc limit, which it blamed on high
    upstream chronic toxicity mixing with the effluent. It said the plant resumed normal operation once
    flows returned to average.
