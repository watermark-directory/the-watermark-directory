  summary: 'Ohio EPA''s 2024-11-20 modification of the 2019-02-06 DFFO to the City of Wapakoneta, issued
    by consent, extends the deadline to complete the wastewater-treatment-plant actions under the TFR
    general plan, and the interim specific-conductance limits that run with it, from 2024-09-01 to 2025-12-31.
    The findings record that the City completed lime-softening upgrades at its drinking water plant on
    2023-08-07 and chose flow augmentation at the WWTP: developing wells and piping that water to discharge
    near the outfall, where it is blended with the effluent to dilute TFR. Well capacity and boulders
    found 2023-09-29 along the planned directional-drilling route delayed the work, and the City requested
    an extension on 2024-07-29.'
  note: 'Findings (all [verified] as stated by the Director; the City''s underlying letters of 2024-07-29
    and 2024-08-26 are NOT in the record): the PWS lime-softening upgrades were completed 2023-08-07;
    flow augmentation means wells piped to discharge in close proximity to the WWTP outfall; obstacles
    were wells with insufficient production capacity and geotechnical results, discovered 2023-09-29,
    showing boulders and rocks that could limit horizontal directional drilling of the pipeline; the City
    requested an extension 2024-07-29; Ohio EPA asked for detail 2024-08-12; the City supplemented 2024-08-26.
    Transmitted by Tyler Liston, Manager, Permits Processing, DSW, to Tyler Price, Director of Public
    Safety. Jurisdiction: R.C. 6111.03, 6109.04 and 3745.01. The portal index lists this as docid 3301212
    (''DFFO - DFFO'', 11/20/2024).'
