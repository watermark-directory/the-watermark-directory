      for: ohio content english/opsb/cases/25-0871-EL-BLN".
    consequence: >-
      Not an alternative route to DIS; it proxies nothing. Recorded because a 200
      status on a state siting-board domain reads like success and is not.
  - route: Wilmington News Journal — wnewsj.com
    tag: '[verified]'
    probed: '2026-08-06'
    result: HTTP 403 to browser-headered curl and to the agent fetcher alike, for all three cited articles.
    consequence: >-
      Issue #1469's items 3 and 5 rest entirely on this publisher — AES Ohio's
