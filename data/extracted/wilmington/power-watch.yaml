# Wilmington (Clinton County, OH) — standing power watch.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, arithmetic shown
#   [open]      = not established by any captured source — do NOT assert
#
# The power story here is documented on the GRID side and undocumented on the
# CAMPUS side, and the watch is shaped by that asymmetry. AES Ohio has told PJM,
# in a filing, exactly how much load it has been asked to deliver at its Clinton
# Substation and when — 35 MW in January 2028 rising to 500 MW in January 2030 —
# and has priced $283.9M of Clinton-end transmission to serve it. What no captured
# record does is say WHO the customer is. Two disclosed data-center corridors sit
# within a mile of that substation. Until an instrument joins the request to one
# of them, the campus's IT load stays a screening [inference] and this file tracks
# the filings that would close the join.
#
# The second half of this file is the other kind of entry: routes that were tried
# and refused. Ohio's siting docket, the local paper and one press mirror all
# declined automated retrieval. Those are per-source negatives, never absences,
# and nothing is inferred from what they would not serve.

meta:
  subject: >-
    Standing watch on the AES Ohio 345 kV build-out around the Wilmington campus
    corridor — PJM M-3 Need Dayton-2025-002 (the 500 MW Clinton delivery-point
    request), OPSB 25-0871-EL-BLN (the Fayette-Clinton line), the unnumbered
    Clinton substation expansion and Clinton customer feeds, and the customer
    attribution none of them makes
  kind: power-watch
  site: wilmington
  captured_for: issue 1469 (epic 1277, readiness(wilmington) — the power instruments)
  extracted_at: '2026-08-06'
  checked_on: '2026-10-27'
  checked_on_scope: >-
    The 2026-10-27 pass (pass_2026_10_27 below) re-ran: every 2026 PJM TEAC Dayton deck plus the
    2026-10-06 Dayton Local Plan submission, the AES Ohio response to OCC, and the three M-3 needs
    trackers; the 2025 Need/Solution decks; one PUCO DIS probe; the City of Wilmington post feed;
    the AES Ohio transmission-project index and project pages; FERC eLibrary metadata search; and
    the Ohio EPA eDocument portal (Clinton x AIR PERMIT). It did NOT re-run the Clinton County
    parcel layer, so the parcel facts (Clinton Substation and East Fork parcels, the 52.7 m /
    1,655.8 m distances) still stand as of 2026-08-06.
  previous_check: '2026-08-06'
  previous_previous_check: '2026-07-11'      # the research refresh recorded in the issue body
  method: >-
    Four routes. (1) PJM's own TEAC "Dayton Supplemental Projects" decks for all
    three 2026 meetings, read from their PDF text layers — the load ramps and the
    priced solution set. (2) The City of Wilmington's own website, which publishes
    the statutory service copy of AES Ohio's Letter of Notification for
    25-0871-EL-BLN; read off a 200-DPI render because the scan has no text layer.
    (3) AES Ohio's project pages and open-house PDFs, including one recovered from
    the Internet Archive after the live URL was unpublished. (4) The Clinton County
    auditor's CAMA parcel layer — the same layer SiteProfile.parcels_url uses — to
    locate the Clinton Substation and measure it against the committed corridor
    geometry. Direct probes of dis.puc.state.oh.us, opsb.ohio.gov and wnewsj.com
    failed and are recorded below as blocked routes rather than as empty results.

# ── What changed since the 2026-07-11 research ────────────────────────────────
delta_since_previous_check:
  - id: THE-1-5-GW-IS-FAYETTE-COUNTY
    tag: '[verified]'
    was: >-
      "The '1.5 GW' figure — press analysis of PJM interconnection filings ranks
      the Wilmington project second statewide (behind 2 GW Mt. Orab). The
      underlying filing is not in hand. [reference]"
    now: >-
      The underlying filing IS in hand, and it puts the 1.5 GW in the wrong
      county. PJM TEAC's 2026-07-07 Dayton Supplemental deck carries two AES Ohio
      large-load needs on consecutive slides: Dayton-2025-001, "in the vicinity of
      its Fayette Substation in Jeffersonville, OH", ramping 35 MW (9/2026) ->
      480 MW (9/2028) -> **1.5 GW** (1/2031); and Dayton-2025-002, "in the
      vicinity of its Clinton Substation near Wilmington, OH", ramping 35 MW
      (1/2028) -> 100 MW (4/2028) -> 300 MW (1/2029) -> **500 MW** (1/2030).
      Jeffersonville is in FAYETTE County. AES Ohio's own project pages for the
      two Fayette customer-feed cases say the same thing in its own words — "1.5
      gigawatts of load growth in the Jeffersonville, Ohio area", serving "a new
      data center customer near AES Ohio's Fayette Substation in Jeffersonville,
      Ohio". The 1.5 GW has never been Wilmington's number.
    consequence: >-
      Corrected in data/extracted/wilmington/data-centers.md and in the
      SiteProfile it_load_citation, both of which repeated the press
      misattribution. The corpus also contradicted ITSELF — the Urbana
      instrument-search record already had both counties right in a table — and
      that file's citation is corrected too.
  - id: WILMINGTON-HAS-ITS-OWN-DISCLOSED-RAMP
    tag: '[verified]'
    was: The disclosed interconnection/air-permit MW for the campus is [open].
    now: >-
      A disclosed load figure exists for the Clinton DELIVERY POINT: 500 MW of
      total requested new load by January 2030, in a PJM M-3 filing. It is
      facility demand at a delivery point, not IT load, and it names no customer.
      Read back through the repo's own PUE band (1.13-1.45) it implies roughly
      345-442 MW of IT load, which sits inside the existing floor-area screening
      bracket (144.0 / ~312 / 480.1 MW) and just under its high end. Two
      independent methods agree to within the width of the bracket.
    consequence: >-
      it_load_source stays SCREENING and the bracket is unchanged — see
      CAMPUS-ATTRIBUTION-STILL-OPEN. What changed is that the citation now names
      a real instrument instead of a misplaced press figure.
  - id: CAMPUS-ATTRIBUTION-STILL-OPEN
    tag: '[open]'
    statement: >-
      Need Dayton-2025-002 names a substation and a city. It does not name Amazon,
      Ardent, TAC, a parcel or a campus. The Clinton Substation parcel is 52.7 m
      from the nearest ARDENT/TAC petitioned-rezoning tract and 1,655.8 m (1.03
      mi) from the nearest AWS-owned Cosler Farm holding. The 500 MW cannot be
      assigned to either campus on the present record. This is the Van Wert #1408
      shape exactly, and the answer is the same: the facility domain does not rise
      on an instrument that documents the load but not the customer.
  - id: SUBSTATION-EXTENSION-PREMISE-RETIRED
    tag: '[verified]'
    was: >-
      "Clinton 345kV Substation Extension — second 345/69kV transformer + three
      new 345kV breakers (ring bus) ... [verified — AES Ohio project page]",
      listed as instrument 2 of the power thread.
    now: >-
      That project is OPSB 21-0679-EL-BNR: Construction Notice filed July 2021, approved August
      2021, built from October 2021, **in service June 2022**. Its stated need is
      69 kV loading and reliability, maintenance-outage flexibility, and ensuring
      "deliverability of the planned solar generation expansions along the
      Stuart-Clinton 345kV corridor". It is a completed reliability-and-solar
      project on the same side of the guardrail as Lynchburg, and the page issue
      #1469 cites for it has since been UNPUBLISHED (HTTP 403 Drupal "Access
      denied"); the record survives only in a single 2023-03-30 Wayback capture.
    consequence: >-
      Recorded at data/extracted/grid/wilmington/clinton-substation-extension-2021.project.yaml
      and fenced out of the load thread. The CURRENT Clinton substation expansion
      is a different scope — see CLINTON-SUBSTATION-CASE-NUMBER below.
  - id: THE-LINE-ACCELERATED-AND-GOT-DEARER
    tag: '[verified]'
    statement: >-
      Between solution meetings AES Ohio moved the Clinton-Fayette 345 kV line's
      projected in-service from 2031-12-01 to **2030-01-18** while raising its
      estimate from $100M to **$187M**, and moved the whole two-need portfolio
      from $480M to **$589.8M** with status going Conceptual -> Engineering. The
      Clinton substation expansion moved the other way on price ($75M -> $65.4M)
      and later on date (1/2028 -> 12/31/2028), and its 250-MVAR SVC became a
      150-MVAR STATCOM.

# ── Filings that have not been made, or not been found ────────────────────────
open_filings:
  - id: CLINTON-SUBSTATION-CASE-NUMBER
    tag: '[open]'
    what: >-
      The OPSB case number and project page for the CURRENT Clinton 345 kV
      substation expansion — "accommodate the additional 345 kV line, 2 customer
      feeds, one 300-MVAR capacitor", $65.4M, projected in service 2028-12-31.
    why_watchable: >-
      AES Ohio's own fact sheet states that "Associated projects have separate
      Ohio Power Siting Board (OPSB) filings and project websites", so the filing
      is promised by the applicant. The Fayette-end siblings are already numbered
      and public (Fayette substation expansion 1 = 25-0258-EL-BNR; Fayette
      Customer East = 25-0742-EL-BLN; Fayette Customer West = 25-0743-EL-BLN), so
      the Clinton-end ones should surface the same way.
    where_to_look: aes-ohio.com/transmission-improvements (the project index), and the City of Wilmington's news feed, which served the line's LON
    answered_2026_10_27:
      tag: '[verified]'
      statement: >-
        The case number exists: OPSB 26-0462-EL-BLN, "Clinton Substation Expansion 1 Project",
        per AES Ohio's own project page (https://www.aes-ohio.com/clinton-substation-expansion-1-project,
        read 2026-10-27). Scope in AES's words: expand the substation fence line "to accommodate
        an additional 345 kV line installed as part of the Fayette to Clinton 345-kilovolt (kV)
        Transmission Line Project, two customer feeds, and a new compensator"; modify the existing
        ring bus; install nine breakers. Location: East Dalton Road, Washington and Union
        Townships, Clinton County. Estimated schedule on the page: LON filed June 2026, OPSB
        approval September 2026, construction November 2026, in service January 2028. The page
        does not name a customer.
      caveats: >-
        The page's "current project stage" marker is graphical and did not survive text
        extraction, so which milestone AES says it has reached is [open]. The docket itself is
        UNSEARCHED (PUCO DIS blocked), so the LON, its affected-property table and any Board
        action are unobtained. AES's January 2028 in-service does not match PJM's 2026 Local Plan
        for the same scope (capacitor 12/31/2028, STATCOM 12/1/2030) — two sources, two dates,
        recorded as a discrepancy and not reconciled.
  - id: CLINTON-CUSTOMER-FEED-CASES
    tag: '[open]'
    what: >-
      The OPSB filings for "Customer Service Lines from Clinton 1 & 2" — two
      ~2-mile 345 kV single-circuit feeds "to the customer substation", $20M,
      projected in service 2028-12-31.
    why_watchable: >-
      THE highest-value open filing on this site. The Fayette equivalents each got
      their own numbered LON with a public project page, and those pages are what
      named the customer's industry and county. A Clinton 1 & 2 filing would carry
      an affected-property table, and a ~2-mile feed from a known substation to a
      named parcel is exactly the instrument that would close CAMPUS-ATTRIBUTION.
    what_it_would_settle: >-
      Whether the 500 MW at Clinton is the AWS Cosler Farm campus, the Ardent/TAC
      corridor, or both — and therefore whether the site's facility domain can
      move off a screening bracket.
    pass_2026_10_27:
      tag: '[open]'
      statement: >-
        Still no numbered filing found. AES Ohio's transmission-project index (read 2026-10-27)
        carries no page for the Clinton customer feeds; the same index did list the
        Fayette-Clinton line, Fayette Customer East/West and Lynchburg pages (positive control).
        Per AES Ohio's project page for the Clinton Substation Expansion 1 (LON 26-0462-EL-BLN), that
        case covers the substation-side terminations for "two customer feeds", not the feed lines
        [reference — the LON itself was not read; DIS is blocked]. A SECOND route to the customer
        now exists — see pass_2026_10_27.FERC-CSA-FOR-CLINTON.
  - id: NEXT-TEAC-CYCLE
    tag: '[open]'
    what: >-
      The next PJM TEAC Dayton Supplemental deck. Dayton-2025-002 was at Solution
      Meeting stage on 2026-07-07; the M-3 process gives stakeholders ten days
      from each meeting to comment, after which a solution proceeds toward the
      Local Plan / RTEP.
    why_watchable: >-
      Each cycle has revised this need's numbers in place. A later deck could
      raise or lower the 500 MW, split the need, or — as the Fayette pages did —
      describe the customer.
    where_to_look: https://www.pjm.com/committees-and-groups/committees/teac
    note: >-
      Read every Dayton deck in the year, not just the newest. The Wilmington
      request appears in the 2026-07-07 deck and in neither the 2026-02-03 nor the
      2026-05-08 one; a single-deck check would have missed it.
    answered_2026_10_27: >-
      [verified] No Dayton Supplemental deck was posted after 2026-07-07 (TEAC 2026-08-04,
      2026-09-08 and 2026-10-06 carry none; 2026-11-03 had only PPL/BGE/UGI/DOM items posted as of
      2026-10-27). The need instead LEFT the Solutions stage: AES Ohio's "Dayton Local Plan
      Submission of the Supplemental Projects for 2026", an informational item at TEAC 2026-10-06,
      carries Dayton-2025-002 at Process Stage "Submission of Supplemental Project for Inclusion in
      the Local Plan 09/15/2026", supplemental IDs s3898.1-.9, 500 MW ramp and $589.8M unchanged
      from 07-07. Detail in pass_2026_10_27.
  - id: SWOAQA-AIR-PTI
    tag: '[open]'
    what: A Southwest Ohio Air Quality Agency permit-to-install for the campus's emergency-generator fleet.
    why_watchable: >-
      The 252 Tier-4 gensets are disclosed by COUNT only, with no per-unit rating
      on any record, so no backup figure can be formed without inventing one. An
      air PTI would state the ratings and give a second, independent route to the
      load. Clinton County air permitting is SWOAQA, NOT the statewide Ohio EPA
      eSuite — a trap this site has already recorded.
    note: >-
      Ohio EPA's eDocument portal (edocpub.epa.ohio.gov) is open to scripted
      retrieval and is worth a second pass by entity name even so, since some
      delegated-agency documents still land in the state system.
    pass_2026_10_27: >-
      [open] Controlled negative — no air document surfaced. Detail in
      pass_2026_10_27.SWOAQA-AIR-PTI. Not proof no application exists.
  - id: EAST-FORK-SUBSTATION
    tag: '[open]'
    what: >-
      AES Ohio's "East Fork" substation — Clinton County parcel
      070-03-34-10-0001-00, King Rd, Clark Township, 9.582 ac, conveyed to Dayton
      Power & Light on 2024-07-30, legal description "AES OHIO EAST FORK
      SUBSTATION LOT 1".
    why_watchable: >-
      A substation on land the utility bought in 2024, about 6.5 miles from the
      campus corridor, that appears on no captured AES project page and in no PJM
      deck read here. Purpose, voltage and OPSB case all unknown. Surfaced by the
      parcel query that located Clinton Substation; recorded so it is not lost.
    pass_2026_10_27: >-
      [open] Zero mentions of "East Fork" in every 2026 Dayton deck, the 2026-10-06 Local Plan,
      the 2025 Need/Solution decks, the AES Ohio transmission-project index, or the City of
      Wilmington post feed. The parcel layer was NOT re-run this pass.
  - id: OPSB-DISPOSITION-25-0871
    tag: '[open]'
    what: >-
      What the Board did with 25-0871-EL-BLN — whether the seven intervention
      petitions filed 2026-04-03 were granted, whether Staff filed a report,
      whether a hearing was set, and whether the case has been decided.
    why_watchable: >-
      Seven intervenors within the ten-day window is contested-case behaviour on
      an accelerated Letter of Notification track. The tension is real and
      unresolved; see fayette-clinton-345kv.project.yaml, opsb_case.track_note.
    blocked_by: the PUCO DIS route below
    answered_2026_10_27:
      tag: '[verified]'
      statement: >-
        The Board APPROVED the line, per the PUCO's own press bulletin of 2026-08-20, "OPSB approves
        energy projects in Carroll, Vinton, and Clinton and Fayette counties"
        (https://content.govdelivery.com/accounts/OHPUC/bulletins/425ebee). It reports approval of
        "AES Ohio's plan to construct an electric transmission line in Clinton and Fayette
        counties": a 345 kV single-circuit line of about 29 miles on a 200-ft right-of-way, "needed
        to meet the growing demand for network enhancements created by large customer projects in
        the area"; construction to begin September 2027, in service January 2030.
      what_is_verified_and_what_is_not: >-
        [verified] that the agency's bulletin states approval. [inference] that it is
        25-0871-EL-BLN — the bulletin carries no case number, but the scope (AES Ohio,
        Clinton-Fayette, 345 kV single circuit, Jan 2030) matches and no other such case is known.
        One discrepancy is unreconciled: the bulletin says "about 29 miles", while the PJM Local Plan
        entry s3898.6 (below) reads ~27 mi.
        [open] the Board's entry itself — its conditions, its rulings on the seven intervention
        petitions, and any Staff report — all unobtained because DIS is still blocked (re-probed
        below). The bulletin says nothing about the intervenors, so whether the case was contested
        to the end is not known. AES Ohio's own project page still reads "filed an application in
        March of 2026", i.e. it has not been updated for the approval.

# ── Routes tried and refused ──────────────────────────────────────────────────
blocked_routes:
  - route: PUCO / OPSB Docketing Information System — dis.puc.state.oh.us
    tag: '[verified]'
    probed: '2026-08-06'
    result: >-
      Plain request: HTTP 200 with a 245-byte "Request Rejected ... Your support
      ID is <11974344142440136380>" body. Full browser headers: HTTP 200 with a
      7,554-byte F5/BIG-IP `bobcmn` JavaScript bot challenge. Sixth confirmation
      of this block in this repo (Findlay #1464, Bowling Green #1437, Van Wert
      #1408 twice, and here).
    consequence: >-
      The 25-0871-EL-BLN docket is UNSEARCHED. The application, its route
      exhibits, its affected-property tables, the seven petitions, Staff's report
      and the Board's entry are all unobtained. Nothing is inferred from the
      silence of a route that refused to answer.
    reprobed_2026_10_27: >-
      https://dis.puc.state.oh.us/CaseRecord.aspx?CaseNo=25-0871-EL-BLN — HTTP 200 with a 244-byte
      "Request Rejected" body (support ID <9281071327677848436>); identical over HTTP/1.1, and the
      bare origin returns the same 244 bytes. Still blocked. Applies equally to the new
      26-0462-EL-BLN (Clinton Substation Expansion 1), which is therefore also UNSEARCHED.
  - route: FERC eLibrary document download (elibrary.ferc.gov)
    tag: '[verified]'
    probed: '2026-10-27'
    result: >-
      The metadata search API (POST /eLibrarywebapi/api/Search/AdvancedSearch) answers. The file
      download endpoints do not: GET returns 405, POST returns 401, and the legacy filedownload
      URL returns only the single-page-app HTML shell.
    consequence: >-
      Filing DESCRIPTIONS can be searched, filing CONTENTS cannot be read from here. A Clinton
      CSA filed under a description that does not name Clinton or Wilmington would be invisible
      to this route. See pass_2026_10_27.FERC-CSA-FOR-CLINTON.
  - route: opsb.ohio.gov pretty-URL case pages
    tag: '[verified]'
    probed: '2026-08-06'
