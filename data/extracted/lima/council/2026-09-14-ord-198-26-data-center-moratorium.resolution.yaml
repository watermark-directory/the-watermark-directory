  what_this_instrument_does_not_establish:
    - >-
      IT DOES NOT STOP THE GOOGLE / AMERICAN TOWNSHIP CAMPUS, AND IT DOES NOT PURPORT TO. Limb 1
      reaches development only inside Lima's corporate limits, and the campus is in American
      Township. Limb 2 reaches City water outside those limits but only as to NEW requests, and
      Section 1's last sentence exempts preexisting contracts. Two independent reasons, neither of
      which requires the other.
    - >-
      IT NAMES NO OPERATOR, NO PROJECT AND NO PARCEL. "Google", "American Township", and every
      project name appear ZERO times in the enacting text. The only place Google is named anywhere
      in this record is the administration's transmittal memo.
    - >-
      IT IMPOSES NO STANDARD. The ordinance pauses processing; it sets no water, discharge, noise,
      height, setback, lighting, generator or load condition. The standards are the WORK the pause
      was bought to allow, and they do not exist yet.
    - >-
      IT SETS NO NUMERIC WATER THRESHOLD. Limb 2 reaches "new requests for City-supplied water for
      data center developments" at any volume; there is no gallonage trigger in the text.
    - >-
      IT ESTABLISHES NO PASSAGE. See `passage`.
