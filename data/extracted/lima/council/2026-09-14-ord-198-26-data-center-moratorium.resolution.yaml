  instrument: >-
    City of Lima Ordinance 198-26 — an eighteen-month moratorium on the establishment, development,
    processing, review and approval of new stand-alone data-center development within the corporate
    limits of the City of Lima, and on new requests for City-supplied water for data-center
    developments outside those limits, introduced at the regular council meeting of 2026-09-14
  ordinance_no: '198-26'
  body: Council of the City of Lima, Ohio
  body_kind: city_council
  subject_matter: development_moratorium
  introduced: '2026-09-14'      # [verified] agenda p. 0 heading + packet p. 6 item VI. 198-26
