  title_verbatim: >-
    AN ORDINANCE ENACTING AN EIGHTEEN-MONTH MORATORIUM ON THE ESTABLISHMENT, DEVELOPMENT,
    PROCESSING, REVIEW AND APPROVAL OF NEW STAND-ALONE DATA CENTER DEVELOPMENT WITHIN THE CITY OF
    LIMA AND ON NEW REQUESTS FOR CITY SUPPLIED WATER FOR DATA CENTER DEVELOPMENTS OUTSIDE THE
    CORPORATE LIMITS
  title_source: packet p. 154 (the ordinance's own first page)
  title_variant_note: >-
    [verified] The AGENDA's listing of the same ordinance (p. 6) prints "date center developments"
    for "data center developments". A typo in the agenda, not in the instrument. Recorded rather
    than corrected, per chain of custody.

  section_1_verbatim: >-
    Lima City Council hereby imposes a moratorium on further processing of any application for any
    building permits, certificates of occupancy, conditional use, zoning approvals or any other
    administrative actions and approvals for standalone data center development within the
    corporate limits of the City of Lima, Ohio, or new requests for City-supplied water for data
    center developments outside the corporate limits of the City or other actions embodied within
    the provisions above, to allow the administration additional time to study the issues involved
    to determine whether legislative changes are needed to enhance the effectiveness of the
    administration's goals regarding economic development, and to ensure the public peace, health,
    safety, and welfare of its citizens. The moratorium shall be effective from the date of passage
    of this ordinance and ending on the earlier of: (1) the effective date of an ordinance
    regulating or prohibiting new standalone data centers within the City of Lima, Ohio, or new
    requests for City-supplied water for data center developments outside the corporate limits of
    the City; or (2) eighteen-months from the date of passage of this ordinance. This ordinance
    shall be prospective in nature and shall not affect any preexisting contracts entered into
    prior to passage of this ordinance.

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # THE TWO LIMBS. The single highest-risk misreading of this instrument is to describe it as
  # "city-limits-only". Section 1 has TWO limbs and they have DIFFERENT geographies.
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  scope:
    limb_1_development:
      what: >-
        [verified] p. 155. Further processing of any application for building permits, certificates
        of occupancy, conditional use, zoning approvals, or any other administrative action or
        approval, for standalone data-center development.
      where: >-
        [verified] "within the corporate limits of the City of Lima, Ohio". CITY LIMITS ONLY. This
        limb reaches no development in any township.
    limb_2_water:
      what: >-
        [verified] p. 155. NEW REQUESTS for City-supplied water for data-center developments.
      where: >-
        [verified] "outside the corporate limits of the City". ⚠️ THIS LIMB REACHES OUTSIDE THE
        CITY. It is not a development control — Lima cannot zone a township — it is a control on
        Lima's own act as a water supplier, and it is exactly as extraterritorial as the City's
        water main. Any statement that "the moratorium applies only inside the city" is wrong
        about this limb.
    undefined_terms:
      - >-
        [open] "STANDALONE" / "STAND-ALONE" IS NOT DEFINED. The preamble defines "data center" at
        length (p. 154) and never defines "standalone". The instrument therefore does not settle
        whether a data center accessory or ancillary to another principal use is inside or outside
        the moratorium. The title hyphenates ("STAND-ALONE"), Section 1 does not ("standalone");
        both forms are the instrument's own.
      - >-
        [open] "NEW REQUESTS" IS NOT DEFINED either. Whether a request pending on the date of
        passage is "new" is not answered in the text, and the preexisting-contracts sentence
        addresses CONTRACTS, not pending requests.

  clock:
    # An 18-month clock and an early-exit condition are two different facts. Both are here.
    duration: eighteen months
    runs_from: >-
      [verified] p. 155 — "effective from the date of passage of this ordinance". A PASSAGE-RELATIVE
      clock, not a calendar date. The instrument names no start date and no end date.
    ends_on_the_earlier_of:
      - >-
        [verified] (1) "the effective date of an ordinance regulating or prohibiting new standalone
        data centers within the City of Lima, Ohio, or new requests for City-supplied water for data
        center developments outside the corporate limits of the City" — the EARLY EXIT. Note it
        tracks BOTH limbs: standards for the city-limits limb alone would not, on this text, end the
        water limb.
      - '[verified] (2) "eighteen-months from the date of passage of this ordinance".'
    end_date: >-
      [open] UNCOMPUTABLE FROM THE INSTRUMENT. Both branches run from the date of passage, and
      passage is not established (see `passage`). If the ordinance passed at the 2026-09-14 meeting
      the outer limit would fall in mid-March 2028 — that is an [inference] resting on a
      [reference] passage date and is deliberately NOT recorded as a date anywhere in this file.

  preexisting_contracts_carve_out:
    verbatim: >-
      This ordinance shall be prospective in nature and shall not affect any preexisting contracts
      entered into prior to passage of this ordinance.
    page: 155
    note: >-
      ⚠️ [verified] THE ORDINANCE NAMES NEITHER GOOGLE NOR AMERICAN TOWNSHIP. Its carve-out is
      generic — "any preexisting contracts". The identification of the Google water commitment as
      one such contract is made in the ADMINISTRATION'S TRANSMITTAL MEMO (p. 43), not in the
      enacting text, and the memo is a request for legislation rather than the legislation. Both
      facts are [verified]; they are different facts, from different documents, doing different
      work, and a register that merges them into "the ordinance exempts Google" has asserted
      something no instrument says.

  emergency_clause:
    section_5_verbatim: >-
      In accordance with City Charter Section 33, and for the reasons set forth in the Preamble
      above, this ordinance is considered as an administrative emergency, and shall take effect and
      be in force forthwith upon passage by an affirmative vote of at least two-thirds of the
      members elected to council at the first reading hereof. If it does not so pass at first
      reading, it shall take effect and be in force forthwith upon passage by an affirmative vote
      of at least two-thirds of the members elected to council at the second reading hereof. If it
      does not so pass at second reading then it shall take effect and be in force forthwith upon
      passage by an affirmative vote of at least a majority of the members elected to council at
      the third reading hereof. Otherwise, it shall take effect and be in force from and after the
      earliest period allowed by law.
    page: 156
    note: >-
      [verified] A CASCADING clause, not a bare emergency. It permits immediate effect on a 2/3
      vote at first reading and falls through to second and third readings if that vote is not
      there. So "declared an administrative emergency in the text" and "passed as an emergency" are
      different claims, and only the first is established here.
    pro_forma_check: >-
      [verified] The same Charter §33 clause appears on the other instruments in this packet, and
      two were read to check it: 196-26 (shared living facilities) at p. 149 declares an
      "administrative emergency" in identical words, and 197-26 (the 2026 budget amendment) at
      p. 151 declares an "operational emergency" in the same cascading form. A third instance was
      seen at p. 145 ("operational emergency"), on an ordinance not identified in this read. So the
      clause is Lima's standard ordinance form and its presence is NOT evidence that this ordinance
      was treated as unusually urgent. Recorded because the opposite reading is available and wrong.
      [open] Which of "administrative" and "operational" emergency the Law Department applies to
      what, and whether the choice carries any legal consequence under the Charter, is not
      established here — the Lima City Charter §33 text is not in this corpus.
    divergence_from_the_request: >-
      [verified] The Mayor's and Utilities Director's own transmittal memo asked that any
      legislation "Proceed through the normal legislative process and not as an emergency measure"
      (p. 44). The drafted ordinance declares itself an administrative emergency (pp. 155, 156).
      The divergence is on the face of two documents in the same packet. Given the pro-forma check
      above, whether it was a deliberate departure or the Law Department's boilerplate is [open],
      and it is recorded as a divergence rather than characterized as a defiance.

  preamble_findings:
    # Council's own recitals — what the legislative body put on the record as its reasons.
    page: 154
    verbatim_excerpts:
      - >-
        WHEREAS, the growth of artificial intelligence has coincided with a rapid growth of large
        data centers across Ohio and the United States; and,
      - >-
        WHEREAS, some data centers use millions of gallons of fresh water per day for cooling; and,
      - >-
        WHEREAS, the City of Lima remains confident in its ability to meet the commitments of now
        existing agreements for providing water for data centers; and,
      - >-
        WHEREAS, additional requests for the City of Lima's water capacity by large or "hyperscale"
        data centers located outside the corporate limits of the municipality will require
        evaluation of the City's available water capacity, our ability to continue serving existing
        customers, the infrastructure provided to serve the development, and the terms under which
        that service would be provided; and,
      - >-
        WHEREAS, a data center seeking to locate within Lima's corporate limits would require a much
        broader level of municipal review than a development located outside the City for which
        Lima's role is primarily that of a utility provider; and,
    note: >-
      [verified] THE RECITALS ARE A WATER ARGUMENT AND A JURISDICTION ARGUMENT, IN THAT ORDER. The
      water recital is generic ("some data centers"), asserts nothing about any Lima project, and
      is not a finding about the City's own capacity — the very next recital says the opposite
      about the City's capacity. The jurisdiction recital is the ordinance's own explanation for
      why its two limbs have different geographies.

