# City of Lima Ordinance 198-26 — the eighteen-month data-center moratorium, introduced 2026-09-14
#
# ⚠️ The first line above is read VERBATIM as this record's label in the yidam corpus mirror
# (watermark.site.corpus_records._title takes the leading YAML comment block's first `# ` line), so
# it is written to stand alone. Do not wrap it.
#
# TWO LIMBS, DIFFERENT GEOGRAPHIES: the ordinance pauses new stand-alone data-center development
# INSIDE the City's corporate limits, AND new requests for City-supplied water for data-center
# developments OUTSIDE them. See `resolution.scope`.
#
# CUSTODY CAVEAT (the whole reason this file is shaped the way it is): what is committed is the
# ordinance AS INTRODUCED, printed at pp. 154-156 of the meeting packet the City published
# 2026-09-10, four days before the meeting. It is unsigned, its vote grid is blank, and it prints
# "Passed: ____, 2026". As of `as_of` below the City publishes NO minutes for this meeting. So the
# ordinance's TEXT is verified to a page and its PASSAGE is not verified at all — the two are held
# apart throughout, and every passage-dependent fact (effective date, the end of the eighteen-month
# clock, the tally, the mover, the reading) is [open]. Secondary coverage reports passage; coverage
# is [reference] and is not promoted here.
#
# TAG VOCABULARY: [verified] = read off the document's own pages at the cited page; [inference] =
# reasoned from [verified] facts, labelled; [reference] = secondary source, lead only; [open] = not
# established here.

