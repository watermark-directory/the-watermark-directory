    ## 2 — Bistrozzi LLC data center ("Project BOSC"), American Township

    The one confirmed data-center campus in Allen County. Every figure belongs to a committed
    extraction; the register repeats, it does not re-derive.

    - Developer of record **Google** [verified]; entity of record **Bistrozzi LLC**, 1700 K St NW,
      Washington DC, contact Michael Montfort [verified].
    - Site N. Cole Rd. & W. Bluelick Rd., **American Township, Allen County** [verified]. A
      "Lima, OH 45801" mailing address is NOT a City of Lima address.
    - **115 gensets = 114 data-hall + 1 HUBGEN**; **36 cooling towers**; three generator groups of
      38 and three tower groups of 12, corroborating a three-data-hall campus [verified].
    - **~313 MW backup, TRANSCRIBED not multiplied** — the `~` rides as data. Per-engine 2.75 MW
      (~2,750 ekW) is [verified: draft only], CBI-redacted in the issued permit. **IT ~275 MW is
      [inference]**, never a disclosure. **End use is [open] on purpose.**
    - Allen County CRA No. 1 (Res. #304-25, American + Sugar Creek Twps) and the CRA Agreement
      (Res. #548-25, 2025-07-10): **75% real-property abatement, 15 years per Building** [verified].
      Elida School District PILOT **$250,000/yr PROPOSED** [verified as a proposal] — the EXECUTED
      amount is [open], withheld as non-public in the CRA and the school notices. Roadwork Development Agreement
      (Res. #588-25) **$14.5M Company Contribution** against a $14,223,081 Tetra Tech OPC
      construction total [verified] — with a §5.5 Overpayment Amount that **refunds public grant
      money to the Company**, so the "private contribution" may be net-reduced [inference].
    - Ottawa mainstem **7Q10 0.2 cfs, 1Q10 0 cfs** [verified]; net basin loss at buildout
      **≈4.85 cfs ≈24x the 7Q10** [inference: derived].

    ⚠️ **The 2026-09-14 City of Lima moratorium (Ord. 198-26) does not stop this campus** — on the
    DEVELOPMENT limb, which is enough: the campus is in American Township and that limb reaches
    only inside Lima's corporate limits. The WATER limb is a separate question this register does
    not answer: Section 1 exempts "any preexisting contracts", but no executed Lima water-service
    contract for the campus is in this corpus (PAAC records one "underway" 2025-05-01) and "new
    request" is undefined, so its application here is [open].
    The ordinance names neither Google nor American Township — that
    identification is in the Mayor's transmittal memo, a different document.
