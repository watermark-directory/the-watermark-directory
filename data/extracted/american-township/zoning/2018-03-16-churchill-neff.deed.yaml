# ⚠️ THIS IS A HAND-AUTHORED READING, NOT A RENDER EXTRACTION, AND THAT HAS A CONSEQUENCE.
# `watermark.pipeline.corpus._classify` claims a `deed:` block only when the artifact carries the
# render envelope (`doc_id`/`dpi`/`kind`/`source_path`) that `DeedExtraction` requires. Those four
# fields describe a vision render performed by `extract_deed`, and no such render happened here —
# so this file DECLINES out of the pipeline corpus loader by design. Inventing the envelope to
# make it validate is the one thing that must not be done; it would assert a machine read that
# does not exist.
#
# WHY `extract_deed` COULD NOT PRODUCE THIS. The extractor reads a document's FIRST pages
# (`max_pages=8`, i.e. indices 0-7) and exposes no page offset. This deed sits at indices 11-14,
# bound at the back of a 15-page conditional-use packet, so the genre's own reader cannot reach
# it. That is a real limitation of the deed genre — it assumes a deed begins at page 0 — and it
# is recorded here rather than worked around.
#
# WHAT IT COSTS: this reading reaches the `records` feed through `watermark.site.records`
# (group `deeds`) but NOT `corpus.deeds`, so it contributes no entity-graph or timeline rows.
# The Churchill → Neff conveyance is therefore readable on the site and absent from the graph.
# Closing that needs a `deed_transcribed` kind and model alongside `npdes_transcribed`, or a page
# offset on `extract_deed` — either is its own reviewed change. See `open_questions`.

