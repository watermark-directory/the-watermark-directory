# Ohio General Warranty Deed 201803160002723 — Churchill Farm LLC to Neff Farms, the 2018 assembly of the Cole Street land, recorded 2018-03-16
#
# ⚠️ The first line above is read VERBATIM as this record's label in the yidam corpus mirror
# (watermark.site.corpus_records._title takes the leading YAML comment block's first `# ` line), so
# it is written to stand alone. Do not wrap it.
#
# WHY THIS IS A SEPARATE ARTIFACT. These four pages are bound into the back of the scanned
# conditional-use-permit packet (`2025FebConditionalUserPermitDecisionLetter.pdf`, pp. 11-14) as a
# title attachment, but they are a DIFFERENT INSTRUMENT, executed seven years earlier by parties
# who are not parties to the 2025 zoning proceeding. Modelling them inside the CUP record would
# date the conveyance to 2025 and put a 2018 grantor in a 2025 hearing. The decision record is
# `./2025-02-04-bza-2024-12-cup.resolution.yaml`.
#
# CUSTODY CAVEAT: the same third-party-custody scan, with the same zero text layer — every field
# here is a vision read of a pypdfium2 render at 300-400 DPI. The page header shows the packet was
# printed from the Allen County recorder's online portal on 12/3/24, eight days before the first
# BZA hearing. The recorder's own certified copy would supersede this read; see `open_questions`.
#
# TAG VOCABULARY: [verified] = read off the document's own pages at the cited page; [inference] =
# reasoned from [verified] facts, labelled; [reference] = secondary source, lead only; [open] = not
# established here.

