findings:
  land_assembly_predates_the_project:
    claim: >-
      [verified] THE COLE STREET LAND WAS ASSEMBLED IN MARCH 2018 — nearly seven years before the
      conditional-use application was filed (2024-11-14) and roughly seven and a half before
      American Township adopted a data-center use category (2025-09-08).
    note: >-
      [open] This establishes a date, not a motive. Nothing in this deed mentions a data center, a
      developer, an option, or an assignment, and the grantee is a farm entity acquiring farmland
      carried by the auditor as CAUV. Any claim that the 2018 purchase was made FOR this project
      would need an option, purchase agreement or assignment that is not in this corpus.
  the_deed_was_pulled_for_the_hearing:
    claim: >-
      [inference] SOMEONE PULLED THE TITLE FOR THE HEARING. The portal print header dates the
      retrieval to 2024-12-03, 10:19 AM — the SAME DATE the BZA worksheet records the application
      being "Amended December 3, 2024" to add parcel 36-1200-02-001.000, and eight days before the
      first public hearing.
    resting_on:
      - '[verified] p. 11-14 print header "12/3/24, 10:19 AM".'
      - >-
        [verified] BZA hearing worksheet, p. 6 of the same packet: "Amended December 3, 2024
        (#36-1200-02-001.001 & #36-1200-02-001.000)".
    therefore: >-
      The deed print and the parcel amendment fall on one day, and the deed is the instrument that
      names .000. [open] WHO pulled it, and whether the retrieval caused the amendment or merely
      documented it, is not established — a print header records a moment, not an actor.

open_questions:
  - >-
    CERTIFIED COPY. Pull instrument 201803160002723 from the Allen County Recorder directly. That
    replaces a scan-of-a-print-out with a primary record, and should settle the grantee's tax
    mailing address and the conveyance fee that are illegible here.
  - >-
    ⚠️ THE SPLIT THAT CREATED PARCEL .001. The permitted parcel does not appear in this deed. Find
    the instrument (or auditor split) that divided 36-1200-02-001.000 and created .001, and the
    current ownership of both. This is the missing link between the 2018 assembly and the 2025
    permit, and it is a straightforward recorder/auditor pull.
  - >-
    NEFF FARMS INC. vs NEFF FARMS LLC — Ohio Secretary of State business filings for both
    (`watermark extract --kind sos`). Also: is Churchill Farm, LLC still active, and who are its
    members besides Sarah Churchill Everett?
  - >-
    OR 2017, PAGE 6801 — the instrument Churchill Farm claims title through, and the source of
    "Tract One" in the survey. One recorder pull upstream in the chain.
  - >-
    LACRPC EXEMPTED LAND DIVISION LOG #2018-14 — the planning commission's own file on this
    division. `data/documents/lacrpc/` is already a corpus collection.
  - >-
    ⚠️ THE `deeds` RECORD GROUP IS UNNAVIGABLE, and this artifact inherits the defect rather than
    causing it. `watermark.site.records._record_title` probes `instrument_type` BEFORE
    `instrument`, so every deed renders as its instrument type: the seven records in the group
    carry three distinct titles between them — four "Limited Warranty Deed", two "General Warranty
    Deed", and this one "Ohio General Warranty Deed" — with nothing naming the parcel, the parties
    or the date. This file deliberately does NOT work around it by withholding `instrument_type`:
    a per-artifact dodge would make one deed inconsistent with six and hide a shared problem. The
    fix belongs in `_record_title` (or in a deed-specific title probe over grantor/grantee/
    instrument_no) and is its own change.
  - >-
    ⚠️ THE DEED GENRE CANNOT READ A DEED BOUND AT THE BACK OF A PACKET. `extract_deed` reads
    indices 0-7 and exposes no page offset, so this instrument at indices 11-14 is unreachable by
    the genre's own extractor, and a hand reading then declines out of `corpus.deeds` for want of
    a render envelope. Two candidate fixes, either its own reviewed change: a page offset on
    `extract_deed`, or a `deed_transcribed` kind and model alongside `npdes_transcribed`. Until
    one lands, this conveyance is on the site and off the entity graph.
  - >-
    THE 40.07-ACRE SUGAR CREEK PARCEL (36-0100-03-002.000) has no role in the BZA record and is in
    a different township. Establish whether it is still held by the same owner and whether it
    bears on the campus at all, or record it as out of scope.

