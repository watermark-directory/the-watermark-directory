resolution:
  instrument: >-
    American Township (Allen County, Ohio) Conditional Use Permit No. 103, issued by the Township
    Zoning Inspector on the affirmative finding of the American Township Board of Zoning Appeals in
    Case #BZA 2024-12, approving a three-building data center complex with operations building and
    security office at 4110 N. Cole Street, Lima, Ohio 45801
  permit_no: '103'                # [verified] p. 0 — printed "PERMIT No. 103 / ______" (the
                                  # second field of the form is left blank on the face)
  case_no: 'BZA 2024-12'          # [verified] p. 0 and p. 1. The hearing worksheet (p. 6) and the
                                  # attendance sheet (p. 9) print it unspaced as "BZA2024-12",
                                  # which is also the form the township trustee minutes use.
  body: American Township Board of Zoning Appeals
  body_kind: township_board_of_zoning_appeals
  subject_matter: conditional_use_permit
  outcome: approved_with_conditions

  date_issued: '2025-02-04'       # [verified] p. 0 "DATE ISSUED: 02-04-2025"
  decided: '2025-01-08'           # [verified] p. 0, p. 1 — the date the Board voted
  written_notice_filed: '2025-02-04'  # [verified] p. 0 "with formal written notice filed
                                      # February 4, 2025"; p. 1 DATE line
  hearings: ['2024-12-11', '2025-01-08']   # [verified] p. 0, p. 1 — two open public hearings,
                                           # the second a continuance of the first
  signed_by: 'Denny Schwinnen, Chairman, American Township Board of Zoning Appeals'
  signature_date_as_written: '2-4-2025'    # [verified] p. 0 and p. 3, both handwritten by the
                                           # signer alongside a signature

  # ⚠️ THE PERMIT'S FACE EXPIRY HAS PASSED. Recorded as its own block because it is the single
  # most consequential fact on p. 0 and the easiest to read past.
  expiry:
    printed: '2026-02-04'         # [verified] p. 0 "EXPIRES: 02-04-2026"
    rule_verbatim: >-
      In accordance with Article 17.10 – "Expiration of Conditional Use Permit" a conditional use
      permit shall be deemed authorized for only one particular conditional use, and said permit
      shall automatically expire if such conditionally permitted use has not been instituted or
      utilized within one (1) year of the date on which the permit was issued, or if for any reason
      such use shall cease for more than one (1) year.
    rule_pages: [0, 3]
    status: >-
      [open] AS OF `as_of` (2026-09-19) THE PRINTED EXPIRY IS SEVEN MONTHS PAST. Whether the use
      was "instituted or utilized" before 2026-02-04, whether an extension or a renewed permit
      issued, and whether a successor instrument exists are ALL unestablished — this corpus holds
      no American Township zoning record after this one. Do NOT state that the permit lapsed: the
      instrument states a condition, not an outcome, and Article 17.10's trigger is a question of
      fact about construction on the ground that no document here answers. Do not state that it
      remains in force either. See `open_questions`.

  # ───────────────────────────────────────────────────────────────────────────────────────────
  # THE PARCEL AND THE PROJECT
  # ───────────────────────────────────────────────────────────────────────────────────────────
  subject_property:
    address: '4110 N. Cole Street, Lima, Ohio 45801'   # [verified] pp. 0, 1, 6
    section: 'Section 12, American Township, Allen County, Ohio'   # [verified] pp. 0, 1
    parcels_on_the_permit_face: ['36-1200-02-001.001']
    parcels_on_the_decision_letter: ['36-1200-02-001.000', '36-1200-02-001.001']
    parcel_discrepancy: >-
      ⚠️ [verified] THE PERMIT AND ITS OWN DECISION LETTER NAME DIFFERENT PARCEL SETS. The permit
      face (p. 0) identifies ONE parcel, 36-1200-02-001.001. The decision letter's PROPERTY
      LOCATION block (p. 1) names TWO, 36-1200-02-001.000 AND 36-1200-02-001.001 — and the
      letter's own WHEREAS clause then reverts to the single ".001". The hearing worksheet (p. 6)
      resolves the sequence: the application was filed against "#36-1200-02-001.001 (162.5 acres
      vacant land)" and "Amended December 3, 2024 (#36-1200-02-001.001 & #36-1200-02-001.000)".
      So the application was AMENDED to add the second parcel eight days before the first hearing,
      and the permit form was issued on the pre-amendment description. Recorded as printed, on all
      three pages, rather than reconciled: which parcels the permit actually runs to is a legal
      question this corpus cannot answer, and it is NOT a transcription error to be tidied.
    acreage_stated: 162.5         # [verified] p. 6, handwritten-form printed field:
                                  # "#36-1200-02-001.001 (162.5 acres vacant land)"
    acreage_note: >-
      [verified] 162.5 acres is the figure the BZA worksheet attaches to parcel .001 ALONE, before
      the December 3 amendment added .000. The township trustees' own minutes of 2024-11-25
      independently record "162.5 acres off Cole Street" for the same application. ⚠️ Do NOT
      reconcile this against the 2018 deed's 137.490 + 40.07 acres: those are the two parcels the
      deed conveyed (.000 and 36-0100-03-002.000), a different set from the two named here, and
      one of them lies in SUGAR CREEK township, not American. Any campus acreage claim needs the
      auditor's current parcel records, not arithmetic across these two documents.
    zoning_designation: 'M-2 General Manufacturing'   # [verified] p. 6
    auditor_use_code: '199-Other Agricultural Uses Qual. CAUV'   # [verified] p. 6
    auditor_use_note: >-
      [verified] At the time of the hearing the land was carried by the Allen County Auditor as
      CAUV — Current Agricultural Use Valuation — i.e. taxed as farmland while zoned M-2. The
      residents' recorded objection that "American Township does not have agricultural zoned land,
      the land may be used agriculturally, but the specific zoning is R-1 Residential Single-Family
      Dwellings" (p. 1) is about the SURROUNDING land, not this parcel. Two different claims; do
      not merge them.
    property_owner_as_printed: 'Neff Farms LLC, 11951 Zerkle Road, Lima, Ohio 45806'  # pp. 0, 1, 6

  applicant:
    name_as_printed: 'Jill Tangeman, Esq. c/o Project BOSC'   # [verified] pp. 0, 1, 6
    firm_as_printed_on_permit: 'VORYS, SATER, SEYMOUR, AND PLEASE, LLP'
    firm_as_printed_on_letter: 'Vorys, Sater, Seymour, and Pease, LLP'
    firm_note: >-
      [verified] The permit form (p. 0) prints "PLEASE" where the decision letter (pp. 1, 6) prints
