  proposed_construction_verbatim: >-
    3- BUILDING DATA CENTER COMPLEX, OPERATIONS BUILDING, AND SECURITY OFFICE.
  proposed_construction_page: 0

  # ───────────────────────────────────────────────────────────────────────────────────────────
  # ⚠️ THE AUTHORITY THE PERMIT RESTS ON. This is the single most analytically important field in
  # the file, and it is the one a reader cross-referencing today's zoning resolution will get
  # wrong. See `findings.authority_predates_the_data_center_use` below.
  # ───────────────────────────────────────────────────────────────────────────────────────────
  cited_authority:
    district: 'General Manufacturing District (M-2)'
    section_verbatim: >-
      11.2 CONDITIONAL USES - WITH APPROVAL BY THE TOWNSHIP BOARD OF ZONING APPEALS AFTER A PUBLIC
      HEARING, specifically Article 11.2.3- Any industrial, manufacturing, storage, or distribution
      establishment not specifically mentioned above but deemed acceptable by the Board of Zoning
      Appeals.
    section_page: 6
    section_id_as_cited: '11.2.3'
    character: >-
      [verified] A RESIDUAL CATCH-ALL. The cited subsection does not name data centers, computing,
      or electronic data storage; it licenses whatever the Board "deems acceptable" among
      industrial, manufacturing, storage and distribution establishments "not specifically
      mentioned above". The Board's finding tracks that language exactly — both the motion (p. 2)
      and the permit face (p. 0) find "the industrial, manufacturing, storage and distribution use
      of the proposed establishment at this site to be an acceptable use of the land."

  # ───────────────────────────────────────────────────────────────────────────────────────────
  # THE EIGHT CONDITIONS. Verbatim from p. 0 (the permit face); the decision letter reproduces the
  # same eight at pp. 2-3 in the motion. Both readings agree word for word.
  # ───────────────────────────────────────────────────────────────────────────────────────────
  conditions:
    - n: 1
      verbatim: >-
        All data distribution center buildings shall be set back a minimum of five hundred (500)
        feet from the center line of N. Cole Street, Lima, Ohio.
    - n: 2
      verbatim: >-
        The sound decibel (dba) level shall not exceed a limit of sixty (60) decibels as measured
        from the center line of N. Cole Street, Lima, Ohio, as measured by a qualified acoustician.
    - n: 3
      verbatim: >-
        All facility lighting shall be downward directed or directed towards the facility buildings
        and not directed towards adjacent properties.
    - n: 4
      verbatim: >-
        Mounding along N. Cole Street, there shall be a minimum of twelve-12 feet in height, and
        shall have two off-setting rows of evergreen trees at least seven-7 feet in height.
    - n: 5
      verbatim: >-
        All buildings shall not exceed fifty-50 feet in height, in accordance with the American
        Township Zoning Resolution. Deviance from this maximum height will require a variance from
        American Township.
    - n: 6
      verbatim: >-
        Any roadway damage caused by construction or other traffic from the facility will be
        repaired at the owner's expense and a roadway maintenance agreement shall be entered into
        between the owner, and Allen County Engineer.
    - n: 7
      verbatim: >-
        If the owner of this property seeks a property tax abatement, from the Allen County Board
        of Commissioners, the owner must pursue a written agreement with Elida Local Schools to
        provide potential lost revenue to the Elida School District.
    - n: 8
      verbatim: >-
        Per Article 11.8 Landscaping or Screening Provisions – (M-2 General Manufacturing District)
        For non-residential uses abutting an R-District, acceptable landscaping and screening. Such
        screening consisting of a wall or solid fence shall be six-6 feet in height, maintained in
        good condition and free of all advertising or other signs. Landscaping provided in lieu of
        such wall or fence shall consist of a strip of land not less than fifteen-15 feet in width
        planted with evergreen hedge or dense planting of evergreen shrubs not less than four-4
        feet in height at time of planting.
  conditions_pages: [0, 2, 3]

  enforcement_verbatim: >-
    The failure to comply with any of the above-mentioned restrictions & conditions shall be
    grounds for the Zoning Inspector to issue a STOP WORK ORDER, upon the development until such
    time the restriction or condition is corrected by the present or future owner or developer. The
    failure to comply with the stop work order will result in a minimum fine amount of five
    hundred-500.00 per day that the violation continues, until such time the Zoning Inspector
    determines the violation has been corrected. Nothing shall preclude the Township's attorney
    from seeking any additional injunctive relief, to compel compliance.
  enforcement_page: 0

