# ───────────────────────────────────────────────────────────────────────────────────────────────
# FINDINGS — what this document establishes that the corpus did not have.
# ───────────────────────────────────────────────────────────────────────────────────────────────
findings:
  answers_a_standing_open_question:
    question_was: >-
      data/extracted/lacrpc/american-township-zoning.zoning.yaml asked, as a standing open
      question: "Has a BZA conditional-use certificate under 11.2.4 issued for the site?
      Hearing-notice + decision records?"
    answer: >-
      [verified] YES, a conditional-use permit issued — Permit No. 103, 2025-02-04, Case
      #BZA 2024-12, on a 4-0 vote taken 2025-01-08 after two noticed public hearings. This file and
      its source are the hearing-notice and decision records that question asked for. ⚠️ But the
      answer falsifies the question's premise: the permit did NOT issue under 11.2.4.

  authority_predates_the_data_center_use:
    claim: >-
      ⚠️ [inference] THE CAMPUS WAS PERMITTED UNDER A RESIDUAL CATCH-ALL, EIGHT MONTHS BEFORE
      AMERICAN TOWNSHIP HAD A DATA-CENTER USE AT ALL.
    resting_on:
      - >-
        [verified, this document, p. 6] The application was heard and decided under Article 11.2.3,
        "Any industrial, manufacturing, storage, or distribution establishment not specifically
        mentioned above but deemed acceptable by the Board of Zoning Appeals" — a residual clause
        that names no data-center use. Decided 2025-01-08; permit issued 2025-02-04.
      - >-
        [verified, american-township-zoning.zoning.yaml] The CURRENT (2026-02-09 consolidated)
        American Township Zoning Resolution carries free-standing definitions of "Data Center" and
        "Hyperscale Data Center" and lists hyper-data centers as an M-2 conditional use at 11.2.4.
      - >-
        [inference, american-township-zoning.zoning.yaml] That language was carried by the
        2025-09-08 text amendment, Resolution #09-082025 — the only zoning text amendment in the
        corpus, corroborated by the township's own 9-8-25 minutes.
    therefore: >-
      On 2025-01-08 the township had no data-center use category, and the Board reached the campus
      through the clause for establishments "not specifically mentioned". The specific category
      arrived roughly eight months later. The residents' recorded objection — "area may be zoned as
      M-2 Manufacturing zoned property, but this type of use is not acceptable" (p. 1) — is an
      objection to exactly this, and the decision letter records it without answering it.
    ⚠️_cross_reference_trap: >-
      [verified] DO NOT READ "11.2.3" AGAINST TODAY'S RESOLUTION. The subsection numbers moved when
      the data-center text was inserted. In the current text 11.2.3 is BARROW PITS and 11.2.4 is the
      hyper-data-center entry; in the text this permit was decided under, 11.2.3 was the residual
      industrial catch-all quoted verbatim at `cited_authority`. Anyone checking this permit's cited
      authority against the current resolution will read it as a gravel-pit clause. The permit
      quotes its own authority in full on p. 6, which is why the verbatim is carried here.
    not_claimed: >-
      [open] This does NOT establish that the 2025-09-08 amendment was made because of this
      project, that the 11.2.3 route was improper, or that the permit is vulnerable. Article 11.2.3
      is on its face a clause the Board is entitled to use, no appeal appears in this corpus, and
      the 30-day Article 18/20 appeal window is long closed. The sequence is the finding; motive
      and legal consequence are not.

  the_piper_pieper_ambiguity:
    claim: >-
      ⚠️ [open] THE DECISION LETTER NAMES ITS MOVER AND THE OPPOSITION'S SPOKESPERSON WITH THE SAME
      SURNAME, AND THE DOCUMENT DOES NOT RESOLVE WHETHER THEY ARE THE SAME PERSON.
    what_the_pages_say:
      - '[verified] p. 1: "Mr. Timothy Pieper (spokesperson) for the citizens of American Township
        opposed to the project" gave testimony on 2024-12-11.'
      - '[verified] p. 1: "Testimony was again provided from Mr. Tim Pieper, representing the
        citizens for American Township" on 2025-01-08.'
      - '[verified] p. 2: "the Chairman, and Vice-Chairman" made the site visits, and "Mr. Piper
        utilized a Risepro Sound Level Metering Device to take sound measurements."'
      - '[verified] p. 2: "Mr. Piper (Vice Chairman) rendered a motion before the Board" — to
        APPROVE.'
      - '[verified] p. 3: "Motion for Passage by Mr. Piper, Second by Mr. Finch"; roll call
        "Mr. Piper-Yes".'
      - '[verified] p. 6: the worksheet records "Opening Statement by: T. PIEPER" (handwritten) and
        the motion made by "Piper".'
      - '[verified] p. 9: the printed attendance sheet lists board member "Tim Piper".'
    corroboration: >-
      [verified] American Township trustee minutes of 2025-01-13 record Resolution #01-132025
      reappointing "Tim Piper for Zoning Appeals" to a five-year term ending 12/31/29. So a board
      member named Tim Piper certainly exists and certainly sat on this board.
    the_two_readings:
      - >-
        TWO PEOPLE, similar surnames — board member Tim PIPER moved to approve, while a resident
        named Timothy PIEPER spoke for the opposition. On this reading the letter's "Pieper" and
        "Piper" are simply two different names and the only defect is that p. 6's handwritten
        "T. PIEPER" is ambiguous.
      - >-
        ONE PERSON, inconsistently spelled — in which case the board's vice-chairman acted as the
        citizens' spokesperson against the project and then moved its approval and voted yes, which
        would be a conflict-of-interest question of real public interest.
    why_it_is_left_open: >-
      Nothing in this corpus distinguishes them. The document itself uses both spellings for the
      role of mover (p. 2 "Piper" / p. 6 "PIEPER") and both for the role of opposition spokesperson
      (p. 1 "Pieper" twice). A township of this size can hold both a Piper and a Pieper. Resolving
      this by picking the tidier reading would be inventing a fact in whichever direction was
      chosen, and the flattering direction (two people, no issue) is exactly the one to distrust.
      It is resolvable cheaply — see `open_questions` — and until it is resolved NO prose should
      assert either reading.
    ⚠️_do_not_normalize: >-
      The spellings above are the document's. Do not "fix" them in this file, in the mirror, or in
      any derived prose. A normalizing pass would destroy the only evidence that the question
      exists.

  entity_discrepancy_neff:
    claim: >-
      ⚠️ [verified] TWO ENTITY FORMS FOR THE LANDOWNER, SEVEN YEARS APART, IN ONE PDF.
    detail: >-
      Pages 0, 1 and 6 name the property owner as "NEFF FARMS LLC, 11951 ZERKLE ROAD, LIMA, OHIO
      45806". The 2018 deed at p. 11 — bound into the same PDF — conveys to "NEFF FARMS, INC.", and
      its handwritten tax mailing address reads 11435 (or 11935; the digit is not legible with
      confidence) Zerkle Rd.
    status: >-
      [open] Whether Neff Farms, Inc. and Neff Farms LLC are the same entity under a later
      conversion, two entities, or a drafting slip is NOT established. An Ohio Secretary of State
      business-filing pull settles it; the corpus has an `sos` extraction genre for exactly this.
      Until then the two strings are kept apart and neither is merged into the other in the entity
      graph.

  the_only_corpus_source:
    claim: >-
      [verified] THIS DOCUMENT IS THE CORPUS'S ONLY SOURCE FOR THE DECISION. The American Township
      trustee minutes record the application (2024-11-25) and the pre-hearing notice (2024-12-09),
      and then never record the outcome — the BZA is a separate body and its minutes are not held
      here. The nearest trustee reference after the fact is the 2025-03-11 minutes, which note "a
      Board of Appeals meeting was held on 3/4/25 for an approved conditional use permit"; that is
      a DIFFERENT meeting five weeks after this permit issued and must not be read as corroborating
      this vote.
    consequence: >-
      A single third-party-custody scan, with no text layer, currently carries the entire
      evidentiary weight of the approval. That is a thin footing for a load-bearing fact and it is
      why `open_questions` leads with the primary-source pull.

