# ───────────────────────────────────────────────────────────────────────────────────────────────
# THE BOARD'S OWN SOUND SURVEY. The board did not merely receive the applicant's acoustic report;
# two members went and measured. This is the evidentiary basis for condition 2.
# ───────────────────────────────────────────────────────────────────────────────────────────────
board_sound_survey:
  page: 2
  who: >-
    [verified] "the Chairman, and Vice-Chairman" — i.e. Schwinnen and Piper — visiting "several
    data centers sites in the New Albany and Dubin, Ohio" ("Dubin" is the document's spelling of
    Dublin) before the January 8 reconvening. The worksheet (p. 6) dates the visit, in handwriting,
    to on or about 12/30.
  instrument: 'Risepro Sound Level Metering Device, operated by Mr. Piper'
  measurements:
    - location: 'Dublin, Ohio data center site'
      reading: '56-59 db'
      distance: 'not stated'
    - location: 'Dublin, Ohio data center site'
      reading: 'did not exceed 53 db'
      distance: '500 feet'
    - location: 'New Albany, Ohio data center site'
      reading: '50-54 db'
      distance: '500 feet away'
    - location: '4100 Blk. of N. Cole Street (the proposed site)'
      reading: '47-53 db'
      condition: 'no traffic; ambient noise'
    - location: '4100 Blk. of N. Cole Street (the proposed site)'
      reading: '75-80'
      condition: 'when traffic passed'
      unit_note: >-
        [verified] The document prints "75-80" with no unit on this reading, where every other
        reading in the paragraph carries "db". Read in context as decibels; recorded with the
        omission noted rather than silently completed.
  chairman_conclusion_verbatim: >-
    Mr. Schwinnen commented that the structures were modern construction, sound was controlled,
    ample mounding provided, landscaping was aesthetically pleasing, and no noticeable concerns
    were found.
  analysis: >-
    ⚠️ [inference] CONDITION 2 IS MEASURED AT A LOCATION WHOSE OWN AMBIENT ALREADY EXCEEDS IT. The
    condition caps the facility at 60 dBA "as measured from the center line of N. Cole Street". The
    board's own survey recorded 75-80 at that same centre line whenever traffic passed, and 47-53
    without. So a compliance measurement taken there is a measurement of the facility plus N. Cole
    Street traffic, and the instrument specifies no averaging period, no time of day, no traffic
    condition, and no measurement standard beyond "by a qualified acoustician". This is an
    [inference] about the condition's operability drawn from two [verified] figures on the same
    page; it is NOT a finding that the condition is unenforceable, and no party in the document
    raises it.

