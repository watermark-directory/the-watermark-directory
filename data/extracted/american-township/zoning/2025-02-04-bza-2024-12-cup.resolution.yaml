# ───────────────────────────────────────────────────────────────────────────────────────────────
open_questions:
  - >-
    ⚠️ PRIMARY-SOURCE PULL — the highest-value next step. Request the BZA Case #BZA 2024-12 file
    directly from American Township under R.C. 149.43: the certified conditional use permit, the
    BZA minutes of 2024-12-11 and 2025-01-08, the application as filed 2024-11-14 and as amended
    2024-12-03, and the notice affidavits. This authenticates the present scan, replaces
    third-party custody with a direct production, and brings the BZA's own minutes into a corpus
    that currently has none.
  - >-
    ⚠️ IS THE PERMIT STILL ALIVE? The face expiry was 2026-02-04 and Article 17.10 expires a permit
    whose use was not "instituted or utilized" within a year. Ask the Zoning Inspector for the
    permit's current status, any extension or successor permit, any zoning or building permits
    issued on parcels 36-1200-02-001.000/.001, and any stop-work order under the enforcement
    clause. This intersects the Lima data-center moratorium (Ord. 198-26, introduced 2026-09-14),
    whose development limb reaches only inside city limits — this campus is in the township — but
    whose WATER limb reaches outside them, and this campus's water is City of Lima water.
  - >-
    ⚠️ PIPER / PIEPER. Settle whether the mover and the opposition spokesperson are the same
    person: the BZA minutes and the hearing sign-in sheets name both roles, and the township's
    appointment resolutions name the board. Do not publish prose on this point until it is settled.
  - >-
    NEFF FARMS INC. vs LLC — an Ohio SoS business-filing pull (`watermark extract --kind sos`).
  - >-
    THE ACOUSTIC SOUND REPORT AND AFFIDAVIT received by Zoning Inspector Bishop on 2025-01-08
    (p. 6), and the sound-engineer affidavit Mr. Miller presented (p. 2), are not in this corpus.
    They are the applicant's acoustic evidence and the direct counterpart to the residents' Boren
    material; condition 2's 60 dBA cap presumably derives from them.
  - >-
    WHO IS MR. JOSEPH MILLER? A second attorney appearing "on behalf of the project" at the
    2025-01-08 hearing (p. 2), unnamed elsewhere in this document and absent from the entity graph.
  - >-
    THE ROADWAY MAINTENANCE AGREEMENT with the Allen County Engineer (condition 6) and any Elida
    Local Schools revenue agreement (condition 7) — both are conditions whose performance is
    documentary and separately requestable. Condition 7 is the corpus's link between this permit
    and the Allen County abatement record.
  - >-
    THE TOWNSHIP RECORD REBECCA STREETER CORRECTS. Her letter quotes "Section #5" of a township
    summary of the 12-11 hearing that is not in this corpus.
  - >-
    THE 2025-03-04 BZA MEETING noted in the 2025-03-11 trustee minutes as approving "a conditional
    use permit" — establish whether it concerns this site at all.

