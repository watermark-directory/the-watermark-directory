  # ───────────────────────────────────────────────────────────────────────────────────────────
  # THE NINE SECTION 17.3 FINDINGS. The board must make an affirmative finding on each; it made
  # nine of nine. The bolded sentences after each standard are the board's own reasoning as
  # printed, and they are the substance — the standard itself is boilerplate from the resolution.
  # ───────────────────────────────────────────────────────────────────────────────────────────
  section_17_3_findings:
    page: 2
    all_affirmative: true
    findings:
      - id: '17.3.1'
        standard: >-
          It is in fact a conditional use as established under the provisions of Article 3 through
          11, inclusive and appears on the schedule of District Regulations adopted for the zoning
          district above.
        board_reasoning: 'We have an affirmative finding.'
      - id: '17.3.2'
        standard: >-
          Will be in accordance with the general objectives, or with any specific objective, of the
          Township's comprehensive plan and / or the zoning resolution.
        board_reasoning: >-
          We have an affirmative finding. Keynote is comprehensive plan or zoning resolution.
          Developer has addressed that construction will be in accordance with the general
          objectives, and in accordance with the zoning resolution for American Township.
      - id: '17.3.3'
        standard: >-
          Will be operated, constructed and maintained so as to be harmonious and appropriate in
          appearance with the existing or intended character of the general vicinity and that such
          use will not change the essential character of the same area.
        board_reasoning: >-
          We have an affirmative finding. Developer ensures that construction of the buildings will
          be developed to blend into the essential character of the surrounding areas. This by means
          of landscaping, mounding, ponds, etc. to blend into the open wooded area. Buildings will
          be set back well beyond the required 90-foot set back distance for industrial structures.
      - id: '17.3.4'
        standard: 'Will not be hazardous or disturbing to existing or future neighboring uses.'
        board_reasoning: >-
          We have an affirmative finding. The developer has advised that the site will not he
          hazardous or disturbing. Federal, state, and local laws and regulations ensure that a safe
          and non-hazardous site will be maintained.
        board_reasoning_note: >-
          "will not he hazardous" is the document's own typo for "be". Transcribed as printed.
      - id: '17.3.5'
        standard: >-
          Will be served adequately by essential public facilities and services such as highways,
          streets, police and fire protection, drainage structures, refuse disposal, water and
          sewer, and schools; or that the persons or agencies responsible for the establishment of
          the proposed use shall be able to provide adequately any such services.
        board_reasoning: >-
          We have an affirmative finding. Multi-agencies will be involved in the construction and
          post construction process.
      - id: '17.3.6'
        standard: >-
          Will not create excessive additional requirements at public cost for public facilities and
          services and will not be detrimental to the economic welfare of the community.
        board_reasoning: 'We have an affirmative finding.'
      - id: '17.3.7'
        standard: >-
          Will not involve uses, activities, processes, materials, equipment and conditions of
          operation that will be detrimental to any person, property, or the general welfare by
          reason of excessive production of traffic, noise, smoke, fumes, glare, or odors.
        board_reasoning: >-
          We have an affirmative finding. Issues with sound management will be monitored, water
          usage from City of Lima with self-contained cooling units. Buildings back 500 feet from
          roadway, to obscure from area properties. Detention ponds to off-set storm water drainage.
          Lighting will be downlit and aimed towards facility.
      - id: '17.3.8'
        standard: >-
          Will have vehicle approaches to the property which shall be so designed as not to create
          an interference with traffic on surrounding public thoroughfare.
        board_reasoning: >-
          We have an affirmative finding. Roadway maintenance agreements have been discussed and one
          of the conditions.
      - id: '17.3.9'
        standard: >-
          Will not result in the destruction, loss, or damage of a natural, scenic, or historic
          feature of major importance.
        board_reasoning: >-
          We have an affirmative finding. The proposed area is open land, several trees, and unused
          area. After construction, mounding and landscaping will be used to restore natural
          features.

  directives:
    # [verified] p. 3 — what the Board, per Article 17.8.1, directed within 30 days of the hearing.
    page: 3
    items:
      - 'The Board of Zoning Appeals hereby approves the issuance of the Conditional Use Permit by
        making an affirmative finding in writing that the proposed conditional use is located in a
        district wherein such use may be conditionally permitted.'
      - 'The Board finds that all conditions for approval of such use in such district have been met.'
      - 'That such use will result in neither significant negative impact upon nor conflict with
        surrounding uses.'
      - 'Upon making this affirmative finding, the Board hear-by directs to the Zoning Inspector to
        issue a Conditional Use Permit for such use which shall list all conditions and safeguards
        specified by the Board of Zoning Appeals for approval.'
      - 'In accordance with Article 17.10 – "Expiration of Conditional Use Permit" a conditional use
        permit shall be deemed authorized for only one particular conditional use, and said permit
        shall automatically expire if such conditionally permitted use has not been instituted or
        utilized within one (1) year of the date on which the permit was issued, or if for any
        reason such use shall cease for more than one (1) year.'

