# American Township Conditional Use Permit No. 103 — the BZA approval of the Project BOSC data-center campus, issued 2025-02-04
#
# ⚠️ The first line above is read VERBATIM as this record's label in the yidam corpus mirror
# (watermark.site.corpus_records._title takes the leading YAML comment block's first `# ` line), so
# it is written to stand alone. Do not wrap it.
#
# THIS IS THE ZONING INSTRUMENT THAT PERMITS THE CAMPUS. Until this file the corpus recorded the
# APPLICATION (American Township trustees, 2024-11-25) and never the DECISION: no trustee minutes
# record the 2025-01-08 vote or the 2025-02-04 written notice, because the Board of Zoning Appeals
# is a separate body whose own minutes are not in this corpus. This scan is the ONLY corpus source
# for the approval.
#
# CUSTODY CAVEAT (the reason this file is shaped the way it is):
#   1. THIRD-PARTY CUSTODY. The file did not come from American Township to this project. It
#      reached the requester through an intermediate holder. The instrument's CONTENT is read off
#      its own face and is [verified]; its AUTHENTICITY AS SERVED BY THE TOWNSHIP is NOT
#      independently established here — see `corroboration` for what the corpus does and does not
#      confirm, and `open_questions` for the pull that would settle it.
#   2. ZERO TEXT LAYER. All 15 pages return zero characters from pypdf. Every field below is a
#      VISION read of a pypdfium2 render (150 DPI survey, 300 DPI for every figure transcribed as
#      [verified]). No OCR digits are trusted anywhere in this file.
#   3. HANDWRITING. Pages 6, 7 and 9 are handwritten. Nothing is dated from handwriting, and the
#      handwritten narrative passages are summarized rather than transcribed as verbatim.
#   4. COMPOUND DOCUMENT. One PDF, five instrument types. Only the decision instrument is modelled
#      here; the 2018 deed at pp. 11-14 is its own artifact (see `companion_artifacts`).
#
# TAG VOCABULARY: [verified] = read off the document's own pages at the cited page; [inference] =
# reasoned from [verified] facts, labelled; [reference] = secondary source, lead only; [open] = not
# established here.

