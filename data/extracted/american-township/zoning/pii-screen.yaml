  personal_contact_details: 0     # the only e-mail/phone in the packet are counsel's work details
  named_private_individuals: 17
  named_private_individuals_note: >-
    Fourteen residents recorded as testifying or corresponding, one resident recorded as supporting
    by e-mail, plus the grantor's signing member and the notary on the 2018 deed. NONE is paired
    with a home address, telephone or e-mail anywhere in the packet.

recommendation:
  clear: true
  scope_proposed: 'data/documents/american-township/zoning/'
  scope_note: >-
    ⚠️ PROPOSE THE `zoning/` SUBTREE, NOT THE `american-township` COLLECTION. A collection-level
    rule would also clear `data/documents/american-township/meetings/` — 49 trustee minutes that
    have NOT been screened, and which are known to contain at least one private residential address
    in the clear (the 2024-12-09 minutes print "Becky and Dave Streeter 1640 W State Rd" when
    granting privilege of the floor). That is exactly the standing-auto-publish failure the OEPA
    collection already suffered twice. Screen the meetings tree separately, on its own decision.
  basis: >-
    The packet is the decision file of a noticed public hearing before a township board of zoning
    appeals, plus a recorded conveyance the county already publishes. It carries no private home
    address, no personal telephone or e-mail, and no information about an identified individual
    beyond their participation in a public proceeding. It is load-bearing: it is the corpus's ONLY
    source for the approval of the Project BOSC campus, and it answers a standing open question in
    `data/extracted/lacrpc/american-township-zoning.zoning.yaml`.
  against: >-
    Recorded honestly rather than argued away: pp. 4-5 are a named private individual's signed
    letter touching health, and p. 11 carries a handwritten address. Neither can be carved out
    without splitting the source file, which chain of custody forbids. If either is judged
    unacceptable the correct outcome is to publish NOTHING from this path and cite the document
    from the extractions instead — which is the status quo and costs the project nothing except
    a public download link.
  ⚠️_publication_does_not_make_it_findable: >-
    Clearing this path puts a downloadable PDF on the site and adds ZERO passages to search or
    /ask. `extract_published_passages` returns early on a page with no text layer, before its OCR
    fallback is reachable, and all 15 pages have none. Published, this document would join the
    known blind set — downloadable but unsearchable, the same failure already recorded for
    `bowling-green/commissioners/10032023.pdf`. Do not treat clearing it as making the corpus able
    to answer questions about it.

status: pending_operator_decision
status_note: >-
  NO EDIT HAS BEEN MADE to `data/site/published-documents.yaml`. Publishing is outward-facing and
  is the operator's call; this file is the evidence that call is made on.
