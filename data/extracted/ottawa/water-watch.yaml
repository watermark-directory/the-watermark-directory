# ── Route hazards ─────────────────────────────────────────────────────────────
# Recorded so the next check does not repeat them and mistake an artifact for a fact.
route_hazards:
- route: ECHO CWA3YrCompliance quarterly grid, current quarter
  hazard: >-
    The right-most quarter is a PARTIAL quarter running to the extract date, and monthly-average
    DMRs are due on the 20th of the following month. On the 2026-07-24 extract the June 2026 DMR
    is absent — not late on its face, just not yet reflected. Reading "no mercury exceedance in
    Q2 2026" off that column as a return to compliance would be reading a reporting lag.
- route: ECHO facility-level RNC status vs the effluent-chart parameter status
  hazard: >-
    They disagree about Q3 2025 by design. CWARNCCompliance calls Jul-Sep 2025 "Other Violation";
    the per-parameter chart marks the same quarter "S" for mercury. The reason is in the violation
    record itself: the September exceedance carries RNCDetectionDate 2025-12-31 — the technical
    review criterion was tripped only when the December value landed, and the September quarter
    was then re-designated. Neither field is wrong; they are answering different questions on
    different dates.
- route: ECHO eff_rest_services.get_effluent_chart parameter filter
  hazard: >-
    Passing a parameter-code filter did not restrict the response; all 35 outfall-001 parameters
    came back regardless. Filter client-side on ParameterCode. (Consistent with the known
    one-code-only behaviour of the ECHO parameter filters recorded elsewhere in this corpus.)
- route: ECHO sdw_rest_services.get_systems with a PWSID
  hazard: >-
    p_pwsid is not honoured by get_systems — the query returned a whole-universe row count and
    errored on the queryset limit. The SDWA record for a single system comes from
    dfr_rest_services.get_dfr with p_system=SDWIS.
- route: SDWIS violation Status field
  hazard: >-
    An MCL violation for a running-annual-average contaminant is marked "Archived" with a
    ResolvedDate equal to the END of its compliance quarter. That is the quarter closing, not the
    system returning to compliance. Both TTHM violations here read "Archived"; neither means what
    the word suggests.
- route: The Village's DocumentCenter URL slug
  hazard: >-
    The 2025 Consumer Confidence Report is served from a path reading "2024-CCR". Trusting the
    slug would date the document, and its TTHM violation, a year early. See
    data/documents/ottawa/drinking-water/filename-map.yaml.

# ═════════════════════════════════════════════════════════════════════════════
# THE DISCHARGE SIDE — NPDES OH0026921 / Ohio EPA 2PD00028*PD
# ═════════════════════════════════════════════════════════════════════════════
discharge_side:
  facility: Ottawa Wastewater Treatment Plant, 1371 North Defiance Street
  outfall: 2PD00028001, Blanchard River at River Mile 22.1
  design_flow_mgd: 3.0
  permit_term: 2025-03-01 to 2030-02-28
  instruments:
    permit: data/extracted/oepa/ottawa/2PD00028.npdes.yaml
    fact_sheet: data/extracted/oepa/ottawa/2PD00028.fs.npdes.yaml

  # ── 1 ── The limit that was cut ──────────────────────────────────────────────
  the_limit_change:
    watch_item: 1
    tag: '[verified]'
    checked_on: '2026-07-31'
    source: ECHO eff_rest_services.get_effluent_chart, OH0026921, limit sets on parameter 50092
    prior_limit:
      monthly_average_ng_l: 6.8
      term: 2019-08-01 to 2024-07-31
      dmrs_reported_against_it_through: '2025-02-28'
      note: >-
        The prior permit's limit term ended 2024-07-31 but DMRs were reported against 6.8 ng/L
        through February 2025 — the permit was administratively continued until the renewal took
        effect 2025-03-01.
    current_limit:
      monthly_average_ng_l: 4.5
      daily_maximum_ng_l: 1250
      monthly_average_kg_d: 0.00007
      daily_maximum_kg_d: 0.014
      term: 2025-03-01 to 2028-02-29 (as coded in ICIS) / 2030-02-28 (as written in the permit)
    what_actually_changed:
      concentration_monthly_average: 6.8 -> 4.5 ng/L
      concentration_daily_maximum: unchanged at 1250 ng/L
      loading_monthly_average: unchanged at 0.00007 kg/d
      loading_daily_maximum: unchanged at 0.014 kg/d
      finding: >-
        One number moved. The renewal cut the monthly-average CONCENTRATION by 34% and left the
        daily maximum and both mass loadings exactly where they were.
    where_4_5_came_from:
      quote: >-
        "A variance-based monthly average effluent limit of 4.5 ng/l, which was developed from
        sampling data submitted by the permittee" — 2PD00028 fact sheet, p. 14.
      detail: >-
        Table 8 of the fact sheet (p. 24) gives this plant's projected effluent quality over 63
        mercury samples, 2019-2024, all 63 above the method detection limit: PEQ average 4.5 ng/L.
        The limit is the plant's own average performance, adopted as its ceiling. The
        water-quality-based effluent limit it varies from is 1.3 ng/L — the wildlife criterion.
      consequence:
        tag: '[inference]'
        statement: >-
          A limit set at a plant's demonstrated mean has, by construction, roughly half its own
          historical months above it. It is not a treatment standard the plant is failing to meet;
          it is a benchmark that converts ordinary upward variance into a permit violation. That
          is what the renewal did, and it is the single most important thing to understand about
          this SNC.
        counterweight: >-
          It is also what the general mercury variance rule intends. OAC 3745-1-38 conditions the
          variance on "reasonable progress" toward the WQBEL, and ratcheting the limit down to
          demonstrated performance at each renewal is the mechanism by which progress is made to
          bite. Recording the arithmetic is not an argument that the limit is wrong.

  # ── 2 ── The exceedances ─────────────────────────────────────────────────────
  mercury_exceedances:
    watch_item: 2
    tag: '[verified]'
    checked_on: '2026-07-31'
    source: >-
      ECHO eff_rest_services.get_effluent_chart, OH0026921, permit feature 001 "Effluent Gross",
      parameter 50092 "Mercury, total low level", MO AVG rows; ICIS-NPDES extract 2026-07-24.
    monthly_series_ng_l:
      # Every reported monthly average since the 4.5 ng/L limit took effect. `*` marks a violation.
      2025-03: {value: null, nodi: Below Detection Limit/No Detection}
      2025-04: {value: 1.91}
      2025-05: {value: 0.728}
      2025-06: {value: 0.913}
      2025-07: {value: 1.06}
      2025-08: {value: 1.62}
      2025-09: {value: 9.60, exceedance_pct: 113, violation: E90, severity: Significant/Category I}
      2025-10: {value: 1.64}
      2025-11: {value: 2.30}
      2025-12: {value: 36.70, exceedance_pct: 716, violation: E90, severity: Significant/Category I}
      2026-01: {value: 2.45}
      2026-02: {value: 5.55, exceedance_pct: 23, violation: E90, severity: Significant/Category I}
      2026-03: {value: 4.34}
      2026-04: {value: 2.80}
      2026-05: {value: 3.53}
      2026-06: {value: null, note: not present on the 2026-07-24 extract}
    loading_violation:
      month: 2025-12
      value_kg_d: 0.000125
      limit_kg_d: 0.00007
      exceedance_pct: 79
      note: >-
        December 2025 breached the mass loading limit as well as the concentration limit. That
        loading limit was NOT changed by the renewal, so this violation would have occurred under
        the prior permit too.
    rnc_status:
      all_four_violations: NC - Unresolved RNC
      detection_code: T (TRC Limitations Exceeded)
      detection_dates: {2025-09: '2025-12-31', 2025-12: '2025-12-31', 2026-02: '2026-02-28'}
      note: >-
        The September violation's technical-review-criterion detection is dated 2025-12-31 — the
        criterion is a pattern test, and the pattern was completed by the December value. All four
        mercury violations remain unresolved on the 2026-07-24 extract.
    counterfactual_under_the_old_limit:
      tag: '[inference]'
      arithmetic:
        2025-09: 9.60 vs 6.8 = 41% over — still a violation
        2025-12: 36.70 vs 6.8 = 440% over — still a violation
        2026-02: 5.55 vs 6.8 = 18% UNDER — not a violation
      finding: >-
        Two of the three exceedances survive the counterfactual. The February 2026 one exists only
        because the limit was tightened. So the tightened limit did not manufacture this SNC — it
        added a third quarter to it.
      trc_note:
        tag: '[inference]'
        detail: >-
          The technical review criterion for a Group II (toxic) pollutant is 1.2x the limit. At
          the current limit that is 5.4 ng/L, and ECHO flagged the 5.55 ng/L February value "T",
          which is consistent with 1.2 and not with 1.4. Applying 1.2 to the prior 6.8 ng/L limit
          gives 8.16 ng/L: September (9.60) and December (36.70) clear it, February does not.
          Significant noncompliance requires two TRC exceedances in six months, so on this
          arithmetic the SNC designation would have arisen under the old limit as well.
        caveat: >-
          The TRC group assignment is reasoned from ECHO's own flag, not read from a rule cited in
          any committed document. Recorded as an inference.
    the_prior_record:
      tag: '[verified]'
      period: 2023-04 to 2025-02, 23 reported months under the 6.8 ng/L limit
      range_ng_l: [0.561, 4.66]
      exceedances: 0
      note: >-
        Not one exceedance in the 23 months before the renewal, and the highest single month
        (4.66 ng/L, June 2023) sits just above what is now the limit. The plant did not begin
        failing; the target moved and then two bad months arrived.

  # ── 3 ── The finding the influent record forces ──────────────────────────────
  influent_vs_effluent:
    watch_item: 3
    tag: '[verified]'
    checked_on: '2026-07-31'
    source: >-
      Same ECHO effluent chart, permit feature 601 "Raw Sewage Influent" (mercury influent
      monitoring is required monthly by permit Part II Item X.1.c, EPA Method 1631) against
      feature 001. Both series are monthly averages of grab samples.
    paired_series_ng_l:
      # month: [influent, effluent, removal_pct]
      2025-04: [10.8, 1.91, 82.3]
      2025-05: [20.1, 0.728, 96.4]
      2025-06: [19.2, 0.913, 95.2]
      2025-07: [12.2, 1.06, 91.3]
      2025-08: [34.4, 1.62, 95.3]
      2025-09: [16.6, 9.60, 42.2]
      2025-10: [74.9, 1.64, 97.8]
      2025-11: [17.1, 2.30, 86.5]
      2025-12: [20.3, 36.70, -80.8]
      2026-01: [12.6, 2.45, 80.6]
      2026-02: [118, 5.55, 95.3]
      2026-03: [12.2, 4.34, 64.4]
      2026-04: [24.3, 2.80, 88.5]
      2026-05: [11.3, 3.53, 68.8]
    median_removal_pct: 87.5
    median_influent_ng_l: 18.15
    findings:
    - tag: '[verified]'
      statement: >-
        In December 2025 the plant reported MORE mercury leaving than entering — 36.70 ng/L in the
        effluent against 20.3 ng/L in the raw sewage. That is not a high-influent month; 20.3 is
        within a whisker of the 18.15 ng/L median. Arithmetic only: 36.70 > 20.3.
    - tag: '[verified]'
      statement: >-
        The two worst effluent months are the two worst removal months and are not high-influent
        months. September 2025 (influent 16.6, removal 42%) and December 2025 (influent 20.3,
        removal negative) are the only two months below 64% removal in the whole series.
    - tag: '[verified]'
      statement: >-
        The two HIGHEST influent months did not produce violations of comparable size. October
        2025 took in 74.9 ng/L and discharged 1.64 (97.8% removal). February 2026 took in 118 ng/L
        — 6.5x the median — and discharged 5.55, which is a violation, but at 95.3% removal.
    - tag: '[inference]'
      statement: >-
        The three exceedances have two different shapes. February 2026 is an influent-driven
        exceedance: a very large slug arrived and normal treatment could not bring it under a
        limit set at the plant's mean. September and December 2025 are not — ordinary loads
        arrived and the plant failed to remove them, December to the point of releasing more than
        it received.
      what_would_explain_it:
        tag: '[open]'
        candidates:
        - Release of previously captured mercury from the solids train. The plant aerobically digests and sand-bed dewaters its sludge and land-applies it; solids-phase mercury returned to the liquid train would show as effluent exceeding influent without any new source.
        - A sampling or laboratory artifact in one or both December grabs.
        - An unsampled input entering downstream of the influent monitoring point.
        note: >-
          Nothing in the committed record chooses among these. The instrument that would is the
          annual Pollutant Minimization Program report the permit requires by March 1 each year
          (Part II Item X.1.g) — which the corpus does not hold. Lead OTTAWA-PMP-REPORTS.
      discipline: >-
        Monthly averages of grab samples on two streams separated by the plant's hydraulic
        residence time are not a mass balance. This block reports what the permittee reported and
        the arithmetic that follows from it. It does not establish a mechanism, and no claim here
        depends on one.

  # ── 4 ── Did the streak actually break? ──────────────────────────────────────
  did_it_actually_break:
    watch_item: 4
    tag: '[open]'
    checked_on: '2026-07-31'
    what_is_verified: >-
      April 2026 (2.80 ng/L) and May 2026 (3.53 ng/L) are compliant monthly averages, and no
      mercury violation is recorded for Q2 2026 on the 2026-07-24 ICIS extract.
    what_is_not: >-
      The June 2026 DMR is not on that extract. A monthly-average DMR is due on the 20th of the
      following month, so June's was due 2026-07-20, four days before the extract — the absence is
      as consistent with normal system lag as with a missing filing. Two clean months out of three
      is not a resolved SNC in any case: ECHO still carries CurrentSNC=Yes as of 2026-03-31, all
      four mercury violations remain "NC - Unresolved RNC", and RNC resolution is a determination
      the state makes, not something that expires.
    also: >-
      March 2026 came in at 4.34 ng/L — 96% of the limit. The margin in the clean months is thin.
    next_check: >-
      Re-read the effluent chart after the 2026-08-20 DMR due date. The question to answer is
      whether June, July and August 2026 are reported and compliant, and whether the four
      unresolved RNC records have been resolved.

