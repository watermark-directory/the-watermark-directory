  - Did the August and September 2026 mercury monthly averages post, and are they under 4.5 ng/L? (June 1.48 and July 1.98 were; August had not posted at the 2026-09-11 extract.)
  - Did the six June-2026 whole-effluent-toxicity RNCs resolve after the 2026-08-25 biomonitoring retests, and by what resolution code?
  - Has SDWIS been re-extracted? If not, STOP — no SDWA question below is answerable.
  - Was Q3 2026 a fourth consecutive TTHM MCL quarter, and at how many monitoring locations?
  - Did the Village meet the Orders' 120-day General Plan deadline, and which of its three alternatives did it select?
  - Has any PENALTY been sought? Section XI of the Orders expressly reserves that right and does not waive it.
  - Did Consumer Confidence Rule violation 8263937 clear once SDWIS caught up past the 2026-07-01 report? Is 8263895 still unaddressed after six and a half years?
  - What caused the 2026-04-30 dissolved-oxygen minimum of 1.07 mg/L at outfall 001, against a 5.4 mg/L limit and a 7.46-9.70 range in every other month?
  - Did Eagle Creek dry storage construction start, and did FEMA award? (Not run on 2026-09-16.)
