  # ── 7 ── What the record says on the other side of the ledger ────────────────
  the_exculpatory_record:
    watch_item: 7
    tag: '[verified]'
    note: >-
      Carried at the same weight as the violations, because a watch that reports only the bad
      quarters is not a record.
    ohio_epa_conclusion:
      source: 2PD00028 fact sheet, p. 8
      quote: >-
        "The river section downstream of the WWTP is in full attainment for aquatic life. Ottawa
        WWTP is not likely contributing to the impairments in the Blanchard River."
    tmdl_finding:
      source: Blanchard River TMDL (July 2009), quoted at 2PD00028 fact sheet p. 8
      quote: >-
        "No impact attributed to the Ottawa WWTP discharge was apparent in the performance of the
        fish and macroinvertebrate assemblages."
      vintage_caveat: >-
        The sampling behind that sentence predates the 2025-26 exceedances by more than fifteen
        years. It is evidence about the plant's ordinary operation, not about December 2025.
    the_other_half_of_the_same_document:
      source: 2PD00028 fact sheet, p. 7
      quote: >-
        "The Pike Run-Blanchard River watershed assessment unit, which includes the Blanchard
        River in the vicinity of Ottawa WWTP, is listed as impaired for aquatic life and recreation
        on Ohio's 303(d) list."
      note: >-
        The assessment unit is impaired for aquatic life; the reach below the outfall is in full
        attainment. Both sentences are in one fact sheet, one page apart. Quoting either alone
        misrepresents it. Ohio's 2024 integrated report, read through ECHO, carries the same
        split: assessment unit OH041000080602 (Pike Run-Blanchard River) aquatic-life use "Not
        Supporting"; the downstream mainstem unit OHLR041000089001 (Dukes Run to mouth)
        "Fully Supporting" for aquatic life but "Not Supporting" for fish consumption.
    none_of_the_impairment_causes_is_mercury:
      tag: '[verified]'
      pike_run_blanchard_causes: [AMMONIA, NUTRIENTS, ORGANIC ENRICHMENT/OXYGEN DEPLETION, PATHOGENS, SEDIMENT]
      mainstem_causes: [PATHOGENS, POLYCHLORINATED BIPHENYLS (PCBS)]
      note: >-
        The mainstem's fish-consumption impairment is caused by PCBs, not mercury. Nothing in the
        303(d) record attributes a mercury impairment to this reach.
      but: >-
        The fact sheet's own Table 12 records the ambient mercury concentration in this river as
        "0 — No representative data available." There is no measured background. An absence of
        mercury impairment findings on a reach nobody has measured for mercury is not evidence
        that the reach is clean.
    phosphorus_performance:
      tag: '[open]'
      note: >-
        The previous check recorded "strong effluent-P performance (median 0.11-0.22 mg/L)". That
        figure is not reproduced here — this check pulled the mercury, DO, toxicity and E. coli
        series and did not verify the phosphorus series against a primary source. It is left
        [open] rather than carried forward on the strength of the earlier note.
        Lead OTTAWA-EFFLUENT-P.

