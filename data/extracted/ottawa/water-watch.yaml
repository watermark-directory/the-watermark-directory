    note: A genuine re-verification — the CWA extract advanced seven weeks between passes.
  - negative: Formal SDWA enforcement against OH6900711 — zero.
    status: SUPERSEDED 2026-09-16. A Director's Final Findings and Orders issued 2026-09-03.
    note: >-
      The negative was correct on 2026-07-31 and is kept as such. ECHO still reports zero because
      SDWIS has not been extracted since 2026-07-09 — so this negative could NOT have been
      re-verified federally, only re-read. Never re-affirm it from ECHO again without checking
