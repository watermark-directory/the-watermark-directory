  # ── What the WWTP side did instead ───────────────────────────────────────
  the_cwa_side_traded_one_rnc_stream_for_another:
    tag: '[verified]'
    source: ECHO dfr_rest_services.get_dfr and eff_rest_services.get_effluent_chart, OH0026921, read 2026-09-16 (ICIS extract 2026-09-11)
    headline: >-
      The mercury RNCs closed on 2026-05-31 and SIX NEW UNRESOLVED RNCs opened on 2026-08-20, on a
      different parameter family. The quarterly status line looks like recovery and then relapse;
      what actually happened is a laboratory failure.
    what_is_unresolved_now:
      period: '2026-06-30'
      rnc_detected: '2026-08-20'
      rnc_status: NC - Unresolved RNC
      nodi_on_every_row: P — Laboratory Error or Invalid Test
      records:
      - {outfall: '001', parameter: '61425', desc: 'Toxicity [acute], Ceriodaphnia dubia', violation: 'D90 DMR, Limited - Overdue', limit: 1 tox acute}
      - {outfall: '001', parameter: '61426', desc: 'Toxicity [chronic], Ceriodaphnia dubia', violation: 'D90 DMR, Limited - Overdue', limit: 1.4 tox chronic}
      - {outfall: '801', parameter: TCM3B, desc: '%Effect Static Renewal 48Hr Acute', violation: 'D80 DMR, Monitor Only - Overdue', count: 2}
      - {outfall: '801', parameter: TCP3B, desc: '%Effect Static Renewal 7 Day Chronic', violation: 'D80 DMR, Monitor Only - Overdue', count: 2}
      statement: >-
        The June 2026 whole-effluent toxicity tests were invalid — every one of the six rows
        carries NODI code P, "Laboratory Error or Invalid Test" — and the results were therefore
        never reported. ECHO scores that as DMR non-receipt, and the RNC is unresolved as of
        2026-08-20. ECHO's own missing/late counter agrees: six missing DMRs in the quarter ending
        2026-06-30.
    the_state_record_shows_the_retest:
      tag: '[verified]'
      statement: >-
        And the eDocument portal shows what the federal record does not: THIRTEEN biomonitoring
        report forms for 2PD00028 published 2026-08-25 — seven acute and six chronic — five days
        after the RNC detection date, plus six more published 2026-07-21. The tests appear to have
        been re-run. Whether those filings satisfy the June obligation is NOT established, and
        ECHO at a 2026-09-11 extract still carries the RNC as unresolved.
      why_it_is_recorded: >-
        Because "six unresolved reporting RNCs" read alone suggests a plant that stopped reporting,
        and the state record shows a plant that filed thirteen reports in one day. Both are true.
    quarterly_status_now:
      window: '2023-07-01 → 2026-06-30'
      qtrs_in_nc: 6
      qtrs_in_snc: 2
      current_snc: 'No'
      current_status: Violation Identified
      inspections: 4
      last_inspection: '2026-02-24'
      formal_enforcement_actions: 0
      total_penalties: $0
      informal_actions: 1
      q12_apr_jun_2026: No Violation Identified
      q13_jul_sep_2026_partial: Violation Identified
      rnc_q12: Resolved
      the_quarter_boundary_trap:
        tag: '[verified]'
        statement: >-
          Q12 (2026-04-01 → 2026-06-30) reads "No Violation Identified" and Q13 reads "Violation
          Identified", which looks like a clean quarter followed by a new problem. It is one
          problem, split across the boundary: the missing DMRs are for the June monitoring period,
          which sits in Q12, while the RNC was DETECTED on 2026-08-20, which sits in Q13. The
          missing/late counter puts all six in Q12. Read the quarter grid as "when it was noticed",
          not "when it happened".
    formal_cwa_enforcement_re_verified:
      tag: '[verified negative]'
      checked_on: '2026-09-16'
      against_extract: ICIS-NPDES 2026-09-11
      statement: >-
        STILL ZERO, and this one IS a genuine re-verification because the CWA extract advanced
        seven weeks. FormalEnfActCount 0, TotalPenalties $0, FormalActions and ICISFormalActions
        both empty. The only action of any kind remains the single informal Letter of
        Violation/Warning Letter of 2026-03-04, EnfIdentifier OH-I00108139, State lead.
      the_contrast_is_now_sharp: >-
        Same village, same river, same two months. The drinking-water side drew a Director's Final
        Findings and Orders on 2026-09-03. The wastewater side, with three Category-I significant
        noncompliance mercury violations including one 716% over limit, has drawn one warning
        letter and nothing else.
    a_new_effluent_violation_this_file_did_not_have:
      tag: '[verified]'
      parameter: 00300 Oxygen, dissolved [DO]
      outfall: 001 Effluent Gross
      period: '2026-04-30'
      statistic: DAILY MINIMUM
      value_mg_l: 1.07
      limit_mg_l: 5.4
      exceedance: 80%
      severity: Non-Reportable Noncompliance Effluent Violation
      statement: >-
        An April 2026 daily-minimum dissolved-oxygen value of 1.07 mg/L against a 5.4 mg/L limit.
        Every other month in 2026 reads 7.46 to 9.70, so this is a single dramatic excursion, not
        a trend. It is classified Non-Reportable Noncompliance, which is why the quarter it falls
        in still reads "No Violation Identified" — the quarterly grid does not surface it at all.
      why_it_is_recorded: >-
        Because a watch that only reads the quarter grid would never see it, and because a
        dissolved-oxygen collapse at the outfall is a direct receiving-water effect on the one
        river this file is about. What caused it is `[open]` — no inspection, report or filing in
        the corpus addresses April 2026.

watch_schedule:
  set_on: '2026-09-16'
  supersedes: the schedule written 2026-07-31, whose eight questions are all answered or dispositioned in pass_2026_09_16
  cadence: >-
    QUARTERLY was the old cadence and it is kept for the wastewater side, which tracks the
    ICIS-NPDES extract cycle. The DRINKING-WATER side moves to MONTHLY for the duration of the
    Director's Final Findings and Orders: that instrument creates dated obligations with 30-, 90-
    and 120-day clocks, and its milestones will appear on the eDocument portal weeks before SDWIS
    knows about them. Next routine pass: 2026-10-16.
  the_rule_this_pass_learned:
    tag: '[verified]'
    statement: >-
      QUERY THE STATE PORTAL BEFORE THE FEDERAL ONE, for anything about enforcement. A Director's
      Final Findings and Orders issued 2026-09-03 and ECHO, read 2026-09-16, still reported zero
      formal SDWA actions because SDWIS had not been extracted since 2026-07-09. Every SDWA answer
      must now be stamped with the SDWIS extract date AND checked against eDoc Secondary ID
      OH6900711.
  dated_triggers:
  - date: '2026-10-05'
    what: >-
      Thirty days after the Orders took effect — the Order No. 2 window for the Village to respond
      in writing to any Ohio EPA comments or deficiencies.
    route: eDoc Secondary ID OH6900711
  - date: '2026-10-16'
    what: >-
      The August and September 2026 mercury DMRs for OH0026921. August had not posted at this pass
      and its absence was NOT read as non-submission.
    route: ECHO eff_rest_services.get_effluent_chart, OH0026921, parameter 50092
  - date: '2026-10-16'
    what: >-
      Whether the six unresolved June-2026 whole-effluent-toxicity RNCs cleared once the 2026-08-25
      biomonitoring retests were processed. They were unresolved at the 2026-09-11 extract.
    route: ECHO effluent chart, OH0026921, parameters 61425/61426/TCM3B/TCP3B
  - date: '2026-11-15'
    what: >-
      The next SDWIS extract. Until it moves, questions 5, 6 and the Stage 2 DBPR grid cannot be
      answered federally at all. Check the extract date FIRST and stop if it has not moved.
    route: ECHO dfr_rest_services.get_dfr, p_id OH6900711 — read SystemExtractDates before anything else
  - date: '2026-12-01'
    what: >-
      Q3 2026 Stage 2 DBPR. The Orders establish three consecutive quarters of TTHM MCL violation
      (Q4 2025, Q1 2026, Q2 2026) and an expansion from one monitoring location to two. Whether Q3
      makes four, and at how many locations, is the live question.
    route: eDoc Secondary ID OH6900711 first, ECHO second
  - date: '2027-01-01'
    what: >-
      The General Plan for TTHM compliance is due within 120 days of 2026-09-03. This is the single
      highest-value document the Orders create — it must describe at least three alternatives with
      cost estimates and funding sources, and name the selected one.
    route: eDoc Secondary ID OH6900711; Ohio EPA DDAGW engineering plan approval
  - date: '2027-01-30'
    what: >-
      The conditioned 2026 licence to operate expires. The cover letter says the Director intends
      to issue at minimum conditioned LTOs for the duration of the Orders, so the question is
      whether the 2027 licence is conditioned too.
    route: eDoc Secondary ID OH6900711; the Ohio EPA licence-to-operate register
  - date: '2027-06-30'
    what: >-
      The next Consumer Confidence Report. It is now REQUIRED under OAC 3745-96 to disclose the
      conditioned status of the licence — which makes it a checkable artifact and ties it to the
      two Consumer Confidence Rule violations still unaddressed.
    route: the Village's own DocumentCenter; eDoc Secondary ID OH6900711
  - date: '2026-10-16'
    what: >-
      Eagle Creek dry storage construction start and any FEMA award — question 8, which was NOT run
      this pass and is carried forward rather than reported as unchanged.
    route: Hancock County Flood-Risk Reduction Program project pages; Ohio EMA EMC-2023-FM-003-0004
  - date: '2027-03-15'
    what: >-
      The annual Pollutant Minimization Program report, due March 1. The 2026 report covering the
