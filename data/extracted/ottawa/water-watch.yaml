    the_consequence_that_reaches_the_public:
      tag: '[verified]'
      statement: >-
        Under OAC 3745-84-04 the Village must display the conditioned licence at the PWS office
        where it is clearly visible, and must notify its customers of the conditioned status in the
        Consumer Confidence Report under OAC 3745-96. So the next CCR is now REQUIRED to carry this
        — which makes the CCR a dated, checkable artifact rather than a routine one, and ties this
        question to the two open Consumer Confidence Rule violations above.
