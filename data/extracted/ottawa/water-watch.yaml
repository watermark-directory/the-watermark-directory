open_leads:
- id: OTTAWA-PMP-REPORTS
  status: >-
    STILL OPEN as of 2026-09-16 — no request has been sent, and it is now the highest-value lead on
    this file. It was NOT closable by portal query: eDoc Secondary ID 2PD00028 was swept this pass
    and carries no PMP report under any keyword.
  why_it_got_more_valuable: >-
    The 2026 mercury record makes the December 2025 spike stranger, not less strange. This plant
    received a 118 ng/L influent in February 2026 — five times December's 20.3 — and discharged
    5.55. In December it received 20.3 and discharged 36.70. A report whose statutory content is
    "potential sources of mercury and actions taken" is the one document that could reconcile
    those two months, and the RNC records closed on 2026-05-31 by "back into compliance" without
    anyone having to explain either.
  priority: 1
  question: What do the annual Pollutant Minimization Program reports say about the source of the mercury?
  why: >-
    Permit Part II Item X.1.g requires one by March 1 each year, listing all minimization
    monitoring results, potential sources of mercury, and actions taken. The 2026 report would
    cover the December 2025 spike. It is the single document most likely to explain the
    influent/effluent inversion.
  route: Ohio EPA records request, Division of Surface Water NPDES Permit Unit
- id: OTTAWA-SSO-2026
  question: What sanitary sewer overflow drew the O&M half of the 2026-03-04 warning letter?
  why: ICIS records the violation but no date, volume or location. The village runs fully separated sewers, so an SSO is a prohibited discharge, not a permitted wet-weather event.
  route: The warning letter itself (Ohio EPA NWDO) and the permit's Part II Item C SSO reports
- id: OTTAWA-INSPECTION-2026-02
  question: What did the 2026-02-24 state evaluation find?
  why: It sits between the December exceedance and the March warning letter; ICIS publishes no finding.
  route: Ohio EPA records request, compliance monitoring report OH000NQ0000115015
- id: OTTAWA-FINISHED-WATER-MERCURY
  question: Does the Village sample its raw or finished drinking water for mercury, and what are the results?
  why: >-
    The permit's own Item X.3 makes intake-water mercury a defence to the annual ceiling. The CCR
    publishes no mercury figure. Both facts are established; the link between them is not.
  route: Ohio EPA Division of Drinking and Ground Waters sampling record for OH6900711
- id: OTTAWA-INTAKE-RIVER-MILE
  question: At what river mile does the Village's intake sit?
  why: The outfall's river mile (22.1) is cited; the intake's is not, so the separation between them is an inference from coordinates.
  route: The Village's Drinking Water Source Assessment (Ohio EPA, November 2003), named in the CCR
- id: OTTAWA-PEQ-2014-BASELINE
  question: What was the projected effluent quality average in the ORIGINAL mercury variance?
  why: The fact sheet's narrative and its Table 8 give incompatible readings of the figure 7.1 ng/L; only the 2014 permit settles which.
  route: Ohio EPA DAM / records request for the 2014 permit and its variance application
- id: OTTAWA-EFFLUENT-P
  question: What is this plant's effluent total-phosphorus record against its 750 kg seasonal allocation?
  why: The previous check recorded strong performance; this check did not verify it and will not carry it unverified.
  route: ECHO effluent chart parameter 00665; the annual Season Report required by OHP000001 Part IV.D
- id: OTTAWA-SANITARY-SURVEY-2025
  status: >-
    STILL OPEN, and sharper after 2026-09-16. ECHO's survey record is unchanged and still publishes
    only the category codes — Source "R" (recommendations made) and Treatment "R", with Management
    /Operation and Finished Water Storage at "M" (minor deficiencies) — and no text. A Director's
    Final Findings and Orders now requires a General Plan evaluating at least three TREATMENT
    alternatives for TTHM reduction, fifteen months after a survey made recommendations against
    exactly that category. What those recommendations said is the question of whether this was
    foreseen.
  question: What recommendations did the 2025-06-12 sanitary survey make against Source and Treatment?
  why: Five months before the first TTHM violation, with recommendations recorded against exactly the two categories a disinfection-byproduct problem would implicate.
  route: Ohio EPA / Putnam County district health department records request
- id: OTTAWA-CCR-2020-VIOLATION
  question: What is Consumer Confidence Rule violation 8263895, unaddressed since 2020-01-27, actually about?
  why: It is one of the two records keeping this system at twelve of twelve quarters in noncompliance. SDWIS publishes no reason text.
  route: Ohio EPA Division of Drinking and Ground Waters
- id: OTTAWA-LTO-2026
  status: >-
    CLOSED 2026-09-16. A 2026 licence WAS issued and it is CONDITIONED, expiring 2027-01-30 —
    enclosed with the Director's Final Findings and Orders, data/documents/oepa/ottawa/edoc-4255174.pdf.
    Under OAC 3745-84-06(A) the Director intends to issue at minimum conditioned LTOs for the
    duration of the Orders, so the 2027 licence is the live question, not this one.
  question: Was a 2026 licence to operate issued for OH6900711, and was it unconditional?
  why: The 2025 licence expired 2026-01-30; the report published 2026-07-01 says nothing about 2026.
  route: Ohio EPA licence-to-operate register
- id: OTTAWA-WTP-OHG8P0080
  question: What does the water plant's own NPDES general permit OHG8P0080 authorize it to discharge?
  why: It is the third permit on this river at this village and its terms are not held.
  route: Ohio EPA DAM general-permit documents
- id: OTTAWA-UCMR5-LITHIUM
  question: What are the Village's four UCMR 5 lithium results, and how was the published average computed?
  why: >-
    The CCR's lithium row cannot close arithmetically as printed — a 0 minimum and an 11.9 maximum
    cap a four-sample mean at 8.925, below the 10.727 published. The likely reading is an average
    over detects only, but the row is the one unregulated entry carrying no detection count.
  route: EPA UCMR 5 public data for PWS OH6900711; or the Village, which offers the full results by phone
- id: OTTAWA-FLOOD-DOWNSTREAM-BENEFIT
  question: Does the Hancock County program's hydraulic modelling produce any figure for Putnam County?
  why: The program quantifies 16% peak reduction at Findlay and nothing downstream. Whether "nothing published" means "modelled as zero" or "not modelled" is unestablished.
  route: The program's Draft Environmental Assessment (Ohio EMA, EMC-2023-FM-003-0004) and the Maumee Watershed Conservancy District
- id: OTTAWA-DFFO-GENERAL-PLAN
  question: >-
    Which of at least three alternatives did the Village select for TTHM reduction, what does it
    cost, and how is it to be funded?
  why: >-
    NEW 2026-09-16. Order No. 3 of the 2026-09-03 Director's Final Findings and Orders requires a
    General Plan within 120 days containing an engineering description of existing facilities, at
    least three alternatives, cost estimates for each, anticipated sources of funds, and an
    indication of the selected alternative. For a village of 4,393 people on 1,920 connections it
    is also the document that will say what this costs per household.
  route: eDoc Secondary ID OH6900711; Ohio EPA DDAGW engineering plan approval
  due: '2027-01-01'
  priority: 1
- id: OTTAWA-CYANOBACTERIA-2026
  question: >-
    Why was cyanobacteria screening missed for the 2026-06-21 to 2026-07-04 monitoring period, and
    has the Village returned to its HAB monitoring schedule?
  why: >-
    NEW 2026-09-16, from the 2026-07-29 NOV (edoc-4208516.pdf). This is a surface-water system
    drawing from the Blanchard River, the missed window is inside the harmful-algal-bloom season,
    and the monitoring that was missed is the monitoring that would have detected an event. The
    NOV establishes a failure to LOOK and says nothing about what was there.
  route: Ohio EPA DDAGW; the Village's HAB monitoring schedule; subsequent screening results
  priority: 2
- id: OTTAWA-DO-2026-04
  question: What caused the 2026-04-30 effluent dissolved-oxygen minimum of 1.07 mg/L?
  why: >-
    NEW 2026-09-16. Against a 5.4 mg/L limit and a 7.46-9.70 mg/L range in every other 2026 month,
    this is an 80% shortfall in a single month. ECHO classifies it Non-Reportable Noncompliance, so
    it never reaches the quarterly grid and a watch reading only that grid would never see it.
    Nothing in the corpus addresses April 2026.
  route: Ohio EPA NWDO; the plant's own operating records; the 2026-02-24 evaluation's follow-up
  priority: 2

provenance:
  extracted_at: '2026-07-31'
  extractor: standing water watch, issue 1422
  tags: [verified, inference, open, ottawa, putnam-county, blanchard-river, npdes, sdwa, mercury,
    variance, snc, tthm, dbpr, one-river, flood, enforcement]
  confidence: high
  summary: >-
    One village on one river, in violation on both sides of it. The sewage plant's mercury
    monthly-average limit was cut from 6.8 to 4.5 ng/L at the 2025 renewal — to the plant's own
    63-sample mean — and it then exceeded it three times, hardest in December 2025 at 36.70 ng/L
    against an influent of 20.3, discharging more mercury than it received. Two of the three
    exceedances would have been violations under the old limit as well. Six quarters of
    noncompliance, two of Category-I significant noncompliance, one warning letter, no formal
    enforcement, no penalty. About a mile and a half upstream the same village's water plant exceeded the
    trihalomethane MCL in two consecutive quarters, 83 then 86 ppb, on a system EPA carries as an
    SDWA Enforcement Priority with twelve of twelve quarters in noncompliance. The mercury streak
    appears to have broken in April 2026; the June DMR was not yet on the record, and the
    trihalomethane return to compliance is undetermined in the federal system. The plant's own
    permit anticipates that its mercury may have come out of the water the village drank.
