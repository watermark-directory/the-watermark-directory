# ═════════════════════════════════════════════════════════════════════════════
# THE GEOMETRY — why this is one story and not two
# ═════════════════════════════════════════════════════════════════════════════
one_river:
  tag: '[verified]'
  intake:
    facility: Village of Ottawa Water Treatment Plant, 1972 Agner Street
    coordinates: [41.016247, -84.02328]
    source: EPA FRS / ICIS-NPDES record for OHG8P0080
    ccr_quote: >-
      "The Village of Ottawa public water system draws its drinking water from the Blanchard River
      and its tributaries (surface waters), which run south of the water treatment plant."
  outfall:
    facility: Ottawa WWTP outfall 2PD00028001
    river_mile: 22.1
    coordinates_permit_and_icis: [41.0289, -84.0492]
    coordinates_public_notice: [41.031111, -84.055278]
  relative_position:
    tag: '[inference]'
    finding: >-
      The intake sits UPSTREAM of the outfall. The Blanchard flows west-north-west through this
      reach — the USGS gage sequence runs 04189260 (at Ottawa) then 04189500 (at Glandorf, to the
      north-west) before the Auglaize confluence — and the water plant is east and south of the
      sewage plant on every coordinate set held (-84.0233 against -84.0492).
    straight_line_separation_km: 2.59
    straight_line_separation_mi: 1.61
    arithmetic: >-
      dlat 0.012653 deg x 111.0 km = 1.404 km north; dlon 0.02592 deg x 111.320 km x cos(41.02 deg)
      = 2.177 km west; hypotenuse 2.591 km = 1.610 mi. River distance is longer than straight-line because the channel
      meanders; the "about a mile and a half" used elsewhere in this record is this straight-line
      figure, NOT a river mile. The river distance between the two is unestablished.
    why_it_is_inference: >-
      The intake's own river mile is not stated in any committed document. The ordering is
      reasoned from coordinates and flow direction, not read off an instrument. It is also what
      the regulatory record implies — see below — but implication is not statement.
      Lead OTTAWA-INTAKE-RIVER-MILE.
  the_use_designation_confirms_the_ordering:
    tag: '[verified]'
    detail: >-
      The reach at RM 22.1 is designated for Warmwater Habitat, Agricultural Water Supply,
      Industrial Water Supply and Primary Contact Recreation — and NOT for Public Water Supply.
      The same fact sheet states the rule: "Public Water Supply designations apply near existing
      water intakes." A village that drinks from this river, on a reach below its own outfall,
      would put that outfall inside a PWS-designated segment. It is not.
    consequence: >-
      The mercury wasteload allocation for this discharge is therefore computed against the
      wildlife criterion (1.3 ng/L) and the human-health NONDRINKING criterion (3.1 ng/L). No
      drinking-water criterion enters it, and correctly so — the drinking-water intake is above
      the outfall. This is the structural fact the "one river, both sides" framing rests on, and
      it is not an irregularity.
  the_permit_writes_the_loop_down_itself:
    tag: '[verified]'
    source: 2PD00028*PD Part II Item X.3, p. 28
    quote: >-
      "The requirements of Part II, Item AA.2 shall not apply if the permittee demonstrates to the
      satisfaction of the Director that the mercury concentration in the permittee's effluent
      exceeds 12 ng/L due primarily to the presence of mercury in the permittee's intake water."
    note: >-
      The controlling instrument anticipates that the mercury in this plant's effluent may have
      arrived in the water the village took out of the same river, and provides relief on that
      basis. Whether it ever has is [open] — and unanswerable from the committed record, because
      the Village publishes no mercury result for its finished water and the corpus holds no raw-
      water mercury sampling.
  what_does_NOT_connect_the_two_sides:
    tag: '[verified]'
    killed_inferences:
    - claim: The sewage plant's chlorine causes the tap-water trihalomethanes.
      why_it_is_false: >-
        The WWTP disinfects with ULTRAVIOLET light (fact sheet p. 6). It adds no chlorine to the
        river. TTHM forms at the WATER plant, where its own chlorine meets the river's natural
        organic carbon — the Village says so in its own public notice.
    - claim: The mercury exceedances show up in the drinking water.
      why_it_is_unsupported: >-
        The intake is upstream of the outfall, so effluent from the WWTP does not reach the
        Village's own intake at all. And the 2025 CCR publishes no mercury result of any kind.
    - claim: The upstream floodplain excavation released the mercury.
      why_it_is_false: >-
        See the flood-program block below. The WWTP treats sewage, not river water; its influent
        mercury in December 2025 was an ordinary 20.3 ng/L. There is no pathway from a Findlay
        floodplain to an Ottawa sewer.
    discipline: >-
      These are recorded because each is a plausible-sounding link a reader could draw from this
      record, and each is wrong. Naming the tempting inference and killing it is cheaper than
      correcting it later.

# ═════════════════════════════════════════════════════════════════════════════
# UPSTREAM — the flood program, whose benefits this site does not get
# ═════════════════════════════════════════════════════════════════════════════
upstream_flood_program:
  watch_item: 11
  checked_on: '2026-07-31'
  program: Hancock County Flood-Risk Reduction Program (Maumee Watershed Conservancy District)
  framing:
    tag: '[verified]'
    statement: >-
      Every structural measure in this program is in Hancock County, 34.3 river miles upstream of
      Ottawa's outfall. The program's published modelling quantifies its benefit at Findlay and
      states no benefit for Ottawa or Putnam County. Relief for Ottawa, if any, is entirely
      upstream-derived and entirely unquantified. That framing is held even where it makes the
      program look worse than it may be.
  eagle_creek_dry_storage:
    tag: '[reference]'
    source: https://hancockcountyflooding.com/eagle-creek-dry-storage (read 2026-07-31)
    status: final design complete; property acquisition complete; obtaining easements and permits
    construction_start: near the end of 2026 (pending FEMA grant award and completion of review/environmental assessments)
    construction_duration: approximately 18 to 24 months
    dam_safety_permit: obtained through ODNR Division of Water Resources Dam Safety Program
    funding:
      state_capital_budget_grants_usd: 60000000
      fema: being pursued to complete the funding
    modelled_effect_at_findlay:
      event: 1% Annual Chance Exceedance
      blanchard_peak_flow_reduction_cfs: 2550
      blanchard_peak_flow_reduction_pct: 16
      water_surface_elevation_reduction_ft: 2.2
      location: near the confluence in downtown Findlay
      floodplain_removed: approximately 1,830 parcels and 1,400 acres
    downstream_benefit_for_ottawa:
      tag: '[open]'
      note: >-
        The project page describes benefits to "Eagle Creek and the Blanchard River" and gives no
        figure for any point below Findlay. No Ottawa or Putnam County benefit is quantified
        anywhere in the source read. Lead OTTAWA-FLOOD-DOWNSTREAM-BENEFIT.
  phase_2_benching:
    tag: '[reference]'
    milestone: soil remediation completed
    period: December 2025 to February 2026
    materials_removed:
      impacted_soil_tons: 7325
      glass_fill_tons: 1070
      asphalt_tons: 432
      disposal: Hancock County Landfill
    contaminants_named: [lead, arsenic, mercury, cadmium, polycyclic aromatic hydrocarbons]
    implemented_by: [Civil & Environmental Consultants Inc. (CEC), Buckeye Elm Contracting]
    source: WFIN local news report of the Hancock County Commissioners / City of Findlay announcement (read 2026-07-31)
    status: precursor step complete; main Phase 2 benching construction not yet begun
    the_coincidence_that_is_not_a_mechanism:
      tag: '[verified]'
      observation: >-
        Mercury-bearing floodplain soil was excavated in the Blanchard corridor at Findlay between
        December 2025 and February 2026. Two of Ottawa's three mercury exceedances fall inside that
        window — December 2025 (36.70 ng/L) and February 2026 (5.55 ng/L). It is a date-window
        overlap and nothing more: they are not the two LARGEST exceedances (September 2025's
        9.60 ng/L is the second largest, and it precedes the excavation).
      why_it_is_not_a_link: >-
        The Ottawa WWTP treats SEWAGE, not river water. Nothing excavated from a floodplain 34
        river miles upstream enters its influent, and its December 2025 influent mercury was an
        ordinary 20.3 ng/L — slightly ABOVE the 18.15 ng/L median of the paired series, and nowhere
        near the 74.9 and 118 ng/L months that produced no comparable exceedance. The Village's
        drinking-water intake IS on the river and IS downstream of Findlay, but the Village
        publishes no mercury result for finished water and its violation that quarter was
        trihalomethanes, which have nothing to do with mercury.
      why_it_is_recorded_anyway: >-
        Because the dates line up and someone will notice. Recording the coincidence together with
        the reason it cannot be causal is the only way to stop it being asserted later.
      the_one_thing_it_does_establish:
        tag: '[verified]'
        note: >-
          There is documented mercury in the Blanchard River floodplain upstream of Ottawa's
          drinking-water intake. That is a fact about the watershed worth carrying independently
          of these violations, and it sits against Table 12's "Mercury ng/L annual 0 — No
          representative data available."

# ═════════════════════════════════════════════════════════════════════════════
# ── The 2026-09-16 pass ──────────────────────────────────────────────────────
# Run 26 days after this file's own `next_check_not_before: 2026-08-21`. The eight questions are
# answered in the order they were asked. Two of them could only be answered by leaving the federal
# system, and the most important finding of this pass is that the federal system is WRONG.
pass_2026_09_16:
  ran_on: '2026-09-16'
  previous_pass: '2026-07-31'
  declared_next_check_not_before: '2026-08-21'
  days_late: 26
  routes_run:
  - EPA ECHO dfr_rest_services.get_dfr for both sides — p_id OH0026921 (CWA) and p_id OH6900711 (SDWA).
  - EPA ECHO eff_rest_services.get_effluent_chart, OH0026921 — parameter 50092 for 2025 and 2026, and an all-parameter 2026 pull.
  - Ohio EPA eDocument portal, scripted — Secondary ID 2PD00028 (the WWTP) and Secondary ID OH6900711 (the PWS).
  - Direct fetch and text-layer read of three newly surfaced drinking-water documents, all three committed.

  # ⚠️ ─────────────────────────────────────────────────────────────────────────
  the_federal_system_is_stale_and_that_is_the_finding:
    tag: '[verified]'
    statement: >-
      SDWIS has NOT been re-extracted since 2026-07-09. That is the same extract date this file
      recorded on 2026-07-31, ten weeks ago. Every SDWA figure ECHO returns today is therefore
      the SAME READING this file already holds — not a fresh confirmation of it.
    what_this_forbids: >-
      Re-reading an unchanged extract and calling it a re-verification. Questions 5, 6 and 7 are
      all keyed to SDWIS, and a naive pass would have reported them "unchanged" with a 2026-09-16
      date on them, converting a stale read into a fresh negative. The correct answer to "is this
      still true?" when the source has not been re-read is "unknown", not "yes".
    and_it_was_actually_wrong: >-
      Not merely stale. The state portal carries a Director's Final Findings and Orders against
      this PWS dated 2026-09-03 — a formal enforcement action — while ECHO, at its 2026-07-09
      extract, still reports none. See `question_4` below. This is the single most useful thing
      this pass learned and it generalizes: for Ohio drinking-water enforcement the eDocument
      portal leads SDWIS by weeks to months, and a federal zero is not a negative until the state
      record agrees with it.
    the_cwa_side_did_advance: >-
      ICIS-NPDES moved 2026-07-24 → 2026-09-11 and the CWA compliance window moved to 2026-06-30,
      so the wastewater answers below ARE fresh. The two halves of this file are now on different
      vintages, and each figure is stamped accordingly.

  # ── The eight questions, in order ────────────────────────────────────────
  question_1:
    asked: Are the June, July and August 2026 mercury monthly averages reported, and are they under 4.5 ng/L?
    answer: TWO OF THREE REPORTED; BOTH WELL UNDER. AUGUST HAS NOT POSTED.
    tag: '[verified]'
    source: EPA ECHO eff_rest_services.get_effluent_chart, OH0026921, parameter 50092, read 2026-09-16 (ICIS extract 2026-09-11)
    values_ng_per_l:
      june_2026: {effluent_001: 1.48, influent_601: 2.82, limit: 4.5, received: '2026-07-13', violation: false}
      july_2026: {effluent_001: 1.98, influent_601: 8.96, limit: 4.5, received: '2026-08-12', violation: false}
      august_2026: NOT REPORTED — the series ends at the period closing 31-JUL-26.
    the_august_gap:
      tag: '[open]'
      statement: >-
        Recorded as a gap, not as a negative. The August DMR was due about 2026-09-10 and the ICIS
        extract is 2026-09-11, so one day separates them; an absence here is as likely to be
        extract timing as non-submission. Nothing is concluded from it. Re-check after the next
        extract.
    the_streak_is_broken:
      tag: '[verified]'
      statement: >-
        The last mercury exceedance was February 2026 at 5.55 ng/L. Since then: March 4.34, April
        2.80, May 3.53, June 1.48, July 1.98 — FIVE consecutive compliant months, and the last two
        are the lowest effluent values in the whole series. This file's cautious "appears to have
        broken in April 2026" is now firmly established rather than provisional.
    the_influent_is_still_the_strange_number:
      tag: '[verified]'
      statement: >-
        And the inversion this file was built to explain has not recurred. In 2025 the influent ran
        7.83–74.9 ng/L against an effluent that was usually near 1, and in December 2025 the plant
        discharged 36.7 while receiving 20.3. In 2026 the influent has been 12.6, 118, 12.2, 24.3,
        11.3, 2.82, 8.96 — the February influent spike of 118 ng/L is the highest in either year
        and produced an effluent of only 5.55. The plant is now removing mercury, including from a
        spike five times December's. That makes December 2025 more anomalous, not less, and it
        raises the value of the Pollutant Minimization Program report (OTTAWA-PMP-REPORTS).
  question_2:
    asked: Have the four unresolved mercury RNC records (2025-09, 2025-12 x2, 2026-02) been resolved, and how?
    answer: RESOLVED — ALL OF THEM, ON ONE DATE, BY "RE - BACK INTO COMPLIANCE". NO ENFORCEMENT WAS INVOLVED.
    tag: '[verified]'
    source: the NPDESViolations records attached to the DMR rows, ECHO effluent chart, read 2026-09-16
    records:
    - {period: '2025-09-30', value_ng_l: 9.6, limit: 4.5, exceedance: 113%, severity: Significant/Category I Noncompliance Effluent Violation, rnc_detected: '2025-12-31', rnc_resolution: RE - Back into Compliance, rnc_resolved: '2026-05-31'}
    - {period: '2025-12-31', value_ng_l: 36.7, limit: 4.5, exceedance: 716%, severity: Significant/Category I Noncompliance Effluent Violation, rnc_detected: '2025-12-31', rnc_resolution: RE - Back into Compliance, rnc_resolved: '2026-05-31'}
    - {period: '2026-02-28', value_ng_l: 5.55, limit: 4.5, exceedance: 23%, severity: Significant/Category I Noncompliance Effluent Violation, rnc_detected: '2026-02-28', rnc_resolution: RE - Back into Compliance, rnc_resolved: '2026-05-31'}
    the_how_is_the_point:
      tag: '[verified]'
      statement: >-
        "RE - Back into Compliance" is the resolution code. The records closed because the plant's
        numbers came down, not because anything was done to it. No order, no penalty, no consent
        agreement — the same 2026-03-04 warning letter remains the only action of any kind on the
        CWA side, and it is informal. Three Category-I significant-noncompliance effluent
        violations, one of them 716% over limit, resolved administratively by the passage of
        compliant months.
    a_counting_caveat:
      tag: '[open]'
      statement: >-
        This file counted FOUR unresolved records; the effluent chart carries THREE distinct
        violation records, with both 2025 records sharing an RNC detection date of 2025-12-31.
        The "x2" in the original count most likely reflects two RNC entries in the Q4-2025 cycle
        rather than a fourth exceedance, but that is not established and the discrepancy is left
        visible rather than reconciled by preferring either number.
  question_3:
    asked: Have the two 2026-03-04 single-event violations — the narrative effluent violation and the SSO O&M violation — closed?
    answer: STRUCTURALLY UNANSWERABLE ON THIS ROUTE. Both records exist and carry NO status in any quarter.
    tag: '[open — route cannot answer]'
    source: ECHO DFR CWASECompliance block, OH0026921, read 2026-09-16
    detail: >-
      ECHO still carries both single-event violations — NPDESViolationId 3687543993 "Effluent
      Violations - Narrative Effluent Violation" and 3687543994 "WW SSO - Improper Operation and
      Maintenance", both State agency. Every one of the thirteen quarterly status fields on both
      records is NULL. There is no open quarter, no resolved quarter, no date, no volume and no
      location — exactly as this file already recorded on 2026-07-31.
    what_that_means: >-
      Not "they are still open" and not "they have closed". ECHO's single-event violation table
      publishes the existence of these two records and nothing else about them. A pass that read
      the empty status row as closure, or as continued openness, would be inventing data. The only
      route is the warning letter itself and the permit's Part II Item C SSO reports — already
      tracked as OTTAWA-SSO-2026 and unchanged.
  question_4:
    asked: Has any FORMAL enforcement issued? Director's Final Findings and Orders, an administrative order, any penalty. The answer on 2026-07-31 was none.
    answer: YES — ON THE DRINKING-WATER SIDE. A DIRECTOR'S FINAL FINDINGS AND ORDERS ISSUED 2026-09-03.
    tag: '[verified]'
    source: data/documents/oepa/ottawa/edoc-4255174.pdf
    superseded_negative:
      tag: '[verified negative — SUPERSEDED]'
      the_negative: Formal SDWA enforcement against OH6900711 — zero.
      was_correct_on: '2026-07-31'
      against_extract: SDWIS 2026-07-09
      superseded_on: '2026-09-16'
      by: Director's Final Findings and Orders, journalized and effective 2026-09-03
      statement: >-
        It was correct when it was written and it is kept. On 2026-07-31 no formal SDWA action
        existed and ECHO said so against an extract three weeks old. A formal order then issued on
        2026-09-03. This is a supersession by events, not an error — and the file records it that
        way rather than quietly overwriting the earlier reading.
      the_uncomfortable_part: >-
        ECHO STILL SAYS ZERO. Read 2026-09-16, the SDWA summary returns FormalEnfActCount null,
        TotalPenalties $0 and 16 informal actions, because SDWIS has not been re-extracted since
        2026-07-09. Had this pass "re-verified the standing negative" against the federal system,
        as the watch schedule literally directs, it would have re-affirmed a negative that a
        signed Director's order had already falsified thirteen days earlier. The lesson is in the
        method, not the facility.
    what_the_order_says:
      tag: '[verified]'
      effective: '2026-09-03'
      entered_directors_journal: '2026-09-03'
      signed_by: John Logue, Director, Ohio EPA
      respondent: Ottawa Village, by Mayor J. Dean Meyer
      authority: ORC 6109 and ORC 3745.01
      findings: >-
        The PWS exceeded the TTHM MCL in the FOURTH QUARTER 2025 and FIRST QUARTER 2026 at location
        DS201, and in the SECOND QUARTER 2026 at locations DS201 AND DS202. Each is a separate
        violation of ORC 6109.31. The system is surface-water sourced, 1,920 service connections,
        population 4,393, at 1972 S Agner St.
      orders_summary:
      - The 2026 licence to operate is CONDITIONED from 2026-09-03 until 2027-01-30.
      - Within 120 days — a General Plan under OAC 3745-91 for complying with the TTHM MCL in the distribution system, with at least three alternatives, cost estimates, funding sources and a selected alternative.
      - A pilot study protocol, study and report follow unless Ohio EPA determines a pilot is unnecessary, in which case detail plans are due within 90 days of General Plan approval.
      - Construction commences within 3 months of detail-plan approval and completes within 12 months.
      - TTHM MCL compliance achieved and maintained within 12 months of commencing operation.
      no_penalty:
        tag: '[verified]'
        statement: >-
          NO penalty is assessed. Section XI expressly RESERVES Ohio EPA's right to seek civil or
          administrative penalties for the cited violations and does not waive it; Section XII
          records the Village's consent "without admission of fact, violation or liability" and its
          waiver of all appeal rights. So the two figures this file tracks now diverge: formal
          enforcement actions = 1, total penalties = $0. Collapsing those into a single "no
          enforcement" claim is now wrong, and was the shape of the old finding.
  question_5:
    asked: Did the Q2 2026 Stage 2 DBPR determination land, and was it a violation? It read "Und" on the 2026-07-09 SDWIS extract.
    answer: IT WAS A VIOLATION — AND AT TWO LOCATIONS, NOT ONE. The federal system still reads "Und".
    tag: '[verified]'
    source: data/documents/oepa/ottawa/edoc-4255174.pdf, Findings paragraph 4
    statement: >-
      The DFFO finds a TTHM MCL exceedance "during the second quarter 2026 monitoring period at
      locations DS201 and DS202". That is the determination this file was waiting for, established
      by the state instrument that acts on it rather than by the federal record that reports it.
      It is a THIRD consecutive quarter of TTHM MCL violation, and it EXPANDED from one monitoring
      location to two.
    the_federal_reading_today:
      tag: '[verified]'
      statement: >-
        ECHO's SDWISCompliance grid, read 2026-09-16, still shows Stage 2 DBPR MCL as
        "10/01/2025 - 12/31/2025" in Qtr11, "01/01/2026 - 03/31/2026" in Qtr12 and "Und" in Qtr13
        (04/01/2026 - 06/30/2026). Undetermined, at an extract that predates the determination.
      do_not: >-
        Report "Und" as this quarter's status now that the Orders exist. And do not treat the
        federal "Und" as contradicting the state finding — it is an older reading, not a competing
        one.
    the_archived_quarters_are_not_returns_to_compliance:
      tag: '[verified]'
      statement: >-
        Worth stating because the field names invite the error. Violation 8263939 (Q4 2025, .083
        MG/L against .08) and 8263940 (Q1 2026, .086 MG/L against .08) both show Status "Archived"
        with a ResolvedDate — and in each case the ResolvedDate is IDENTICAL to the compliance
        period end date (2025-12-31 and 2026-03-31). That is SDWIS closing a monitoring period,
        not the system demonstrating compliance. The third quarter's violation, and the Orders,
        settle which reading is right.
      enforcement_attached: >-
        Each of those two quarters drew three INFORMAL actions — a State Violation/Reminder Notice,
        a State Public Notification requested, and a State Public Notification received. Nothing
        formal until 2026-09-03.
  question_6:
    asked: Did SDWIS clear Consumer Confidence Rule violation 8263937 after the 2026-07-01 report? And is 8263895, open since 2020, still unaddressed?
    answer: BOTH STILL "UNADDRESSED" — BUT AT AN EXTRACT THAT CANNOT ANSWER THE FIRST QUESTION.
    tag: '[verified for 8263895; open for 8263937]'
    records:
    - violation_id: '8263937'
      rule: Consumer Confidence Rule
      noncompliance_begin: '2025-11-13'
      noncompliance_end: '--->'
      status: Unaddressed
      resolved_date: null
      enforcement: one State Violation/Reminder Notice, 2025-11-13
      reading:
        tag: '[open]'
        statement: >-
          NOT ANSWERED. SDWIS was extracted 2026-07-09 — eight days after the 2026-07-01 report
          this question is about. An eight-day-old extract cannot show whether a report published
          on day one cleared the violation. The status is unchanged for the same reason the extract
          date is unchanged, and reporting that as "still unaddressed as of 2026-09-16" would be
          false precision.
    - violation_id: '8263895'
      rule: Consumer Confidence Rule
      noncompliance_begin: '2020-01-27'
      noncompliance_end: '--->'
      status: Unaddressed
      resolved_date: null
      enforcement: one State Violation/Reminder Notice, 2020-01-27, and nothing since
      reading:
        tag: '[verified]'
        statement: >-
          STILL UNADDRESSED, and here the stale extract does not matter — the violation has been
          open six years and eight months, and an eight-week-old reading cannot change that
          materially. One informal notice was issued on the day it opened and no action of any kind
          has followed in more than six years. SDWIS publishes no reason text, so what it is about
          remains OTTAWA-CCR-2020-VIOLATION.
    a_stream_this_watch_was_not_tracking:
      tag: '[verified]'
      statement: >-
        The same violation table carries THREE Lead and Copper Rule Revisions records this file
        does not mention: 8263935 (reporting, 2024-10-17, resolved 2024-10-23), 8263936 (treatment
        technique, 2024-10-17, resolved 2024-10-23) and 8263938 (reporting, 2025-07-02, resolved
        2026-01-09 by "State Compliance achieved"). All three are closed. A fourth LCRR row in the
        rule grid reads "Und" for Q2 2026. The five-year summary reports a 90th-percentile lead of
        0 mg/L over 2021-01-01 → 2023-12-31 while simultaneously flagging
        LeadCopperRuleHealthBasedViol = 1 — recorded as observed and NOT reconciled here.
      new_document: >-
        A "Verification of Lead Consumer Notice Issuance" form was published 2026-08-27 and is
        committed (edoc-4251474.pdf). Its completed fields are HANDWRITTEN and do not extract, so
        it establishes only that the lead consumer-notice process was in play — not any result.
  question_7:
    asked: Was a 2026 licence to operate issued for PWS OH6900711, and is it unconditional?
    answer: ISSUED, AND IT IS CONDITIONED. It expires 2027-01-30.
    tag: '[verified]'
    source: data/documents/oepa/ottawa/edoc-4255174.pdf — the Conditional Licence to Operate enclosed with the Orders
    statement: >-
      A CONDITIONAL LICENSE TO OPERATE OR MAINTAIN A PUBLIC WATER SYSTEM was issued under ORC
      6109.21 and expires 2027-01-30. The cover letter states that under OAC 3745-84-06(A) "during
      the duration of these DFFOs, the Director intends to, at minimum, issue conditioned LTOs to
