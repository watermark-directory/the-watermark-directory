# Village of Ottawa (Putnam County, OH) — standing water watch.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page) or read from a named
#                 federal system on a named extract date
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, arithmetic shown
#   [open]      = not established by any captured source — do NOT assert
#
# One village, one river, two permits. Ottawa draws its drinking water from the Blanchard River
# and returns its treated sewage to the same river about a mile and a half downstream. Both sides
# into violation in the same twelve months. This watch records both, or it records neither.
#
# Violations here are data with citations, not a gotcha. Every quarter that came back clean is
# recorded as such; every route that cannot answer a question says so; the exculpatory findings
# in the plant's own fact sheet are carried at the same weight as the exceedances.
meta:
  subject: >-
    Standing watch on the two sides of the Blanchard River at Ottawa — the WWTP's mercury
    Category-I significant noncompliance under NPDES OH0026921 / 2PD00028*PD, and the public water
    system's Stage 2 DBPR violations under PWS OH6900711
  kind: water-watch
  site: ottawa
  captured_for: issue 1422 (epic 1269, readiness(ottawa))
  extracted_at: '2026-07-31'
  checked_on: '2026-09-16'
  previous_check: '2026-07-31'      # the 1422 pass that wrote this file; before it the 2026-07-10 refresh
  federal_extract_dates:
    ICIS-NPDES: '2026-09-11'        # advanced from 2026-07-24
    SDWIS: '2026-07-09'             # ⚠️ UNCHANGED in ten weeks — every SDWA figure below is the SAME READING, not a re-verification
  method: >-
    Four routes, run independently and recorded separately: EPA ECHO's detailed facility report
    and effluent-chart services for the CWA side (OH0026921) and the SDWA side (OH6900711); the
    Ohio EPA DAM permit slots for the controlling instruments; the Village's own DocumentCenter
    for the Consumer Confidence Report; and the Hancock County Flood-Risk Reduction Program's own
    project pages for the upstream milestones. Each federal figure is stamped with the system
    extract date it was read against, because a quarter that reads clean today may only be a
    quarter whose DMRs have not landed.

# ── What changed since the 2026-07-10 refresh ─────────────────────────────────
# Recorded first because a standing watch is worth having only if it says what moved.
