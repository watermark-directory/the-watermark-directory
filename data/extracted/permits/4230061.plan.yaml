  summary: >-
    Part 1 of the approved BOSC-1A sanitary plan set. It draws the whole conveyance: gravity sewer
    from Building 1A to a temporary lift station at Cole St / Beery Rd, a 6" force main of about
    3,166 ft down Cole St, and a 12" gravity tail that ties into an existing 10" sanitary main in
    W Bluelick Rd at a new structure (47). That is the ONE point of connection the set shows, and
    the coordination notes tie the work on it to the Allen County Sanitary Engineering Department
    and American Township. The City of Lima appears only in the utility-locate list and in boilerplate
    general notes.
