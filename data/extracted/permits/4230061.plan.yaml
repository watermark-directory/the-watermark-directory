# Ohio EPA eDocument 4230061 — the APPROVED plan set (part 1 of 2: title, notes, plan sheets)
# behind Surface Water PTI DSWPTI-260597 (internal DSW-7312), the BOSC-1A sanitary sewer for
# Bistrozzi LLC, 4110 N Cole St, American Township. Issue #2090. Part 2 (profiles, details and the
# temporary lift station) is 4230062; the application is 4230068, the cover letter 4230060.
#
# ⚠️ WHY THIS WAS PULLED. #2090 asks whether the campus sanitary flow reaches the City of Lima's
# Cole St. SSO basin (consent-decree territory) or CSO outfall 037. The application (4230068)
# names the receiving plant as American/Bath WWTP (2PH00007), but an application's receiving-plant
# field is a claim about the destination, not a drawing of the route. This set DRAWS THE ROUTE to
# its single point of connection, and that connection is to an existing 10" main in W Bluelick Rd
# that the sheet notes put under the Allen County Sanitary Engineering Department — not the City.
# It does NOT draw where that County main goes next. See `open_after_this_pull`.
#
# ⚠️ DO NOT CONFLATE with "FM-2" in data/reference/hydrology/network.yaml (the campus 2.5 MGD
# industrial discharge modelled to the Lima WWTP). Nothing in this set is labelled FM-2, and this
# PTI covers sanitary sewer at 0.10 MGD design ADF. Whether an industrial / process line exists is
# a separate question this set does not answer either way.
#
# TAG VOCABULARY: [verified] printed in the drawing set (native CAD text layer, or read from the
# rendered sheet where stated) · [inference] reasoned and labelled · [open] not established here.

