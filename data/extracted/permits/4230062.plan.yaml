  arithmetic: >-
    [inference] 860 GPM ≈ 1.24 MGD and 2,700 GPM ≈ 3.89 MGD, at continuous pumping. These are PUMP
    CAPACITIES, not flows, and must not be published as discharge. They are recorded because the
    permanent station's capacity is roughly 2.6x the receiving plant's entire design ADF, and
    roughly 11x this PTI's design peak — which makes the permanent station's receiving point a
    question this permit does not answer, not a finding about it.

