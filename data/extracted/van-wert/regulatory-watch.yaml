    answer: ANSWERED — NEGATIVE, AND CERTIFIED BY THE PERMITTEE
    tag: '[verified]'
    sources:
    - data/documents/oepa/van-wert/edoc-4236096.pdf
    - data/documents/oepa/van-wert/edoc-4236116.pdf
    statement: >-
      CSO construction did NOT begin by the 2026-08-01 milestone, and no notification of
      commencement was filed — because there was no commencement to notify. What was filed instead
      is two "NPDES Permit Compliance Schedule Update" forms, each certified under penalty of law
      by Gregory Reinhart, WW Supt, each reporting event 3099 "Begin Construction" under the
      heading "Permit Compliance Schedules which have been or will be violated", with Status
