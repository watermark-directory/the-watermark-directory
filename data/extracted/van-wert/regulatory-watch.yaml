    - {thread: local_ballot, why: 'decided 2026-07-27 on signatures with no cure available; the open sub-questions are records-request work, not portal work'}
    - {thread: statewide_ballot, why: 'the file sets an ANNUAL cadence for it and names the 2027 filing deadline as its next dated trigger; six weeks is not the interval'}
