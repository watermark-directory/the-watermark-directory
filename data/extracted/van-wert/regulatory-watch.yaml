    route: eDoc Secondary ID 2GC08872 (3 rows); eDoc Entity Name "SUFFOLK" statewide; vanwert.org minutes
  - date: '2026-12-01'
    what: >-
      Earliest plausible appearance of Q3 2026 in ECHO's compliance window for OH0027910. Read the
      window END (must pass 2026-09-30), never the extract date. (2026-10-27: extract 2026-10-23,
      window end still 2026-06-30.)
    route: ECHO dfr_rest_services.get_dfr, p_id OH0027910
  - date: '2026-12-15'
    what: >-
      The community benefits agreement / PILOT instrument and AEP's 800 MW load study — neither has
      a dated path; this is a standing look, not a deadline. Also re-read the AEP project page for a
      Construction Notice (the page's own text says "fall 2026", conditional on approval).
    route: City council + county commissioners agendas; Van Wert County Foundation; aeptransmission.com/ohio/VanWert-Haviland/ direct URL
  - date: '2027-02-01'
    what: >-
      Annual review of the statewide ballot thread — the 2027 filing deadline, any Ohio Attorney
      General certification of summary language, any Ohio Ballot Board determination.
    route: the AG's and Ballot Board's own records — the upgrade path from [reference] to [verified]
  queries:
  - eDoc — Entity Name "QTS", statewide (35 as of 2026-10-27, unchanged since 2026-08-05; the count IS the signal)
  - eDoc — County = VAN WERT, Program = AIR PERMIT (344 as of 2026-10-27, was 337) — scan ALL rows for QTS/DATA CENTER/MEGA; Mone P0140139 is the positive control
  - eDoc — Secondary ID "2GC08872" (3 as of 2026-10-27, unchanged) — the co-permittee NOI would land here
  - eDoc — Entity Name "SUFFOLK", statewide — NEW 2026-10-27; no baseline yet, record one
  - eDoc — Secondary ID "2PD00006" (169 as of 2026-10-27, unchanged) — the CSO schedule
  - eDoc — County = VAN WERT, Program = NPDES (1578 as of 2026-10-27, was 1571)
  - eDoc — County = VAN WERT, Program = 401 WETLANDS (4 as of 2026-10-27, unchanged)
  - ECHO dfr_rest_services.get_dfr, OH0027910 — read the WINDOW END, not the extract date; note WHICH quarter rolled off the front
  - aeptransmission.com/ohio/VanWert-Haviland/ by direct URL — a Construction Notice is what would appear; the Project Updates block now carries entries, read it too
  - City of Van Wert council agenda + minutes — Ords. 26-10-058..061 third reading; any CBA / PILOT / CRA instrument
  - Van Wert County Board of Elections — R.C. 149.43 for the 2026-07-27 certification and part petitions (never sent)
  - FERC eLibrary — an AEP Ohio service agreement naming the campus (route not established)
  do_not:
  - Watch the PJM interconnection queue for this campus. It is load; it will never appear there.
  - Read a missing campus NPDES permit as evidence of no discharge. A sewered campus never has one.
  - Read continued 401/404 silence as continued absence. An NWP verification is not public-noticed.
  - Trust an eDoc result count taken before the page size is widened, or a search whose term does not echo back.
  - Compute the OPSB intervention deadline from the public notice's PDF metadata or its Last-Modified header.
  - >-
    Read an eDoc silence about an event less than ~4 weeks old as a negative. Docid 4236096 was
    submitted 2026-07-22 and published 2026-08-19.
  - >-
    Search the aeptransmission.com filings index for this project, or read any "Haviland" row off
    that index as this campus's. Use the project page's direct URL.
  - >-
    Let the press "~2032 full buildout" figure overwrite the NOI's certified 2030-08-03 project end
    date, or report the Q4-2026 groundbreaking as a slip.
  - >-
    Derive a campus MW from square footage — neither the 365,000-sq-ft-per-100-MW benchmark nor
    the 2026-10-25 "four buildings of ~650,000 sq ft" report.
  - >-
