# Van Wert (Van Wert County, OH) — standing pre-construction watch on the QTS Mega Site campus.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, reasoning shown
#   [open]      = not established by any captured source — do NOT assert
#
# WHY THIS FILE EXISTS. Issue #1408 was written on 2026-07-10 as a watch over nine threads whose
# instruments mostly did not exist yet — the point being that a facility this size leaves a
# regulatory wake, and the wake arrives one filing at a time. Four weeks later five of the nine
# have moved, two of them decisively. A watch is only worth as much as its negatives, so every
# thread below records what was checked, by what route, on what date, and what came back —
# including the routes that CANNOT answer the question and the one that is blocked. A blank is
# never left to imply "nothing happened."
meta:
  subject: >-
    Standing watch on the nine pre-construction regulatory threads around the QTS Van Wert Mega
    Site campus — construction stormwater, the air permit-to-install, OPSB transmission, the
    withdrawn data-center general permit, 401/404, the local and statewide ballot threads, the
    receiving POTW's federal compliance record, and PJM large-load
  kind: regulatory-watch
  site: van-wert
  captured_for: issue 1408 (epic 1267, readiness(van-wert))
  extracted_at: '2026-08-05'
  checked_on: '2026-10-27'
  previous_check: '2026-09-16'      # before it 2026-08-05 (the pass that wrote this file) and the #1402 pass of 2026-08-03
  method: >-
    Seven routes, run independently and recorded separately. (1) Ohio EPA's eDocument public
    portal, scripted — by Entity Name, by County × Program, and by Secondary ID. (2) EPA ECHO's
    CWA services (dfr_rest_services) and (3) EPA Envirofacts ICIS_PERMIT. (4) AEP Ohio
    Transmission's own project site, which is what finally opened the OPSB docket that PUCO's
    docketing system will not serve. (5) A direct probe of dis.puc.state.oh.us, recorded as a
    blocked route. (6) PJM's own published rules for the large-load and expedited-interconnection
    tracks. (7) Local and statewide press for the two ballot threads, which are the only public
    record of a board-of-elections certification. Where a route is structurally incapable of
    answering, that is recorded as a structural finding rather than an empirical negative.

# ── The route that changed this pass ─────────────────────────────────────────
route_discovery:
  tag: '[verified]'
  what: >-
    The applicant publishes what the docket will not serve. PUCO/OPSB's Docketing Information
    System has now refused automated retrieval four times in this corpus (#1437, #1464, #1401,
    and again here), and the Van Wert grid record has sat on a bare case number because of it.
    AEP Ohio Transmission's own project site serves the complete Letter of Notification and the
    statutory public notice as PDFs, for both Van Wert cases.
  the_trick: >-
    Those PDFs sit behind an Akamai check that returns 403 to a bare request. A browser
    User-Agent alone is NOT enough; a Referer of the project page is also required. With both,
    200. Anyone concluding "the file is gone" from a 403 here is reading a header requirement as
    an absence.
  generalizes_to: >-
    Every AEP Ohio transmission project has such a page under aeptransmission.com/ohio/, and the
    Ohio filings index at aeptransmission.com/ohio/filings.php lists them. This is a standing
    route for any BOSC site in AEP territory whose OPSB docket is blocked — Lima, Findlay and
    Sidney all have AEP transmission work in their records.
  caveat: >-
    It is the APPLICANT's copy, not the docket's. It is a primary instrument (the filing itself,
    with its own cover date and case caption), but it cannot show what OPSB did with it, who
    intervened, or what Staff said. For case status the docket remains the only source, and the
    docket remains blocked.

