    the_two_filings:
    - docid: '4236096'
      submitted: '2026-07-22'
      published_on_portal: '2026-08-19'
      application_id: '25914608'
      status_reported: Overdue
      scheduled_date: '2026-08-01'
      probable_compliance_date: '2026-09-15'
      cause_of_violation: Contractor busy
      remedial_action: moving in an extra crew after it gets started
      probability_of_complying_with_subsequent_events: 50%
      note: >-
        Filed TEN DAYS BEFORE the deadline it reports as overdue. The permittee pre-reported the
        violation rather than missing it silently, which is a materially different posture from the
        three other CSO schedule events this permittee has left "unachieved and not reported"
