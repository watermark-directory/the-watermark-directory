# ── Instruments this watch names but did not pull ────────────────────────────
instruments_to_pull:
- id: aep-2025-long-term-forecast
  what: AEP Ohio's 2025 Long-Term Forecast Report, pages 49 and 76-77.
  why: >-
    Named and page-cited in the Adjustment LON's own Appendix B as where projects b3359 and s3142
    are documented. It is the utility's own forward statement of load in this zone and is the most
    likely public document to carry a Van Wert load figure. The single highest-value pull this
    watch surfaced.
  route: PUCO filing (blocked docket) or AEP's own investor/regulatory publications.
  priority: 1
- id: opsb-25-0697-lon
  what: The ORIGINAL Van Wert–Haviland Letter of Notification, Case 25-0697-EL-BLN.
  why: >-
    Its affected-properties table would show whether AEP's easement across campus parcel
    17-034718.0000 predates the campus's June 2026 deeds — which the Adjustment LON cannot answer
    because its own asterisk footnote misnames the case.
  route: aeptransmission.com/Ohio/VanWert-Haviland/docs/LON_VanWert-Haviland_20250825_FINAL.pdf (UA + Referer).
  priority: 2
- id: vanwert-boe-certification
  what: The Van Wert County Board of Elections certification of 2026-07-27 and the filed part petitions.
  why: >-
    Everything this watch records about the local ballot thread is `[reference]`, from press
    quoting the BOE director. The certification is the record, and the part petitions carry the
    per-signature invalidation reasons.
  route: R.C. 149.43 request to the Van Wert County Board of Elections.
  priority: 2
- id: vanwert-qts-incentive-instrument
  what: >-
    The executed City of Van Wert / QTS incentive instrument — a Community Reinvestment Area
    agreement if that is the mechanism chosen — together with the CRA board's approval record and
    the 14-day Lincolnview Local Schools review.
  why: >-
    Nine regulatory threads have not grounded this campus's load, and an incentive instrument is
    the remaining class of public document that routinely states investment schedule, term,
    abatement percentage and sometimes connected load. It also has, uniquely on this watch, a
    dated public path to existing: a hearing on 2026-10-26 and an announcement expected
    mid-to-late October 2026.
  route: City of Van Wert council agenda and minutes; CRA board record; R.C. 149.43 to the City if not published.
  caveat: >-
    That a CRA is the mechanism is [reference] and conditional — the 2026-09-14 report says one
    "may be required". Pull whatever is enacted, not whatever was predicted.
  revised_2026_10_27: >-
    Re-targeted. The 2026-10-26 hearing was annexation/rezoning, not incentives; press now reports
    QTS will take "zero incentives" while a community benefits agreement is negotiated (Van Wert
    County Foundation as financial agent, separate city and county boards) and the 2026-09-28
    minutes speak of PILOT payments moved "if the CRA would approve". The instrument to pull is
    therefore the executed community benefits agreement and/or PILOT agreement, plus the
    governance-board charters — and a CRA agreement only if one is in fact enacted.
  priority: 1
- id: vanwert-annexation-ordinances-2026-10
  what: >-
    City of Van Wert Ords. 26-10-058 (expedited Type 1 annexation, 684.165 ac from Ridge Twp
    adjoining the Mega Site), 26-10-059 (I-2 conditional rezoning), 26-10-060 / 26-10-061
    (156.052 ac, Pleasant Twp, Purmort lands), and the annexation plat — first reading 2026-10-26.
  urls:
  - https://vanwert.org/wp-content/uploads/2026/10/26-10-058-up.pdf
  - https://vanwert.org/wp-content/uploads/2026/10/26-10-059-up.pdf
  - https://vanwert.org/wp-content/uploads/2026/10/26-10-060-up.pdf
  - https://vanwert.org/wp-content/uploads/2026/10/26-10-061-up.pdf
  - https://vanwert.org/wp-content/uploads/2026/10/058-059-Annexation-Mapt-to-the-City-of-Van-Wert.pdf
  why: >-
    The first local instruments on land adjoining the campus since the June 2026 deeds; the
    conditional-rezoning conditions and the annexation petition's petitioner name are the facts
    worth having. The PDFs are image-only — OCR required. Pull the as-enacted versions after the
    third reading (expected 2026-11-23, [reference]) as well as these first-reading copies.
  route: vanwert.org (public, no header tricks needed); county commissioners' annexation record.
  priority: 1
- id: aep-qts-800mw-load-study
  what: >-
    The AEP Ohio load study / service request for QTS's reported additional 800 MW at Van Wert.
  why: >-
    The first figure anywhere on this watch that purports to be the campus's requested load. It is
    press-only ([reference], VW Independent 2026-10-26, relaying Stevens) and is a REQUEST, not a
    load — but a study of it would be a utility record. Most likely surfaces in a PUCO/OPSB filing
    (blocked docket), an AEP supplemental-project submission to PJM's TEAC, or AEP's next long-term
    forecast.
  route: PJM TEAC supplemental-project materials (AEP zone); PUCO docket (blocked); R.C. 149.43 does not reach AEP.
  priority: 2
- id: usace-lrb-nwp-verification
  what: Any USACE Buffalo District nationwide-permit verification issued to QTS for the campus.
  why: >-
    The applicant's own answers point to the NWP branch, and that branch is never public-noticed.
    A FOIA is the only route, and without it this thread stays permanently silent rather than
    permanently negative.
  route: FOIA to USACE Buffalo District Regulatory.
  priority: 3
