  pjm_large_load:
    watch_item: 9
    subject: PJM's large-load interconnection process as it would apply to this campus
    outcome: structural_finding
    tag: '[reference]'
    checked_on: '2026-08-05'
    tag_rationale: >-
      `[reference]` throughout, deliberately. Everything below comes from PJM's own newsroom
      (insidelines.pjm.com) describing PJM's own filings — a self-published source, not a
      controlling record, and not captured as bytes in this corpus. The controlling records are
      the FERC-accepted tariff sheets and the CIFP filing. The finding here is structural and
      robust to that (the EIT is a generation track under any reading), but no number below should
      be cited as instrument-grade until the tariff is pulled.
    the_correction:
      tag: '[reference]'
      statement: >-
        The issue watched the wrong instrument, and the watch is more useful for saying so than
        it would have been for reporting a negative. PJM's Expedited Interconnection Track began
        accepting requests on 2026-07-31 — but the EIT is a GENERATION track. It takes "large new
        or uprated capacity resources" offering at least 250 MW of unforced capacity, caps intake
        at 10 requests per calendar year for 2026 and 2027, requires a state siting authority's
        commitment to expedite, and sunsets at the end of 2027. A data center is LOAD. It cannot
        enter the EIT at all, and waiting for this campus to appear in it would be waiting forever.
    what_actually_governs:
      tag: '[reference]'
      framework: BYONG (Bring Your Own Generation)
      rule: >-
        Any facility adding 50 MW or more of load at a single point of interconnection must either
        supply its own incremental generation or accept curtailment risk; during grid shortages,
        facilities that have not brought their own generation are curtailed first.
      why_it_bites_here:
        tag: '[inference]'
        statement: >-
          The campus's announced bracket is 500 MW `[reference]` — ten times the BYONG threshold.
          If that bracket is anywhere near right, this campus is squarely inside the regime, and
          the question it raises is one nothing in this corpus answers: does QTS intend on-site
          generation, or is it accepting curtailment risk? The corpus's only related fact points
          the other way from a generation build — QTS says its generators are emergency backup
          only, tested monthly, and no air PTI has been applied for. Emergency-only generators are
          not "bringing your own generation" in the BYONG sense. Labelled `[inference]` because
          the 500 MW is not disclosed and the campus's PJM posture is nowhere on the record.
    the_structural_finding:
      tag: '[inference]'
      grounded_on: >-
        the `[reference]` PJM rules above PLUS one `[verified]` fact from the OPSB filing — the
        Van Wert–Haviland rebuild carries PJM numbers b3359 and s3142 that AEP itself says it
        presented to PJM, i.e. the need reached PJM through the transmission owner, not through a
        customer's queue request. That is the mechanism, observed once, in this site's own record.
      statement: >-
        There is no public PJM queue entry to watch for this campus, and there never will be.
        Generation interconnection requests are published in PJM's queue; large LOAD is not a
        queue item — it reaches PJM through the transmission owner's planning process, which is
        where AEP's own filing shows it going. The b3359/s3142 numbers on the Van Wert–Haviland
        rebuild are exactly that path: a need presented to PJM by the utility, not by the customer.
        So the watchable artifact for this campus's load is an AEP filing, not a PJM queue row.
      consequence_for_this_watch: >-
        Retire "watch the PJM queue" as a thread. Replace it with: watch AEP Ohio's Long-Term
        Forecast Report and its OPSB filings for a Van Wert delivery point, and watch FERC
        eLibrary for an AEP Ohio service agreement naming the campus. The 2025 Long-Term Forecast
        Report is already named and page-cited in the Adjustment LON's Appendix B and is not in
        this corpus — the cleanest single pull this thread has.

# ── Route hazards found while running this watch ─────────────────────────────
# Recorded so the next check does not repeat them and mistake a broken query for an absent
# instrument.
route_hazards:
- route: Ohio EPA eDocument portal, scripted
  hazard: >-
    THE SILENT-UNFILTERED-SEARCH TRAP, and it is the worst kind because it fails toward a
    plausible answer. The portal is ASP.NET WebForms. Posting the hidden fields plus the one row
    you care about returns the UNFILTERED landing grid with "Search returned more than the maximum
    allowed results" — which reads like a search that matched everything rather than a search that
    never ran. The criteria bind only if the form is serialized FAITHFULLY: every input, and every
    <select>'s selected option, including the per-row `ddlConn` connectors whose default is "Or",
    not "And". Verify by checking that your search term echoes back in the response's own
    `txtValue` attribute before believing any count.
- route: Ohio EPA eDocument portal, result counts
  hazard: >-
    The grid defaults to 10 rows per page and the pager is a `__doPostBack` control, so a query
    that really has 35 hits reports 10. Set `ctl00$results$DocHitList$DocHitList_CurrentPageSize`
    to 600 and re-post with `__EVENTTARGET` set to that control. A count taken before widening the
    page is a page size, not a result count.
- route: Ohio EPA eDocument portal, field semantics
  hazard: >-
    The permit identifier `2GC08872` lives in the SECONDARY ID field, not in "Package/Permit
    Number". Searching it as a package number returns zero — a false negative for the exact
    permit family that is in the corpus. Row-id map: 111 = Secondary ID, 106 = Entity Name,
    104 = County, 109 = Program, 121 = Package/Permit Number.
- route: EPA Envirofacts ICIS_PERMIT, PERMIT_NAME/CONTAINING/QTS
  hazard: >-
    THE FEDERAL SYSTEM LAGS THE STATE PORTAL, and on this campus the lag is the whole answer. The
    query returns 31 rows — 16 Virginia, 6 Georgia, 3 New Jersey, 3 Oregon and exactly 3 Ohio:
    OHGC04502 (effective 2023-05-12), OHGC06156 (2023-07-10) and OHGC10901 (2024-09-16), all under
    master permit OHC000000, all named simply "QTS". Those three are the LICKING and FRANKLIN
    County coverages — their effective dates match the eDoc rows for QTS NAL 1, QTS NAL 2 and
    QTS - NAL3 Stockpile exactly. The Van Wert coverage 2GC08872, approved 2026-07-30, is NOT among
    them and the string "08872" appears in no row, against an ICIS-NPDES extract of 2026-07-31.
    So the campus's only state permit had not propagated into the federal system one day after
    issuance, and a federal-only check would have concluded QTS holds three Ohio coverages, none in
    Van Wert. Use the state portal for Ohio coverages, and treat ICIS as corroboration with a
    multi-week lag rather than as an index.
- route: EPA ECHO DFR, reading freshness from the extract date
  hazard: >-
    `SystemExtractDate` advanced from 2026-07-24 to 2026-07-31 between the #1406 pass and this
    one while `EnforcementComplianceSummaries` still ended 2026-03-31. The extract date tells you
    when ICIS was copied; the window end tells you which quarters are scored. Only the second
    answers "have the new DMRs posted".
- route: aeptransmission.com project PDFs
  hazard: >-
    403 to a bare request, and 403 to a browser User-Agent alone. Both a browser UA AND a Referer
    of the project page are required. Filenames contain literal spaces and must be percent-encoded.
    Read a 403 here as a missing header, not a missing document.
- route: PUCO / OPSB Docketing Information System
  hazard: >-
    Returns HTTP 200 with a 244-byte "Request Rejected" body. A naive client sees a 200 and may
    treat the empty page as an empty docket. Check the body length.

