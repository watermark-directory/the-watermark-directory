    the_window_rolled_and_that_matters:
      tag: '[verified]'
      statement: >-
        "12 of 12, unchanged" is true and is not the same twelve quarters. The three-year window
        start moved 2023-04-01 → 2023-07-01, so one quarter dropped off the front as Q2 2026 was
