      statement: >-
        Recorded as observed, not resolved. ECHO reports QtrsInNC = 12 for a twelve-quarter window
        while its own CWA3YrCompliance grid marks one of those twelve — 2023-10-01 → 2023-12-31 —
        "No Violation Identified"; the other eleven read "Violation Identified". The two figures
