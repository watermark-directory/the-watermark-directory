    - docid: '4236116'
      submitted: '2026-08-17'
      published_on_portal: '2026-08-19'
      application_id: '25919628'
      status_reported: Overdue
      scheduled_date: '2026-08-01'
      probable_compliance_date: '2026-08-31'
      cause_of_violation: Contractor has not started yet
      remedial_action: N/A
      probability_of_complying_with_subsequent_events: '"Good, Contractor moving in two crews to get caught up" (prose, not a percentage)'
      note: >-
        Filed sixteen days after the deadline, and its cause of violation is stronger than the
        first filing's: not "contractor busy" but "contractor has not started yet".
    the_two_filings_disagree:
      tag: '[verified]'
      statement: >-
        The LATER filing gives an EARLIER probable-compliance date than the earlier one — 2026-08-31
        (filed 08-17) against 2026-09-15 (filed 07-22). Both are the permittee's own certified
        estimates for the same milestone and neither document reconciles them. Recorded as a
        disagreement rather than resolved by preferring the more recent, because nothing in either
        instrument licenses that preference.
    what_has_happened_since:
      tag: '[verified negative]'
      checked_on: '2026-09-16'
      statement: >-
        BOTH of the permittee's own probable-compliance dates have now passed — 2026-08-31 sixteen
        days ago and 2026-09-15 yesterday — and NO further filing exists. The Secondary ID
        2PD00006 query returns 169 documents and the two 2026-08-19 updates are still the newest.
        There is no third compliance schedule update, no notification of commencement, and nothing
        reporting event 3099 complete.
      how_far_this_goes: >-
        It establishes that no REPORT of commencement exists, which is what the permit obliges.
        It does not establish that construction has not started — a commencement in early September
        might not surface on this route until October, for the reason immediately below. The
        honest state is: the milestone is 46 days overdue by the permittee's own filings, both of
        its own recovery dates have lapsed unreported, and whether work has since begun is `[open]`
        with a dated next check.
    route_hazard_discovered:
      tag: '[verified]'
      name: eDocument portal publication lag
      statement: >-
        Docid 4236096 was SUBMITTED 2026-07-22 and did not appear on the portal until 2026-08-19 —
        a 28-day lag. The 2026-08-05 pass queried this exact permit by Secondary ID and could not
        have seen it: the filing existed, said what this pass needed, and was invisible. That pass
        wrote "too early to tell", which was the right call for the wrong reason.
      why_it_matters_generally: >-
        The lag is not constant and cannot be assumed short — docid 4208904 lagged ONE day and
        4236116 lagged TWO, while 4236096 lagged twenty-eight. So the portal is fast enough to
        tempt a same-week check and slow enough to make one meaningless. An eDoc negative about a
        dated event is only load-bearing roughly four weeks after that event. Every dated trigger
        in the new `next_check` below is set accordingly, and this is now a general finding for
        every BOSC site that reads this portal, not a Van Wert one.
