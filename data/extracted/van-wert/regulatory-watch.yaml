  # ── New since the last pass, from secondary sources ───────────────────────
  secondary_since_last_pass:
    tag: '[reference]'
    method: >-
      Press only, and labelled as such throughout. Nothing below is an instrument and nothing below
      may be cited as one.
    the_claim_this_pass_was_asked_to_test:
      claim: >-
        Press reports physical building construction slipping to Q3/Q4 2026, with full operation
        2032.
      verdict: REFUTED AS A CHANGE — it is the original announcement restated, not a slip
      tag: '[reference]'
      statement: >-
        There is no slip. The Q4-2026 groundbreaking and the ~2032 full-buildout figures were
        published together on 2026-05-29, attributed to Katie Erwin, QTS Senior Director of
        Communications, alongside first-building-operational Q1 2029, up to seven buildings, 902
        acres and the 500 MW bracket. That is three months BEFORE the last check, and the same
        timeline is restated unchanged on 2026-09-14 ("Data center groundbreaking is expected to
        take place this fall"). Nothing moved; a search run today simply resurfaces the May
        announcement. A watch that recorded this as a development would have manufactured one.
    where_it_collides_with_the_record:
      tag: '[verified]'
      statement: >-
        The press completion figure and the certified state filing DISAGREE, and the filing wins.
        The campus's own Notice of Intent, certified under penalty of law 2026-07-21, gives a
        project window of 2026-08-03 → 2030-08-03. Press says full buildout and operations "around
        2032". These are not the same claim — the NOI's end date bounds the permitted construction
        activity and the press figure describes full operational buildout — but they are close
        enough to be conflated, and the 2030-08-03 date is the [verified] one. Do not let ~2032
        overwrite it anywhere in this corpus.
    genuinely_new:
    - id: VW-CRA-INCENTIVE-NEGOTIATION
      tag: '[reference]'
      date: '2026-09-14'
      source: The VW independent, "Stevens shares updates on incentive negotiations, more" (Scott Truxell)
      what: >-
        Incentive negotiations between the City and QTS are still open. Brent Stevens, Executive
        Director of the Economic Development Corporation, told council that "with a $10 billion
        project there is a tremendous amount of back and fourth with our lawyers and their
        lawyers" and that an announcement on incentives is expected mid-to-late October. A
        Community Reinvestment Area agreement may be required, which would need CRA board
        approval and a 14-day review period with Lincolnview schools before city council can
        consider it.
      why_it_is_a_new_watch_thread: >-
        Because it names an instrument with a procedure and a clock. A CRA agreement is a written,
        enacted, public instrument; the 14-day school-district review is a statutory step that
        leaves a record; and a public hearing is already calendared for 2026-10-26 at 6 p.m. This
        is the first incentive instrument on this campus with a dated path to existing, and it is
        the kind of document that states term, abatement percentage and — sometimes — a load or
        investment schedule. Added to `instruments_to_pull` and to the dated triggers.
      do_not: >-
        Do not assume the incentive is a CRA. The report says one "may be required", which is a
        conditional in a secondary source. Van Wert has also been discussed in connection with
        other mechanisms and nothing has been enacted. The thread is "an incentive instrument is
        being negotiated with a dated council path", not "a CRA exists".
    - id: VW-SQFT-PER-MW-BENCHMARK
      tag: '[reference]'
      date: '2026-09-14'
      what: >-
        Stevens offered a benchmark in the same meeting: "for every 100 megawatts of a new data
        center capacity, there is associated roughly 365,000 square feet of space that is built."
      why_it_is_recorded_and_why_it_is_not_used: >-
        It is recorded because it is the first time anyone on the public record in Van Wert has
        tied floor area to load for this campus, and a future filing stating one may let the other
        be checked. It is NOT used to derive a load figure. Multiplying a press square-footage by a
        press rule-of-thumb and reporting the product as this campus's MW would be inference
        dressed as measurement, from two [reference] inputs, when the campus's load is precisely
        the thing this watch has been unable to ground. The campus MW stays a [reference] 500 MW
        bracket.
  threads_not_re_run_this_pass:
    statement: >-
      Four threads keep their 2026-08-05 `checked_on` because they were not re-run. Recorded so a
