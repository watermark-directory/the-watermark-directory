    with the day after the annexation third reading and ~4 weeks after the Suffolk groundbreaking
    report.
  dated_triggers:
  - date: '2026-11-01'
    what: >-
      The revised 2020 PCCM Plan (CSO schedule event 1299, due 2026-10-01) leaves the 4-week lag
      window. Re-query eDoc Secondary ID 2PD00006; from this date a silence is a negative.
    route: eDoc Secondary ID 2PD00006 (169 rows as of 2026-10-27), keyword COMPLIANCE SCHEDULE UPDATE
  - date: '2026-11-15'
    what: >-
      CSO event 3099 (Begin Construction, missed 2026-08-01). The last recorded recovery date was
      2026-09-15; by 2026-10-27 the report silence was already 42 days past it and 87 days past the
      milestone, so the eDoc side is already a [verified negative] — this trigger asks whether ANY
      commencement notice or revised schedule has appeared, and whether Ohio EPA has issued an NOV.
    route: eDoc Secondary ID 2PD00006
  - date: '2026-11-23'
    what: >-
      Expected third reading of annexation/rezoning Ords. 26-10-058 / 26-10-059 (684.165 ac from
      Ridge Twp, I-2 conditional rezoning) and 26-10-060 / 26-10-061 (156.052 ac, Pleasant Twp).
      Record the vote, and whether any community benefits / PILOT instrument rides with them.
    route: vanwert.org/agenda/ and posted minutes; the annexation then goes to the Van Wert County commissioners' record
    why: >-
      The first enacted local instruments touching the campus footprint since the 2026-06 deeds.
      Third-reading date is [reference] (press), so check the agenda, not the date.
  - date: '2026-11-24'
    what: >-
      ~4 weeks after the 2026-10-25 press report naming Suffolk Construction and a Phase I
      groundbreaking — the point at which a co-permittee NOI under 2GC08872, if one was filed when
