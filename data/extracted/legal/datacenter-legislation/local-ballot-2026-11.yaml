# Ohio local data-center ballot measures — 2026-11-03 general election.
#
# Provenance vocabulary (see docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, reasoning shown
#   [open]      = not established by any captured source — do NOT assert
#
# ⚠️ THIS FILE HOLDS NO [verified] CLAIM, AND THAT IS THE POINT.
# Every measure below is grounded in press, a court's own news service, or a municipality's
# self-published notice. NOT ONE certification, part petition, or protest has been captured into
# data/documents/. Until one is, the strongest standing available here is [reference]. The
# `records_route` block on each measure names the county board of elections that holds the
# controlling instrument; `pulls` at the bottom is the R.C. 149.43 queue.
#
# ⚠️ A BALLOT MEASURE IS NOT AN OUTCOME. Until 2026-11-03 every measure here is a PENDING
# INSTRUMENT. Nothing in this file licenses a claim about what any community decided, and no
# `readiness` domain may rise on it — a pending question is not a record.
meta:
  subject: >-
    The local data-center measures certified to Ohio ballots for the 2026-11-03 general
    election, and the two that were kept off it — reduced to county, instrument type, threshold,
    certifying body and standing, against the county boards of elections that hold the
    controlling record
  kind: ballot-measure-register
  scope: state:OH
  extracted_at: '2026-09-16'
  checked_on: '2026-09-16'
  filing_deadline: '2026-09-04'   # 60th day before the election; charter-amendment ordinances
  election_day: '2026-11-03'
  method: >-
    Press reporting (Ohio Capital Journal 2026-09-14 and the local outlet closest to each
    measure), the Supreme Court of Ohio's own case summaries for the four measures that reached
    it, and one municipality's self-published notice (Hubbard). No board-of-elections record was
    obtained. The route that would obtain one is already established in this corpus —
    data/extracted/van-wert/regulatory-watch.yaml names "Van Wert County Board of Elections —
    R.C. 149.43 for the 2026-07-27 certification and part petitions" — and is reused here per
    county rather than reinvented.

# ── The count does not reconcile, and the gap is recorded rather than filled ──────────────
count_reconciliation:
  tag: '[open]'
  reported_total: 18
  communities_this_file_can_name: 17
  gap: 1
  what: >-
    The Ohio Capital Journal's 2026-09-14 piece is headlined "18 Ohio communities" and enumerates
    17 distinguishable communities in its body: the nine 25-MW charter petitions, Urbana, Hubbard,
    Grove City, Wilmington, Ashville, Sidney, and two unnamed Adams County townships. A full read
    of the article and of six syndicated mirrors of it did not produce an eighteenth.
  three_candidate_explanations_none_adopted:
    - >-
      The count may treat one community's multiple questions as multiple entries — Piqua filed
      four petitions (two charter amendments plus three recalls, on Save Piqua's own account) and
      Wilmington carries four referendums.
    - >-
      The count may include Sidney, whose three petitions the same article says will "likely
      become a special election" — i.e. possibly NOT the 2026-11-03 ballot at all.
    - >-
      There may be an eighteenth community the article names in a passage not reproduced by any
      mirror reachable from here.
  how_to_close_it: >-
    Not by re-reading the press. The Ohio Secretary of State's certified list of local questions
    and issues for the 2026-11-03 election is the authority; each county board of elections
    certifies its own. This is pull priority 1.

# ── The trap this file exists to prevent ─────────────────────────────────────────────────
do_not_conflate:
  statewide_vs_local:
    tag: '[reference]'
    what: >-
      The STATEWIDE initiated constitutional amendment (Conserve Ohio, "Prohibition of
      Construction of a Data Center", >25 MW) FAILED TO QUALIFY for 2026: ~70,000 of the 413,488
      valid signatures required by 2026-07-01, as of 2026-06-18. The signatures were not
      submitted and therefore remain valid; the campaign targets 2027. Recorded already in
      data/extracted/west-union/data-centers.md and data/extracted/troy-piqua/data-centers.md
      (lead BALLOT-2027).
    the_error: >-
      The nine 25-MW local charter amendments MIRROR that statewide amendment and were organized
      by the same campaign. They are SEPARATE INSTRUMENTS and they DID qualify. The statewide
      failure says nothing about them. Writing "the data-center ban failed" collapses the two.
  sidney_recall_is_not_a_data_center_ban:
    tag: '[reference]'
    what: >-
      The Supreme Court of Ohio decision that press coverage attaches to Sidney's "trio of
      data-center petitions" — State ex rel. Turner v. Barhorst, No. 2026-1088, 2026-Ohio-3439,
      decided 2026-09-03 — concerns a charter amendment ESTABLISHING A UNIFORM PROCEDURE FOR
      RECALLING ELECTED CITY OFFICIALS. Its subject is recall procedure. It is not a
      megawatt threshold, not a zoning measure, and not a data-center ban.
    the_error: >-
      The recall amendment is MOTIVATED by the data-center dispute; its TEXT is about recall.
      Describing Sidney as voting on a data-center ban is wrong about the instrument. See
      data/extracted/sidney/data-centers.md.
  urbana_threshold:
    tag: '[reference]'
    what: Urbana's threshold is 7.5 MW. The other charter petitions are 25 MW; Grove City is 20 MW.
    the_error: >-
      Normalizing Urbana into "the 25-MW measures" understates its reach by a factor of ~3.3.
  grove_city_is_not_data_center_specific:
    tag: '[reference]'
    what: >-
      Grove City's "Community Consent Amendment" reaches any industrial development meeting any
      of three thresholds — >=50 acres, >500,000 gallons per day of water, or >=20 MW of
      electrical demand — and requires a vote of the electorate. It is not a data-center ban and
      does not name data centers.
    why_it_matters: >-
      Reported reasoning is that a data-center-specific ban was avoided on litigation-risk advice.
      A measure drafted to survive a challenge is a different instrument from one drafted to stop
      a project, and the two will not generalize to each other.
  adjacency_is_not_identity:
    tag: '[inference]'
    what: >-
      Hubbard is in Trumbull County and so is `lordstown`, a BOSC `tracking` site with its own
      moratorium history. Conneaut is in Ashtabula County; `cleveland` and `akron` are tracking
      sites in neither. Grove City is in Franklin County, which is `columbus`'s county.
    the_error: >-
      A measure in a registered site's COUNTY is not a measure at that site. Each is recorded
      under its own community below, and the site column says "county-adjacent" where that is
      all it is.

