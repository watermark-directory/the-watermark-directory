# ── The R.C. 149.43 queue ────────────────────────────────────────────────────────────────
pulls:
  - priority: 1
    body: Ohio Secretary of State
    what: >-
      The certified list of local questions and issues for the 2026-11-03 general election.
      ONE request that settles the count gap, every "unconfirmed" standing above, the exact
      certified ballot language, and whether Sidney appears at all.
    why_first: >-
      It is the only single route that answers the whole file. Fourteen separate county requests
      answer the same question at fourteen times the cost.
  - priority: 2
    bodies:
      - Clinton County Board of Elections — Wilmington's four referendums and the refused Chapter 1161 initiative
      - Miami County Board of Elections — Piqua's one-or-two questions, and the SoS timeliness correspondence
      - Champaign County Board of Elections — Urbana's 7.5-MW certification
      - Adams County Board of Elections — WHICH two townships
      - Shelby County Board of Elections — Sidney's three petitions and their election date
    why: >-
      The five that touch a registered site's own published governance picture. Wilmington,
      Piqua and Urbana are the three where a live or queued BOSC site is publishing a governance
      section that omits a pending measure against its own facility.
  - priority: 3
    what: >-
      The four slip opinions, from the Supreme Court of Ohio's own reporter rather than from
      Court News Ohio summaries — 2026-Ohio-3035 (Ashville), 2026-Ohio-3439 (Sidney),
      the Trenton decision of 2026-09-01 (No. 2026-1035, slip citation not obtained), and any
      decision in the pending signature-requirement case Piqua's law director referenced.
    why: >-
      Court News Ohio is the Court's news service, not its reporter. A holding is cited to the
      opinion. Every litigation block above is '[reference]' for exactly this reason and
      upgrades to '[verified]' only on the captured opinion.

# ── What this file must not be read as ───────────────────────────────────────────────────
standing_limits:
  no_outcomes: >-
    Every measure is PENDING. This file records questions certified, refused, or unconfirmed —
    never what a community decided. Re-read it after 2026-11-03 and the standings change; the
    claims do not become retroactively stronger.
  no_readiness_effect: >-
    Nothing here may move a site's `readiness`. Readiness is domain activation off committed
    evidence (watermark.site.readiness); a pending ballot question is not a record domain and
    does not seed one. If a certification is later captured into data/documents/ and extracted,
    THAT can lift a record domain — the ballot measure itself cannot.
  no_verified_claims: >-
    This file contains none, by construction. Press, a court's news service, and a city's own
    web notice are all '[reference]'. The first captured certification converts its own measure
    and nothing else.

