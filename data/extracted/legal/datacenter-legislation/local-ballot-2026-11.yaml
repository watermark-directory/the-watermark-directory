          because the committee had not filed a copy of the proposed amendment with her office
          before circulating, citing R.C. 731.32. The Court held R.C. 731.32 applies only to
          initiatives to ADOPT CITY ORDINANCES and to REFERENDUMS challenging ordinances — not to
          charter amendments. The city must submit the petition to the Shelby County Board of
          Elections for verification; if sufficient, Sidney must place it on an election ballot
          under Ohio Const. art. XVIII, §8.
