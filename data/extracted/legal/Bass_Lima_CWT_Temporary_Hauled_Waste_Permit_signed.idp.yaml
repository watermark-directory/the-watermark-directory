  note: This is a temporary permit authorizing Bass Environmental to discharge hauled,
    treated wastewater (originating from Bass's Bellefontaine facility, finished/treated
    at the Zanesville location) via tanker truck into the City of Lima's POTW, with
    a maximum of 15,000 gallons total combined discharge. The permit was signed by
    the Director of Utilities (signature present on page 1), but the signatory name
    is illegible from the scan. Metals, pH, COD, and flashpoint are also to be analyzed
    as real-time parameters daily before hauling to the POTW per the table footnote.
