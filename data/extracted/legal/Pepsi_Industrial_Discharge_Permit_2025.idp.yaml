  warnings:
  - Signatory name read from handwritten signature as 'Michael Capull' — the printed
    title is 'Director of Utilities'; exact spelling of surname uncertain due to handwriting.
    Best reading applied.
  - user_classification not explicitly printed on face page; no categorical standard
    (40 CFR part/subpart) is cited anywhere in the document, so categorical_standards
    left empty.
  - 'The pH row in Table 1 has two sub-rows: one for monthly City grab sampling and
    one for continuous IU grab monitoring; both share the same instantaneous range
    of 6.0 to 11.0 pH units. Both are captured in the note field.'
