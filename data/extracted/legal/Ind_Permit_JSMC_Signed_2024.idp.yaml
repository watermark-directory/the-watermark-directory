industrial_permit:
  confidence: high
  warnings:
  - No appendix letter is printed for the limit tables in this permit; both the local
    limits table and the surcharge table appear in Part I, Section B (Effluent Limits),
    not in a separately labeled appendix.
  - The permit invokes 40 CFR 433 (metal finishing) in Part V Section C but notes
    that categorical limits will NOT be applied because there is zero-process discharge
    from the chromating bay to the sanitary sewer; local limits only are enforced.
    No separate categorical limits table is present in the document.
  - The signatory name is read from the handwritten signature over the printed title
    'Director of Utilities'; the name appears to be Michael Cagnille but handwriting
    legibility is limited.
  - No user_classification is explicitly printed on the face page of this permit.
  - The contract laboratory (Alloway) is named in Part V Section D in the context
    of split samples; it is not formally designated as the contract laboratory on
    the face page.
