source_text_excerpt: "\n\n \n \n \n \n \n \nCombined   \n \nSewer Overflow \n \nAnnual\
  \ Report  \n \n2025 \n \nCITY OF LIMA, OHIO \n \n \n \n \n \nApril 2, 2026 \n\n\
  \ \nIntroduction \n \nIn response to the new CSO Public Notification rule, the City\
  \ of Lima is required to post an Annual Report on or \nprior to May 1st of each\
  \ year that summarizes the City’s CSO activity from the previous year.  In addition\
  \ to the \noverflow information, this report also summarizes the City’s actions\
  \ taken to meet the Nine Minimum Control \nmeasures as defined by the national CSO\
  \ Control policy. \n \nThe following pages illustrate the overflows that occurred\
  \ in 2025 "
progress_report:
  confidence: high
  warnings:
  - 'Structures #008 (Timberlake & Ottawa River), #009 (Oxford & Collett), and #037
    (Northshore Drive at Diamond #3 Backstop) had zero bypass occurrences and zero
    total flow for 2025 — no discharge events recorded.'
  - 'For CSOs #007 through #038, flows are derived/calculated as 2% of combined overflow
    for CSOs #002 through #006, not metered at the structure itself — marked estimated=true
    for all such events.'
  - Multiple satellite CSO events (011 on 2/26, 013 on 2/26, 014 on 2/26, 015 on 5/22,
    016 on 5/22, 033 on 9/23, 034 on 10/30, 035 on 10/30) show an occurrence recorded
    with N/A flow because no CSOs 2-6 overflowed on those dates; these are discharges
    the report declines to quantify (volume left null, not zero).
  - 'S. Central & Ottawa River #007 table lists Duration Hours column but no duration
    values are populated for any event — all duration fields left null for this structure.'
  - 'CSO #002 on 4/3/2025 and 5/7/2025 and 12/29/2025 have blank Bypass Occurrence
    Number cells (no ''1'') yet flow and duration values are reported — occurrences
    counted in the total of 11 but occurrence indicator cell is blank.'
  - 'CSO #003 on 4/3/2025 and 4/6/2025 have blank Bypass Occurrence Number cells yet
    flow and duration are reported — included in total of 4 bypasses.'
  - 'CSO #005 on 4/3/2025 has blank Bypass Occurrence Number cell yet flow and duration
    are reported — included in total of 5 bypasses.'
  - 'Report covers 19 CSO discharge points but data pages shown include structures:
    002, 003, 004, 005, 006, 007, 008, 009, 011, 012, 013, 014, 015, 016, 033, 034,
    035, 037, 038 — structure numbering is non-sequential (e.g., 010, 017-032, 036
    not present), consistent with Lima''s permitted outfall numbering.'
