  summary: 'The City of Lima''s 2025 CSO Annual Report, filed April 2, 2026 under
    the CSO Public Notification rule and NPDES Permit 2PE00000*PD, summarizes combined
    sewer overflow activity from Lima''s 19 CSO discharge points during calendar year
    2025. The report details overflow events by structure (CSOs #002 through #038),
    notes no dry weather overflows, and provides an update on Nine Minimum Controls
    implementation and the Long Term Control Plan, including the operational 13-million-gallon
    CSO storage tank and ongoing SSO design work in the Allentown Basin.'
  note: 'This report is filed under the CSO Public Notification rule, not under a
    consent decree; case_no and paragraph are therefore null. The cover letter is
    dated April 2, 2026, addressed to David Brumbaugh at Ohio EPA. Permit referenced
    is NPDES 2PE00000*PD, effective August 1, 2023. CSOs #008 (Timberlake & Ottawa
