  projects:
  - name: CMOM Plan Implementation
    status: Plan approved by USEPA/OEPA 3/1/2019; implemented; regular progress reports
      being submitted.
    next_period: null
  - name: CSO Operational Plan
    status: Revised plan approved by USEPA/OEPA 3/1/19; implemented; regular progress
      reports being submitted.
    next_period: null
  - name: Phase 1 Large Diameter Sewer Rehabilitation (54" sewer)
    status: Re-designed; construction completed July 2024. Replaced 1,782 feet of
      54" diameter sewer and lined additional 980 feet with geopolymer.
    next_period: null
  - name: Phase 2 Sewer Relining (78" segmented block sewer)
    status: Completed June 2021. Rehabilitated 2,570 feet of 78" segmented block sewer.
    next_period: null
  - name: 13-Million Gallon CSO Storage Tank
    status: Construction completed 2020 at cost of $36.5 million. Currently in commission
      and reducing CSO discharges to Ottawa River.
    next_period: null
  - name: Control Structure Stainless Steel Gates and Stem Guides
    status: New stainless steel gates and stem guides installed on three underground
      control structures.
    next_period: null
  - name: WWTP Headworks Expansion
    status: Completed 2018; increased wet-weather capacity from 53 MGD to 70 MGD.
      Data collection and evaluation completed; performance monitoring report submitted.
    next_period: null
  - name: SSO System Improvements (Allentown Basin)
    status: Design consultant under contract to perform sewer modeling and begin design
      of SSO improvements in Allentown Basin.
    next_period: SSO improvements to begin after completion/testing of storage basin,
      retirement of existing debt, and possible re-evaluation of affordability index.
  - name: Fine Screen Replacement at CSO Structures
    status: Fine screens at two CSO structures replaced in 2025.
    next_period: null
  - name: Pretreatment Program / Local Limits Re-evaluation
    status: Approved Pretreatment Program in place. Local Limits currently being re-evaluated
      as required by NPDES permit 2PE00000*PD (effective August 1, 2023).
    next_period: null
