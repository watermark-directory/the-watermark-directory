    set_on: '2026-09-16'
    supersedes: the four next_checks written 2026-08-02, two of which had blown by the time this pass ran
  trigger_outcomes_2026_09_16:
  - trigger_date: '2026-08-20'
    checked_on: '2026-09-16'
    days_late: 27
    what_it_asked: >-
      The 2026 Individual Seasonal Load lands on the July eDMR. Re-pull the effluent chart for
      OH0025135 and OHP000001 and look for parameter 51451; if it appears, it supersedes every
      derived figure above.
    answer: PARAMETER 51451 DID NOT APPEAR. NOTHING IS SUPERSEDED — BUT THE SEASON CLOSED ANYWAY.
    tag: '[verified negative]'
    detail: >-
      Re-pulled 2026-09-16 against ICIS extract 2026-09-11, 27 days after the reporting deadline.
      OH0025135's 2026 chart carries 30 distinct parameter codes and 51451 is not one of them; the
      OHP000001 pull returns zero features. The structural finding is confirmed ACROSS a deadline,
      which is stronger than the 2026-08-02 observation between deadlines: this is not lag.
    what_the_pull_did_yield: >-
      July 2026 — the month the 2026-08-02 pass was missing. TP monthly average 0.35 mg/L on a
      9.0839 MGD monthly average flow, DMR received 2026-08-17. That completes the 2026 spring
      season and resolves it at 2,577 kg, 0.805x the limit. See `season_findings['2026']`. So the
