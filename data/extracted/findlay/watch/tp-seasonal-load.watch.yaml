season_findings:
  '2023':
    resolved: true
    finding: >-
      [inference] Over the allocation, and robustly so — 4,450 kg against a 3,200 kg limit, 39
      percent above. The approximation cannot rescue it: the median would have to fall to 0.5250
      mg/L, and four of the season's five monthly means (0.708, 0.73, 0.87, 0.81) sit above that.
      This is the last spring before the general permit took effect on 2023-11-01, and it is
      consistent with the TMDL's own 2017-2021 record of 4.8-5.5 metric tons.
  '2024':
    resolved: true
    finding: >-
      [inference] Under the allocation — 2,756 kg, 86 percent of the limit. For the true sample
      median to reach the 0.4644 mg/L break-even, more than half the season's samples would have
      to exceed a value that only ONE of the five monthly means (July, 0.53) reaches. The
      independent kg/day cross-check agrees at 2,870 kg. This is the first spring the general
      permit governed.
  '2025':
    resolved: false
    finding: >-
      [open] NOT RESOLVED BY THIS RECONSTRUCTION. The derived load is 3,101 kg — 97 percent of
      the limit — and the break-even median is 0.4334 mg/L, which falls BETWEEN the season's
      0.42 cluster and its 0.48 March mean. A within-month distribution modestly different from
      the monthly means could put the true sample median above the break-even. The margin is
      smaller than the method's own error, so this season may be either side of the limit. Do
      not publish 2025 as compliant or as an exceedance without the reported number.
  '2026':
    resolved: true
    resolved_on: '2026-09-16'
    finding: >-
      [inference] UNDER the allocation, and more robustly than any season since 2023 was over it —
      2,577 kg, 80.5 percent of the 3,200 kg limit. The break-even median is 0.4719 mg/L and NOT
      ONE of the season's five monthly means reaches it; the highest, June at 0.45, is still below.
      For the true sample median to reach break-even, more than half the season's samples would
      have to exceed a value no month averaged. The independent kg/day cross-check gives 2,478 kg
      (0.774x), a 99 kg spread that sits inside the 100-260 kg precision this method's own
      cross-check established. Both methods, and the approximation's whole plausible range, put
      2026 under.
    what_july_actually_did: >-
      July 2026 came in at 0.35 mg/L on 9.0839 MGD, reported 2026-08-17. That is the LOWEST July
      concentration in the record — 0.81 (2023), 0.53 (2024), 0.42 (2025), 0.35 (2026) — and it is
      the season's lowest month rather than, as in 2024, its highest. The 2026-08-02 pass was right
      to refuse to extrapolate: July carried no pattern, and it landed below every prior July.
    the_caveat_that_does_not_go_away: >-
      This is still [inference], not [verified]. It is a reconstruction of parameter 51451, not
      51451 itself, and the margin being comfortable does not change what kind of number it is.
      What the margin changes is whether the approximation could flip the answer — for 2026 it
      could not, which is exactly the test `break_even_c_m` exists to run.

# --- what changed, and why it is the finding ---------------------------------------------------

seasonal_operating_shift:
  observation: >-
    [verified from the DMR record] The plant began treating phosphorus markedly harder inside the
    TMDL season than outside it, starting with the 2024 season — the first spring the general
    permit governed. Before that the two halves of the year are indistinguishable.
  spring_vs_non_spring_mean_mg_l:
    '2023': {spring: 0.708, non_spring: 0.761, ratio: 0.93}
    '2024': {spring: 0.424, non_spring: 0.752, ratio: 0.56}
    '2025': {spring: 0.402, non_spring: 0.761, ratio: 0.53}
    '2026': {spring: 0.376, non_spring: 0.670, ratio: 0.56, note: 'spring now COMPLETE (Mar-Jul, updated 2026-09-16); non_spring is still partial — Jan-Feb only'}
  reading: >-
    [inference] This is what a seasonal mass limit is designed to produce, and the record shows
    it working: outside March-July the effluent runs at roughly 0.75 mg/L, inside it at roughly
    0.40 mg/L, against an individual-permit concentration limit of 1.0 mg/L that never changes.
    The non-spring concentration did not rise, so this reads as additional treatment during the
    season rather than as load shifted out of it — but the corpus holds no operating record, so
    the CAUSE is inference. What is verified is the pattern and its timing.
  caution: >-
    Do not describe this as the plant "coming into compliance." Under OHP000001 Part IV.C.3 an
    over-limit individual load was never a violation while the group bubble held, so there was no
    non-compliance to cure. What changed is the load, not a compliance status.
  the_mechanism_now_has_a_name:
    tag: '[verified]'
    added: '2026-09-16'
    source: data/documents/oepa/findlay/edoc-4232502.pdf — Ohio EPA NPDES Compliance Evaluation Inspection, conducted 2026-08-06
    statement: >-
      Ohio EPA's own description of the treatment train says FERRIC CHLORIDE is added at the
      oxidation ditch splitter box, ahead of the four oxidation ditches. That is the
      chemical-phosphorus-removal step, and it is the lever a plant would pull to treat harder
      inside a seasonal mass limit than outside one. The inference above — "additional treatment
      during the season" — now has an identified mechanism in the plant, established by an
      inspector rather than assumed.
    what_it_still_does_not_establish: >-
      Seasonal dosing. The inspection describes the process, not the dose rate or its variation
      over the year, and no operating record is in the corpus. The CAUSE of the spring/non-spring
      split remains [inference]; what moved is that the mechanism is no longer hypothetical.
    the_rest_of_that_inspection:
      recommendations_noted: >-
        NONE, in any of the eight areas evaluated — NPDES Compliance, Operations & Maintenance,
        Operator Certification, Collection System, Sludge Management, Self-Monitoring, Laboratory,
        and Effluent/Receiving Water. Storm Water was not evaluated.
      compliance_data_2022_02_01_to_2026_07_01:
        permit_effluent_limit_violations: 1
        which: October 2023, Nitrogen-Ammonia at station 001
        permit_effluent_code_events: 9
        permit_effluent_frequency_violations: 0
        compliance_schedule_milestones_not_entered: 1
        reported_sso_events: 4
      note: >-
        Ohio EPA's own four-and-a-half-year tabulation records ONE effluent limit violation at this
        plant, and it is not a phosphorus one. That is consistent with this file's whole point:
        the individual permit's 1.0 mg/L concentration limit was never the binding constraint, the
        seasonal mass limit is, and the seasonal mass limit lives in a general permit whose
        compliance determination is not in the federal record at all.

# --- why the authoritative number is not here --------------------------------------------------

authoritative_number:
  what_would_settle_it: >-
    The permittee's calculated Individual Load for each season, reported under parameter 51451.
  not_in_the_federal_record: >-
    [verified] Parameter 51451 does not appear anywhere in OH0025135's effluent chart — the
    permit's own DMR record carries the concentration and flow inputs but not the calculated
    load. A pull against the general permit itself (p_id=OHP000001) returns a chart with ZERO
    DMR rows. So the number the general permit binds is not retrievable from ECHO at all; it
    lives in Ohio EPA's eDMR/eBusiness system under the general-permit coverage.
  re_verified_2026_09_16: >-
    [verified] AND THE 2026-08-20 TRIGGER DID NOT CHANGE IT. Re-pulled 2026-09-16 against ICIS
    extract 2026-09-11 — 27 days after the Individual Seasonal Load was due on the July eDMR.
    OH0025135's 2026 chart carries 33 permitted features and 30 distinct parameter codes, and
    51451 is NOT among them. The OHP000001 pull still returns zero features and zero rows. So the
    structural finding is now confirmed across a reporting deadline rather than merely observed
    between them: this is not a lag, the federal effluent chart does not carry this parameter,
    and no future pass should expect it to appear.
  season_report: >-
    OHP000001 Part IV.D — due September 1 each year, submitted electronically through the Ohio
    EPA eBusiness Center, carrying "the calculated Individual Load and a brief assessment
    comparing the Individual Load to the permittee's Individual Load Limit." A submission, not a
    published document. Records-request route. Lead TP-SEASON-REPORTS.
  general_permit_annual_report: >-
    The fact sheet's Attachment 3 commits Ohio EPA to release a General Permit Annual Report each
    November 1 that determines compliance with the Cumulative Limit, identifies facilities in
    violation, and publishes the permittee list and the next season's Cumulative Limit. NO SUCH
    REPORT IS PUBLICLY DISCOVERABLE for 2024 or 2025 — eight candidate filenames were probed in
    the Ohio EPA portal folder that serves OHP000001.pdf and OHP000001_FS.pdf, all 404, and
    targeted searches surface nothing. Note that Attachment 3 lists this row's Permit Condition
    as "--": it is an administrative commitment in a fact sheet, NOT an enforceable permit term.
    Record as an access gap, not as a negative. Lead GP-ANNUAL-REPORT-NOT-PUBLISHED.
  re_probed_2026_09_16:
    tag: '[verified negative — with a positive control]'
    result: >-
      Eight further candidate filenames probed under
      permits/Maumee_Watershed_Total_Phosphorus/ on 2026-09-16, all 404. The POSITIVE CONTROL
      PASSES: OHP000001.pdf (1,381,747 bytes) and OHP000001_FS.pdf (373,472 bytes) both return 200
      from the same folder in the same run, so the route is live and the 404s mean the files are
      not there under those names.
    ⚠️_a_mistake_worth_recording: >-
      The first attempt this pass probed permits/doc/ — the folder most Ohio EPA permits live in —
      and got 404 on EVERY candidate INCLUDING OHP000001.pdf and OHP000001_FS.pdf, two documents
      this corpus holds and fetched from the DAM. Reported without the control, that run would have
      read as "the annual report is still not published" when what it actually showed was the wrong
      folder. This general permit is served from permits/Maumee_Watershed_Total_Phosphorus/, not
      permits/doc/. ALWAYS probe a known-present file in the same folder in the same run.
  dead_link:
    as_recorded_2026_08_02: >-
      OHP000001 Part IV.D cites the Season Report form at
      https://epa.ohio.gov/divisions-and-offices/surface-water/guides-manuals/permits-program-technicalassistance
      — that URL returned HTTP 404 on 2026-08-02, as did the hyphenated
      ".../permits-program-technical-assistance" variant.
    superseded_2026_09_16:
      tag: '[verified]'
      result: >-
        NO LONGER DEAD. Both variants return HTTP 200 on 2026-09-16 — the unhyphenated URL the
        permit actually cites, and the hyphenated one. The page has been restored or re-routed at
        some point in the intervening six weeks.
      why_it_is_kept_not_deleted: >-
        Because the 2026-08-02 reading was correct on its date and because this is the second
        route on this file to change state in six weeks. A permit citing a URL that 404s and then
        returns is a fact about Ohio EPA's web estate, and a watch that silently replaced the old
        reading would lose the observation that these links are not stable enough to treat a 404
        as permanent.

# --- the standing calendar ---------------------------------------------------------------------

