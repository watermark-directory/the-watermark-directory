# --- the bubble, restated with what is now known -----------------------------------------------

bubble_status:
  rule: >-
    OHP000001 Part IV.C.3 — an individual permittee is in violation of its Individual Load Limit
    ONLY IF the 39-facility Cumulative Load exceeds the Cumulative Load Limit AND that permittee's
    Individual Load exceeds its own limit.
  last_published_group_season: >-
    2024 Biennial Report: 43,304 kg reported against a 64,170 kg Cumulative Load Limit (including
    a 1,400 kg allowance for future growth) — 20,866 kg of headroom, for the March-July 2024
    season.
  what_this_record_changes: >-
    Issue 1461 was framed as "over-WLA phosphorus, shielded by the bubble." On the reconstructed
    record that framing holds for the 2023 season and stops there. In 2024 the derived load is
    below the individual limit, so the bubble shielded nothing that season — the plant was inside
    its own allocation. 2025 is too close to call. The watch therefore shifts from "is the bubble
    holding?" to "is the margin closing?": 4,450 -> 2,756 -> 3,101 kg is not a trend toward
    safety.
  the_margin_question_answered_2026_09_16:
    tag: '[inference]'
    series_kg: {'2023': 4450, '2024': 2756, '2025': 3101, '2026': 2577}
    series_ratio: {'2023': 1.39, '2024': 0.86, '2025': 0.97, '2026': 0.805}
    statement: >-
      NO — THE MARGIN OPENED. The 2026 season closed at 2,577 kg, 80.5 percent of the limit: the
      lowest of the three post-permit seasons and the largest headroom since the general permit
      took effect. 2025's 0.97 was the peak of the worry, not the start of a climb.
    what_this_does_to_the_framing: >-
      The watch was written expecting to find a closing margin and found an opening one. That is
      recorded at full weight, in the same place the closing-margin framing was written, because a
      watch that only ever confirms its own premise is not a watch. Three points made a shape;
      four points made a range. The honest reading of 4,450 / 2,756 / 3,101 / 2,577 is one large
      pre-permit season followed by three post-permit seasons oscillating between 0.80 and 0.97 of
      the limit — no trend either way, and every post-permit season under.
    what_it_does_not_change: >-
      That 2025 is unresolved, that all four numbers are [inference], and that the bubble's own
      status is unpublished for 2025 and 2026. A comfortable margin on a reconstructed number
      against an unpublished group total is not a finding of compliance.
  still_open: >-
    No group total has been published for 2025 or 2026. The 2026 Biennial Report — the next one
    due after the committed 2024 edition — had not appeared as of 2026-08-02, and had still not
    appeared as of 2026-09-16. Nor has any General Permit Annual Report for any year, re-probed
    with a positive control this pass.
