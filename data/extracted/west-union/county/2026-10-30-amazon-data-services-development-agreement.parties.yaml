# Adams County ↔ Amazon Data Services, Inc. — DRAFT development agreement, rendered 2026-10-30.
# Epic #1983 (west-union readiness).
#
# THE FIRST INSTRUMENT TO NAME THE DEVELOPER. Until this file, the corpus held a water district's
# NDA with an unnamed "Company", a federal and state permit file in the names of 68 Yards, LLC and
# Buck Canyon Properties, LLC, and an AWS attribution resting on press. Here the County's own
# website publishes a 123-page development agreement whose Developer is Amazon Data Services, Inc.
# and whose Project Site is the 1,016.22-acre parcel the corpus already located.
#
# ⚠️ IT IS UNSIGNED. Every standing below is about what the County PUBLISHED, not about what it
# agreed to. A `[verified]` term means the draft says this, and nothing more. Tags per CLAUDE.md.

