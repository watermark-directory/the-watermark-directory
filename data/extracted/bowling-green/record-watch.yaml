# ── Standing-watch pass, 2026-10-27 ─────────────────────────────────────────
# Overdue pass answering the lapsed MIDDLETON-REFERENDUM trigger (declared 2026-09-16, due
# immediately, run 82 days after the window closed). Nothing below was committed under
# data/documents/** — every source read is listed under instruments_to_pull with its URL.
pass_2026_10_27:
  checked_on: '2026-10-27'
  answers_lapsed_trigger: MIDDLETON-REFERENDUM
  findings:
  - id: NO-REZONING-REFERENDUM-ON-THE-NOV-2026-BALLOT
    tag: '[verified]'
    finding: >-
      THE 2026-07-07 MIDDLETON TOWNSHIP REZONING IS NOT ON THE 2026-11-03 BALLOT. Two Wood County
      Board of Elections publications, read in full, carry no Middleton Township zoning question
      and no zoning referendum of any kind: (a) "Questions and Issues List, November 3, 2026
      General Election", footer-dated Thursday, September 3, 2026 (3 pp., text layer) — its only
      Middleton entry is "Middleton Township Road District — Renewal, Tax Levy, 2 mills for 3
      years ... Streets & Bridges"; and (b) the R.C. 3511.16 "Updated notification (to be posted
      46 days prior to date of election)", SoS Form No. 120, footer-dated Friday, September 18,
      2026 (20 pp., copier scan, OCRed here with tesseract --psm 6 at 200 DPI), whose issues
      section ("46_100 Day Issues Notice") lists the same Middleton Township Road District levy
      for precincts 460.1.2, 460.3, 470.1.2, 490.1.2.3.4 and nothing else for the township.
    positive_control: >-
      In the same run, the same two documents DO list the Middleton Township Road District renewal
      — so the township's precincts are covered by both lists and a township-level question would
      have appeared beside it. The Eastwood Local School District bond issue (Eastwood is one of the
      three CRA school parties) is also present in both. The negative is controlled.
  - id: THE-DRIVE-FELL-SHORT
    tag: '[verified] as said at a public meeting; the count itself [open]'
    finding: >-
      Middleton Township trustees' minutes, 2026-08-05 (approved 2026-08-19), visitor comments:
      "Leslie Harper, Whitehouse resident, reviewed the status of the referendum to stop the
      rezoning request noting the effort came up short of signatures needed." That is the
      coordinator's own account, minuted — not a Board of Elections sufficiency determination,
      because on this record nothing reached the Board to determine. No minutes from 2026-07-15
      through 2026-10-14 (nine files) record a petition presented to or certified by the trustees,
      and the words "petition" and "referendum" appear in none of them except this entry and a
      2026-09-03 remark (below). How many signatures were gathered is not stated anywhere. [open]
    corroborated_by: >-
      The BOE lists above (no question certified), and the Wood County Commissioners' 2026-10-08
      minutes (OCR), where Leatra Harper is minuted hoping "that November election changes will
      provide more political support" — candidate races, not a township zoning question.
  - id: REZONING-IS-IN-EFFECT
    tag: '[inference]'
    finding: >-
      R.C. 519.12(H) makes an adopted amendment effective "in thirty days after the date of its
      adoption, unless, within thirty days after the adoption, there is presented to the board of
      township trustees a petition". Adoption 2026-07-07 + 30 days = 2026-08-06. No petition is
      recorded as presented, so the thirteen-parcel rezoning took effect on or about 2026-08-06.
      Inference because no instrument states the effective date; R.C. 519.12(I) requires the
      trustees to file text and maps with the county recorder "within five working days after an
      amendment's effective date" — the recorder is the blocked route below, so that filing is
      unread. [open]
  - id: NOVEMBER-WAS-NEVER-THE-FULL-WINDOW
    tag: '[inference]'
    finding: >-
      The press framing ("971 valid signatures ... for the November ballot") was narrower than the
      statute. R.C. 519.12(H) sends a sufficient petition to "the next primary or general election
      that occurs at least ninety days after the date the petition is filed with the board of
      township trustees", and requires certification to the board of elections "not less than
      ninety days prior to the election". 2026-11-03 minus 90 days = 2026-08-05; a petition filed
      on the last statutory day (2026-08-06) is 89 days out and would have gone to the 2027-05-04
      primary, not November. Arithmetic shown; moot on this record since none was filed.
  - id: RC-519-12-H-READ
    tag: '[verified]'
    resolves: MIDDLETON-REFERENDUM.signature_threshold_conflict
    finding: >-
      The statute was read on codes.ohio.gov, current version AND the dated prior versions. The
      operative sentence of division (H), in the version effective September 30, 2025 (House Bill
      96, 136th G.A.) — the version in force on 2026-07-07 — reads: "a petition, signed by a number
      of registered electors residing in the unincorporated area of the township or part of that
      unincorporated area included in the zoning plan equal to not less than thirty-five per cent
      of the total vote cast for all candidates for governor in that area at the most recent
      general election at which a governor was elected". The current version (effective September
      23, 2026, House Bill 479) carries the same thirty-five per cent.
    the_three_numbers_resolved: >-
      35% — CORRECT. Township counsel's 2026-01-07 statement matches the statute in force.
      8% — STALE LAW. "eight per cent" is the text of the 2010-07-02 and 2019-03-22 versions; it was
      already fifteen per cent in the 2023-10-03 and 2025-04-03 versions, and thirty-five from
      2025-09-30. This repo's prior understanding was two amendments out of date.
      971 — UNVERIFIED and not derivable here: at 35% it implies ~2,774 gubernatorial votes in the
      zoned unincorporated area (971 / 0.35), a [inference] arithmetic only; the township's 2022
      gubernatorial vote was not pulled, so 971 is neither confirmed nor refuted.
    drafting_defect_in_the_version_in_force: >-
      [verified] The 2025-09-30 text is internally inconsistent: the operative clause says
      "thirty-five per cent" while the statutory petition FORM in the same division still reads
      "equal to not less than fifteen per cent of the total vote cast for all candidates for
      governor". The 2026-09-23 (HB 479) version conforms the form to thirty-five. Recorded as a
      fact about the statute; which number would have controlled a challenge is a legal question
      this file does not answer. [open]
    filed_with_whom: >-
      [verified] CORRECTION TO THIS FILE'S OWN ROUTE: the petition is NOT filed with the Board of
      Elections. "The petition shall be filed with the board of township trustees ... Within two
      weeks after receiving a petition filed under this section, the board of township trustees
      shall certify the petition to the board of elections." The trustees' minutes are therefore the
      first place a filing would surface, and they show none.
  - id: MEGAPROJECT-EXEMPTION-EXISTS
    tag: '[verified] as law / [open] as to this project'
    finding: >-
      Since 2025-09-30, R.C. 519.12(J)(1) provides that a trustees' decision to rezone "any
      property involved in a megaproject as defined in section 122.17 of the Revised Code shall take
      effect immediately upon adoption and is exempt from the referendum procedures in division
      (H)". R.C. 122.17's "megaproject" requires, among other things, that the operator agree "in
      an agreement with the tax credit authority under division (D)" to wage and investment
      conditions. NO TAX CREDIT AUTHORITY MEGAPROJECT AGREEMENT FOR LIAMES OR META IS IN THE CORPUS,
      and none of the minutes read invoke (J). Whether the exemption could have applied is [open];
      it did not need to, since no petition was filed. Worth knowing for every Ohio site.
  - id: SCHALLER-REZONING-DENIED
    tag: '[verified]'
    resolves: MIDDLETON-SCHALLER-ACTION
    finding: >-
      Middleton Township trustees, special hearing 2026-09-03: A. Schaller Limited Partnership's
      request to rezone "approximately 39.2 acres" of parcel J34-611-190000006000 from A-1 to M-1.
      The Wood County Planning Commission had "voted in favor"; the Middleton Township Zoning
      Commission "denied". Motion "to approve the recommendation of the Middleton Township Zoning
      Commission"; roll call Moulton YES, Petrea YES, Vetter NO; "It is noted the rezoning request
      was denied." Same motion form as 2026-07-07 — but here the roll call and the recorded outcome
      AGREE. Vorys (Chris Ingram) stated the purpose as "relocation of the employee parking lot for
      Phase 2 of the data center build out" and that "the parcel in question was not under the
      abatement agreement". Trustee Vetter's recusal was challenged by several speakers; counsel
      (Peter Griggs) is minuted saying the law did not require it.
    note: >-
      The minutes print the parcel as J34-611-190000006000; #1436 recorded the campus parcels
      with a J36- prefix. Carried as served. Whether J34 reflects section 34 is [inference]; not
      resolved.
  - id: PHASE-2-AND-BUILDING-FIVE-ON-THE-PUBLIC-RECORD
    tag: '[verified] as said'
    finding: >-
      Three statements, all public-side records of what was said: (1) applicant counsel, 2026-09-03
      township hearing, "Phase 2 of the data center build out"; (2) Wood County Commissioners'
      minutes 2026-10-13 (OCR), Chief Building Official Rob Cendol "mentioned that plans have been
      submitted to Building Inspection for the fifth building to be constructed at the data
      center"; (3) township minutes 2026-10-07, trustee report: "the data center Phase I will be
      operational in 2027 and Phase II operational in 2028. The administration building is
      completed. Currently 1,000 skilled labor workers are on site." Item (2) moves the "building
      five" language of the Schaller application (#1436) from an applicant's plan to a submitted
      building-plan set. The plans themselves are not in the corpus. [open]
  - id: LIAMES-FIRE-INSPECTION-CBPA
    tag: '[verified]'
    finding: >-
      Township minutes 2026-10-07: "Mr. Vetter moved, Mrs. Petrea seconded a motion to approve the
      Fire Inspection Services Community Benefit Payment Agreement with Liames LLC for $437,000.
      Motion approved." A new instrument between the township and Liames; its text is not
      published. Added to open_instruments.
  - id: WCPC-2026-06-02-TALLY-IS-4-2
    tag: '[verified]'
    resolves_in_part: WCPC-MINUTES
    finding: >-
      The Planning Commission's 2026-06-02 minutes are now published. On the Liames thirteen-parcel
      M-1 request the roll call is Bowlus YES, George NO, LaHote YES, Musteric YES, Schaller YES,
      Tewers NO (Arnold, Herringshaw, Schuerman, Swope absent): "The motion CARRIES. Vote: 4 yes, 2
      no, 0 abstain." THE PRESS 6-2 IS WRONG FOR THIS ITEM. Two oddities carried as served, not
      corrected: the motion text reads "recommend approval of the extension request" (a template
      carry-over from the preceding subdivision item), and the minutes spell the applicant
      "LLIAMES, LLC" once. Liames/Meta's representative (James Furchek) is minuted saying "there is
      no proposed development on the parcels in question today" and that they "would be used for
      construction-related activities". A commission member named Jeff Schaller voted; NO relation
      to the A. Schaller Limited Partnership applicant is asserted. [open]
    still_open: >-
      The 2026-07-07 Planning Commission minutes (the Schaller recommendation) are NOT published —
      the Planning Commission category lists one minutes file for 2026 (2026-06-02) against agendas
      for 06-02, 07-07, 08-11, 09-01 and 10-05.
  - id: COUNTY-DECLINES-BLANKET-RESOLUTION
    tag: '[verified]'
    finding: >-
      Wood County Commissioners' minutes 2026-10-13 (OCR): asked by Leatra Harper (2026-10-08) for
