      COUNTY COMMISSIONERS, MIDDLETON TOWNSHIP, AND WILL-POWER, OH, LLC FOR A POWER GENERATION
      FACILITY" (the township approved its side on 2026-09-30).
  - id: AGENDA-CENTER-DOES-CARRY-COMMISSIONERS-MINUTES
    tag: '[verified]'
    corrects: blocked_routes.WOOD-COUNTY-AGENDA-CENTER-SEARCH
    finding: >-
      The 2026-08-05 verdict that the county's post-2024-05-30 record is "effectively unsearchable
      by script" overstated the gap. The Agenda Center's "Board of County Commissioners" category
