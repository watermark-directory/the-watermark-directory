# Bowling Green (Wood County, OH) — standing record watch.
#
# The peer of power-watch.yaml (#1437) and water-watch.yaml (#1439) for the record domain
# (#1438). Two halves, and the second half matters as much as the first:
#
#   1. WHAT IS COMING — instruments a captured primary record says will exist or has said
#      exists, which is what makes them watchable rather than speculative.
#   2. WHAT WAS TRIED AND BLOCKED — routes probed on 2026-08-05 that refused automated
#      retrieval or returned nothing. These are recorded as PER-SOURCE NEGATIVES. Nothing is
#      inferred from what a server would not serve, and a later reader must not mistake a
#      blocked route for an empty record.
#
# Provenance vocabulary (docs/investigative-method/ENRICHMENT.md):
#   [verified]  = stated in a captured primary record (cite file + page)
#   [reference] = secondary / self-published source, not a controlling record
#   [inference] = reasoned from verified facts, labelled as such, arithmetic shown
#   [open]      = not established by any captured source — do NOT assert

meta:
  subject: >-
    Standing watch on the Bowling Green record domain — the Liames land-assembly instruments,
    the CRA and school compensation agreements, the R.C. 519.12 referendum window, and the four
    public-records routes that would settle them and are blocked or thin
  kind: record-watch
  site: bowling-green
  captured_for: issue 1438 (epic 1433, readiness(bowling-green) — the record domain)
  extracted_at: '2026-08-05'
  checked_on: '2026-10-27'
  previous_check: '2026-08-05'
  checked_on_scope: >-
    The 2026-10-27 pass (pass_2026_10_27 below) RE-RAN routes (1) the Middleton Township minutes
    archive (every file posted after the 2026-07-07 capture), and (3) the Wood County CivicEngage
    Agenda Center (Planning Commission minutes + agendas, and the Board of County Commissioners'
    minutes 2026-07-07 through 2026-10-15, OCRed), and ADDED the Wood County Board of Elections and
    the text of R.C. 519.12 itself. It did NOT re-run (2) the legacy minutes tree, (4) the CAMA
    layer, or (5) the Recorder / Ohio SoS probes — those negatives still carry 2026-08-05.
  method: >-
    Five routes. (1) The Middleton Township minutes archive — the full 2023-2026 publication,
    115 files, swept and grepped, of which fifteen mention Liames or Project Accordion and eleven
    are committed. (2) The Wood County Commissioners' legacy static minutes tree, which carries
    2023 in full and stops at 2024-05-30; the 2023-09-28 journal was located there and OCRed.
    (3) The Wood County CivicEngage Agenda Center, whose full-text search located the two
    Planning Commission agendas. (4) The Wood County auditor's Vision_Parcels CAMA layer, queried
    live for the thirteen rezoned parcels and for the whole Liames holding. (5) Direct probes of
    the Wood County Recorder (Fidlar AVA) and the Ohio Secretary of State business search, both
    of which failed and are recorded below as blocked routes rather than as empty results.

