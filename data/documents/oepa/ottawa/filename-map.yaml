meta:
  subject: >-
    OEPA/DAM permit download manifest — Village of Ottawa Wastewater Treatment Plant,
    NPDES 2PD00028 / application OH0026921 (issue 1422; the pull #415 had left open)
  generated_at: '2026-09-16'
  naming: >-
    Two naming families live on this shelf and both are as-received. A DAM pull keeps the slot's
    own basename (`2PD00028.pdf`). An eDocument-portal pull has no as-received name at all — the
    portal serves documents from `ViewDocument.aspx?docid=<n>` with no filename in the URL — so
    the corpus constructs `edoc-<docid>.pdf`, which is the same convention the van-wert shelf
    uses. Nothing is renamed; a constructed name is recorded as constructed.
  policy: >-
    non-destructive — originals keep as-received names. As at Findlay, the Ohio EPA DAM serves
    TWO different documents under the same basename `2PD00028.pdf`: the issued permit from
    `permits/doc/` and the draft public-notice package from `permits/DraftPN/`. Both byte-streams
    are kept; the second landed with its content-hash suffix (`2PD00028.e00560a8.pdf`) under the
    fetcher's non-destructive collision rule. Neither file is renamed to "fix" the collision. The
    canonical name of each is recorded below beside its source URL, and every content-verified
    date is read from that document's own text layer — never from its filename.

