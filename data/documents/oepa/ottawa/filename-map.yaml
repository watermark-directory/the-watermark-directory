    results, with delivery methods varying by whether any individual result exceeds 15 µg/L.
    Whether Ottawa had a result over 15 µg/L is NOT established by this document — the values are
    handwritten and unread. ECHO's five-year Lead and Copper summary reports a 90th-percentile
    lead value of 0 mg/L for 2021-01-01 → 2023-12-31, which is a different and older window.
