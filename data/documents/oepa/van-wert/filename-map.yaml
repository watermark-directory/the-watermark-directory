- filename: edoc-4235938.pdf
  canonical_name: >-
    Ohio EPA DDAGW Notice of Violation — "Partial Resolution of Violation - Sanitary Survey -
    Facility ID# 8159424, Community PWS Extension Request", City of Van Wert, PWS OH8100611,
    signed Justin W. Bowerman, Environmental Specialist III. 6 pp.
  content_verified_date: '2026-08-19'   # "August 19, 2026" in the letterhead date block and running head of pp. 2-6, text layer
  permit_id: OH8100611
  source_url: https://edocpub.epa.ohio.gov/publicportal/ViewDocument.aspx?docid=4235938
  edoc_docid: 4235938
  edoc_doc_type: NOV
  edoc_program: DRINKING WATER
  edoc_published: '2026-08-19'
  sha256: d946d626d1545d91ed7670d7de6a187fb5706f35895bf153a9230c8410408699
  bytes: 413379
  content_type: application/pdf
  fetched_at: '2026-09-16'
  status: downloaded
  evidence: >-
    native_text, but a POOR scan-derived layer — the first page's letterhead is mangled
    ("Environmen~tl a"). The date is legible and repeated on every page's running head, so it is
    content-verified; individual figures were read from the body text, not from the letterhead.
  note: >-
    THE DRINKING-WATER SIDE OF THIS SITE HAS FORMAL ENFORCEMENT, AND THE WASTEWATER SIDE DOES NOT.
    That distinction is easy to lose. This letter is addressed to Jay Fleming, Safety Service
    Director, and it administers outstanding violations from THREE prior notices — the Oct. 31,
    2022 LSSV NOV, the Dec. 5, 2023 LSSV NOV, and the July 18, 2024 Sanitary Survey NOV — and it
    ties one of them to "Order No. 15 of the June 17, 2024, Director's Final Findings and Orders".
    A DFFO is a formal enforcement instrument. It is NOT in this corpus and is not on this shelf;
    it is named here only as this letter names it.
    Three outstanding violations, with the deadlines this letter sets:
      • 2023 LSSV NOV Citation #5 — reservoir intake sluice gates inoperable, OAC 3745-83-01(H)(1).
        The reservoir intakes have multiple levels and the gates "are not operable", so water
        cannot be withdrawn from each level. Extension request received 2026-08-07 and APPROVED;
        new deadline Sept. 5, 2027 — which is nearly four years after the violation was first cited.
      • 2024 Survey NOV Citation #5 — containment backflow preventers not tested every 12 months,
        OAC 3745-95-06(C)(2) and (3). Deadline Dec. 31, 2026.
      • 2024 Survey NOV Citation #6 — five-year on-site premises investigations, OAC
        3745-95-03(B)(1). Deadline Dec. 31, 2028.
    The City's own words, quoted in the letter and worth preserving verbatim: the sluice gate
    valves "have caused no operational issues for the last 40 years", the Solomon Diving quote to
    replace six of them is $443,390, and "This is a lot of money for almost no benefit." The
    letter closes by noting failure to comply "may result in an administrative or civil penalty of
    up to $25,000 per day for each violation."
