  subject: OEPA/DAM permit download manifest
  generated_at: '2026-07-31'
  policy: non-destructive — originals keep as-received names
  note: >-
    Two sources feed this collection. DAM permit slots
    (dam.assets.ohio.gov/.../Portals/35/permits/{doc,DraftPN}/<ID>.pdf) serve a bare
    permit-number filename, so the DraftPN copy collides with the issued-permit copy;
    the second bytes keep their own name suffixed with a sha256 prefix, per the same
    non-destructive collision rule used in oepa/findlay/. Ohio EPA eDocument
    (edocpub.epa.ohio.gov/publicportal/ViewDocument.aspx?docid=N) sends no
    Content-Disposition at all, so those files are named by their stable eDoc docid —
    the same convention as oepa/urbana/. Canonical names below are descriptive only;
    the bytes on disk keep the as-received name.
