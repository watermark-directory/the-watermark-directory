  bytes: 382430
  content_type: application/pdf
  fetched_at: '2026-09-16'
  status: downloaded
  evidence: >-
    native_text, good quality. TWO DATES, and they are not interchangeable: the CEI was conducted
    2026-08-06 and the transmittal letter is dated 2026-08-17. `content_verified_date` is the
    letter's date because that is the document's own date; cite the inspection by 2026-08-06.
    ⚠️ The report's checkbox tables extract with the box glyphs (☒/☐) intact and READABLE, unlike
    the OEL Form 5031 on the van-wert shelf — but the Yes/No/NA column order must be read from the
    rendered page before any individual answer is quoted.
  note: >-
    THE PROCESS FACT THAT MATTERS FOR THE PHOSPHORUS WATCH. The report describes the treatment
    train: influent gates → automatic bar screen → oxidation ditch splitter box, where FERRIC
    CHLORIDE IS ADDED, → one of four oxidation ditches → one of five final clarifiers → UV
    disinfection → post-disinfection aeration. Ferric chloride at the splitter box is the
    chemical-phosphorus-removal step, so this is the mechanism by which seasonal phosphorus
    treatment would be varied. It establishes that the mechanism EXISTS; it says nothing about
    seasonal dosing rates and must not be read as establishing the seasonal shift's cause.
    Compliance data for 2022-02-01 → 2026-07-01, as tabulated by Ohio EPA: Permit Effluent Limit
    Violations 1 (October 2023, Nitrogen-Ammonia at station 001); Permit Effluent Code Events 9;
    Permit Effluent Frequency Violations 0; Compliance Schedule Milestones Not Entered 1;
    Reported SSO Events 4.
    Section C records every evaluated area — NPDES Compliance, Operations & Maintenance, Operator
    Certification, Collection System, Sludge Management, Self-Monitoring, Laboratory, Effluent /
    Receiving Water — with "Recommendations noted in report? N". Storm Water was not evaluated.
    The outfall 001 visual observation is clear on every column.
