    Two naming families, both as-received. A DAM pull keeps the slot's basename (`2PD00008.pdf`).
    An eDocument-portal pull has no as-received name — the portal serves from
    `ViewDocument.aspx?docid=<n>` with no filename in the URL — so the corpus constructs
    `edoc-<docid>.pdf`, the same convention the van-wert and ottawa shelves use. A constructed
    name is recorded as constructed.
  policy: >-
    non-destructive — originals keep as-received names. Ohio EPA serves TWO different documents
    from the DAM under the same basename `2PD00008.pdf` (one from `permits/doc/`, one from
    `permits/DraftPN/`). Both bytes are kept: the second landed with its content-hash suffix
    (`2PD00008.1abaf306.pdf`) under the fetcher's collision rule. Neither file is renamed to
    "fix" the collision; the canonical name of each is recorded below beside its source URL, and
    the content-verified dates come from each document's own text layer, never from its filename.
