meta:
  collection: wapakoneta/auglaize-commissioners
  note: >-
    Minutes of the Auglaize County Board of County Commissioners, downloaded from the County's own
    site (www2.auglaizecounty.org → Elected Officials → Commissioners → Minutes, one PDF per week),
    kept under their as-received names (the URL basename, percent-decoded). They are image-only
    scans with no text layer, so all 239 posted files for 2023-2026 were read by OCR and searched
    for WAEDC; the three shelved here are the ones that record a dealing with it, and every passage
    cited was checked against the page image. The minutes summarize the day and list resolutions by
    title only ("the entire texts of same are documented in the Board's Journal"), so the absence of
    a WAEDC appropriation from them is not a negative for the Journal or the annual appropriation
    resolution [open]. Shelved under the Wapakoneta site because the subject is WAEDC. Added for
    #2184.
  publisher: Auglaize County Board of Commissioners
