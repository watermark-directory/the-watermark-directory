- filename: April 2, 2026_0.pdf
  title: Auglaize County commissioners' minutes, 2026-04-02
  source_url: https://www2.auglaizecounty.org/sites/default/files/documents/April%202%2C%202026_0.pdf
  sha256: f67b97945a919d4dafd3e33edc36bb5f85a0c231c5bb4642b26dd154a52f4fc0
