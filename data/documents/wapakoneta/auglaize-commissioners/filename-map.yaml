  note: >-
    p.1, Administrator Preston: "Reported she attended the monthly WAEDC meeting on April 1" and
    "Presented a reimbursement request from the Wapakoneta Area Economic Development Council for
    conference registration fees. The Board approved the request." No amount is given. "The monthly
    WAEDC meeting" fits a regular County presence; OCR of the unshelved 2024-03, 2025-11 and 2026-04
    minutes shows her reporting on other WAEDC meetings (not image-checked). WAEDC's returns list an
    "Erica Preston" as a director for the year ending 2016-09-30 only, and on none of the nine later
    returns (irs/filename-map.yaml). That she is the same person is [inference]; whether she now
    attends as a director, an ex officio member or a guest is [open].
