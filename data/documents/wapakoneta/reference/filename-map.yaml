  status: downloaded
  content_verified: text-layer
  rights: >-
    © Copyright Jacobs (p. 41). Published by the Ohio Water Environment Association on its own
    site; no licence is stated. Held to read and cite, not to redistribute.
  note: >-
    41 slides. The date is read off the title slide's text layer ("OWEA Technical Conference,
    June 26, 2019"); the closing slide is footed "July 17, 2019", which is the deck's own
    revision date, not the talk's. The as-received name is kept verbatim. Slides 7, 8 and 12 carry
    their figures only as chart images and were rendered and read; slide 39 (alternative costs)
    is a chart with its axis values removed and carries no figure at all. It is the only captured
    source that quotes the 2019 DFFO's limits — the order itself was retrieved 2026-10-27 as eDoc
    992359 (data/documents/oepa/wapakoneta/edoc-992359.pdf). The DSW listing's link for it,
    docid 1080081, resolves to an unrelated Jefferson County order.
