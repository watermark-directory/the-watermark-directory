meta:
  collection: wapakoneta/irs
  note: 'The Wapakoneta Area Economic Development Council''s own Form 990-EZ returns, tax years ending
    2016-09-30 to 2025-09-30. WAEDC is a private non-profit (EIN 34-1556135), not a public office; its
    returns are public under 26 U.S.C. 6104. The PDFs are the IRS''s Tax Exempt Organization Search copies,
    image-only renderings of the e-files (0 text characters), so every figure here was read from the page
    image. They are the filer''s statement, signed under penalty of perjury: they establish what WAEDC
    reported (who it listed as a director, in which year) [verified as to the return], not why a person
    held the seat. No return marks any seat ex officio or as a City designation; every director is shown
    at 1.00 hr/week ("000 00" in the two oldest) and $0. Fetched by hand by the requester on 2026-11-03
    (fetched_at is the download''s file time); the PDF filenames are TEOS''s own and are kept verbatim.
    Added for #2184.'
