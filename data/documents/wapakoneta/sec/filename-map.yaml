  note: 'Duos Technologies Group, Inc.''s own SEC filings, shelved here because WDTN (2026-11-17)
    reported that Duos "would operate the computers inside" CTS''s proposed Wapakoneta facility
    ("Project Apollo"). Duos is a public company, so its periodic reports are the primary record of
    what it has disclosed. A filing establishes what Duos told the SEC [verified as to the filing]. It
    does not establish any fact about a Wapakoneta project the filing does not mention, and what it
    omits is not proof that no arrangement exists: a 10-Q need not list every site in development.
    Supplied by the requester on 2026-11-17 (fetched_at is the download''s file time). The filename is
    the EDGAR accession number as received and is kept verbatim. Added for #2184.'
