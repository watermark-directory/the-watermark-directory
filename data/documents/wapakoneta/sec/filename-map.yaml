  note: 'A PDF rendering of the filing with a usable text layer; the PDF metadata gives a 2026-11-16
    creation date. Read in full for #2184. It names no Ohio site, and neither Wapakoneta, Auglaize,
    Short Road nor "Project Apollo" appears in it. It does record (Note 14, Commitments and Contingencies, printed p.43): on 2026-09-30
    Duos Edge AI, Inc. entered a Membership Interest Purchase Agreement with "CTS Infrastructure LLC"
    to acquire 100% of "CTS SC Holdings LLC" for $10.0 million in escrow, to pay "Lee County" (state
    not given) for a site; closing is conditioned on County approval and validated electric service of
    at least 19.9 MW by 2027-06-30; Duos "intends to develop Project Atlas as a 20 MW colocation
    compute center." Whether CTS Infrastructure LLC is the "Colocation Technology Services" that
    appeared before Wapakoneta Council is not established by this filing.'
