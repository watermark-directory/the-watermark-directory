meta:
  collection: wapakoneta/governance
  note: >-
    The City of Wapakoneta's codified zoning text as it bears on data centers, captured from the
    American Legal Publishing code library (supplement 2026 S-27, "Local legislation current through
    May 18, 2026"). These are HTML captures of a publisher's codification, NOT the ordinances as
    passed: American Legal's own footer says its posting "may not reflect the most current
    legislation" and that "the official printed copy … should be consulted prior to any action". The
    section text is the in-force text as codified; Ord. 2024-46 and Ord. 2024-48 as enacted (the
    signed instruments) are still not in hand [open]. The library answers 403 to a scripted HTTP/2
    client and 200 to the same request over HTTP/1.1 with a browser User-Agent, which is how these
    were taken; no login, no paywall. The captured names are this repo's (a section page has no
    filename of its own — its URL ends in an opaque node id, recorded per entry). Added for #2184.
  publisher: American Legal Publishing (codelibrary.amlegal.com)
  code: Codified Ordinances of Wapakoneta, Ohio — Part Twelve, Planning and Zoning Code
  supplement: 2026 S-27 (current)
  current_through: '2026-05-18'
