meta:
  subject: Mahoning-basin NPDES wastewater dischargers
  scope: all active CWA-permitted dischargers
  source: EPA ECHO — cwa_rest_services (CWA v2017-10-13)
  watershed: Mahoning River — 1 HUC-8 subbasin (05030103 Mahoning), subregion 0503
    (Upper Ohio, reaching the Ohio through the Beaver River in Pennsylvania)
  huc8s:
    '05030103': Mahoning
  dedup_key: FRS RegistryID
  count: 213
  caveats:
  - ECHO's CWA facility service has no CWNS column; the POTW flag rests on CWPFacilityTypeIndicator.
  - Facilities link to HUCs via WATERS (FacDerivedHuc); a permit that didn't geocode
    can be missed.
  - design_flow_mgd is null where ECHO returned no value; it is never estimated.
  - THE INVENTORY IS PULLED; NO MAHONING GAGE IS REGISTERED. mainstem-gages.yaml holds
    no entry for this basin, so a discharger here reports no_7q10 — UNSCREENABLE,
    NEVER UNAFFECTED — until one is registered with its drainage-area rationale.
  - THE UNIT CROSSES THE STATE LINE. WBD lists 05030103 as `states=OH,PA` and ECHO's
    `p_huc` query does not filter by state, so this inventory holds Pennsylvania dischargers
    beside Ohio ones. A Pennsylvania permit is written under Pennsylvania's water-quality
    standards, and an Ohio criterion read against it is the wrong rule.
  - ANY LOW-FLOW STATISTIC REGISTERED HERE LATER MUST STATE ITS REGULATION. Per mainstem-gages.yaml's
    meta.cited_annotations rule a `regulation` block must quote a published third-party
    classification; none for any gage in this basin has been read into the corpus,
    so an unannotated Mahoning gage would mean 'not yet read against the published
    record', never 'unregulated'.
