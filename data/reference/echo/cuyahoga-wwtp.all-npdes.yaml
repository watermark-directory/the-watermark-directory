meta:
  subject: Cuyahoga-basin NPDES wastewater dischargers
  scope: all active CWA-permitted dischargers
  source: EPA ECHO — cwa_rest_services (CWA v2017-10-13)
  watershed: Cuyahoga River — 1 HUC-8 subbasin (04110002 Cuyahoga), subregion 0411
    (Southern Lake Erie, direct to the lake)
  huc8s:
    '04110002': Cuyahoga
  dedup_key: FRS RegistryID
  count: 153
  caveats:
  - ECHO's CWA facility service has no CWNS column; the POTW flag rests on CWPFacilityTypeIndicator.
  - Facilities link to HUCs via WATERS (FacDerivedHuc); a permit that didn't geocode
    can be missed.
  - design_flow_mgd is null where ECHO returned no value; it is never estimated.
  - THE INVENTORY IS PULLED; NO CUYAHOGA GAGE IS REGISTERED. mainstem-gages.yaml holds
    no entry for this basin, so a discharger here reports no_7q10 — UNSCREENABLE,
    NEVER UNAFFECTED — until one is registered with its drainage-area rationale.
  - THE FRONTAL LAKE ERIE UNITS ARE SIBLINGS, NOT PART OF THIS BASIN. 04110001 Black-Rocky,
    04110003 Ashtabula-Chagrin and 04110004 Grand reach Lake Erie independently of
    the Cuyahoga and are not in this pull. A discharger on one of them is neither
    upstream nor downstream of a Cuyahoga discharger and must never borrow a Cuyahoga
    denominator.
  - A LAKE OUTFALL IS NOT A RIVER REACH. Dischargers at the river's mouth or on the
    lakefront meet a lake whose mixing is set by lake level, seiche and wind, not
    by streamflow, so a river 7Q10 served to one is a category error, not a conservative
    approximation.
