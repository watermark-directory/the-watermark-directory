meta:
  subject: Hocking-basin NPDES wastewater dischargers
  scope: POTWs only (CWPFacilityTypeIndicator == POTW)
  source: EPA ECHO — cwa_rest_services (CWA v2017-10-13)
  watershed: Hocking River — 1 HUC-8 subbasin (05030204 Hocking), subregion 0503 (Upper
    Ohio, draining directly to the Ohio River)
  huc8s:
    '05030204': Hocking
  dedup_key: FRS RegistryID
  count: 24
  caveats:
  - ECHO's CWA facility service has no CWNS column; the POTW flag rests on CWPFacilityTypeIndicator.
  - Facilities link to HUCs via WATERS (FacDerivedHuc); a permit that didn't geocode
    can be missed.
  - design_flow_mgd is null where ECHO returned no value; it is never estimated.
  - THE INVENTORY IS PULLED; NO HOCKING GAGE IS REGISTERED. mainstem-gages.yaml holds
    no entry for this basin, so a discharger here reports no_7q10 — UNSCREENABLE,
    NEVER UNAFFECTED — until one is registered with its drainage-area rationale.
  - This basin reaches the Ohio River on its own, so it is a sibling of the Scioto
    and the Muskingum, not part of either, and a Hocking discharger must never borrow
    either basin's denominator or an Ohio River mainstem one.
