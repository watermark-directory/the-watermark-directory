    source: reference
    citation: '[reference] The SITE''s utility is the City of Wapakoneta municipal
      electric system (EIA-861 2024 Service_Territory, utility #20077, an American
      Municipal Power member). The proposed CTS data center would NOT be served through
      it: per the City''s own statement it would take a new direct connection to an
      AEP (Ohio Power Co, #14006) line and buy power as a Delivery Service Customer
      under separate AMP contracts. That arrangement is the developer''s and City''s
      description of a proposal, not a filed instrument [open].'
