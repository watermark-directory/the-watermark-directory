coverage_note: BLS QCEW counts UI-covered (private, state, local) plus federal-civilian
  (UCFE) employment. Uniformed active-duty military is excluded — it appears in neither
  the county total nor any ownership row — so at a federal enclave the covered total
  understates the base's real employment footprint beyond even the federal-civilian
  jobs shown here.
note: Employment from BLS QCEW (keyless open data). Location quotient = county sector
  share / national share (export-orientation; the county-level proxy for an import/export
  ratio). Population from US Census ACS 5-year (B01003). Median household income from
  US Census ACS 5-year (B19013, 2023).
