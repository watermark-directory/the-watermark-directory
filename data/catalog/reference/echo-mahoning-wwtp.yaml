notes: >-
  Inventory of active CWA-permitted dischargers across HUC-8 05030103 "Mahoning", deduplicated by
  FRS Registry ID; every value is ECHO-returned and nulls are genuine. The HUC-8 CROSSES INTO
  PENNSYLVANIA and ECHO's p_huc has no state filter, so Lawrence County PA permits arrive in the
  same query; a complete inventory still needs the PA DEP permit list cross-checked, which has not
  been done. Opened by the 2026-11-02 sweep for the lordstown and youngstown points, each located
  against the USGS WBD service. No Mahoning gage is registered in mainstem-gages.yaml, so every row
  reports no_7q10 or no_receiving_water: UNSCREENABLE, NEVER UNAFFECTED. The mainstem is
  impounded above Warren and Youngstown, so any gage registered there must carry a regulation
  block. Pulled with the ColumnIDs resolved from ECHO metadata. Headline counts for a given pull
  are dated in data/reference/echo/README.md rather than restated here.
