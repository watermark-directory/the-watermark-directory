notes: >-
  Inventory of active CWA-permitted dischargers across HUC-8 05030204 "Hocking", deduplicated by
  FRS Registry ID; every value is ECHO-returned and nulls are genuine. Wholly in Ohio. Opened by
  the 2026-11-02 sweep for the lancaster and athens points, each located against the USGS WBD
  service. The Hocking meets the Ohio directly, a SIBLING of the Scioto and the Muskingum rather
  than part of either, so neither basin's denominator applies here. No Hocking gage is registered
  in mainstem-gages.yaml, so every row reports no_7q10 or no_receiving_water: UNSCREENABLE, NEVER
  UNAFFECTED. Pulled with the ColumnIDs resolved from ECHO metadata. Headline counts for a given
  pull are dated in data/reference/echo/README.md rather than restated here.
