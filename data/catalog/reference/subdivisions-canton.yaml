# body. Empty is the honest state until a roster lands, and it does not make `record` live.
site_scope: site:canton
storage:
- relpath: reference/subdivisions/canton/subdivisions.yaml
  media_type: application/x-yaml
  lfs: false
refresh:
  cadence: on-demand
provenance: connector
schema_ref: watermark.civic.models.Registry
tags:
