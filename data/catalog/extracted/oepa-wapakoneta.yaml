notes: >-
  Wapakoneta WRF permit 2PD00019*SD, issued 2024-11-05, effective 2024-12-01, expiring
  2029-11-30, signed Anne M. Vogel. Hand-read from the digitally generated text layers; no render
  receipt (the image-only sheets — a location map, a process schematic and one near-blank notes
  page — were rendered and viewed for the publication screen). The permit PDF binds the 82 permit
  sheets and the 37-page Fact Sheet; the Fact Sheet is also served standalone with an identical
  text layer and is transcribed and cited from that copy. Fetched 2026-10-17 by permit number
  while the eDocument portal returned HTTP 503.
  Discharge to the Auglaize River at RM 84.9 on a 6.0 MGD expanded design flow, against a 7Q10
  of 2.29 cfs that is a StreamStats value reduced by its standard error from the PERMITTEE'S 2021
  technical memo, not a gage record; at design flow under 7Q10 the river below the outfall is
  roughly 80% effluent ([inference], arithmetic over two [verified] figures). A 2019-02-06 DFFO
  for excessive total filterable residue drove the expansion and a flow-augmentation process;
  neither the permit nor the fact sheet names the augmentation water, and the 2024 modified DFFO
  names wells piped to discharge close to the outfall.
  The DFFO itself (eDoc 992359, added 2026-10-27) is a consent order under R.C. 6111.03,
  6109.04 and 3745.01: a general plan with public-water-system work due 2022-12-31 and WWTP work
  due 2024-09-01; once Pratt Industries began production, interim specific-conductance limits of
  3051 micromhos/cm monthly and 3886 daily, ending no later than 2024-09-01; per-exceedance
  mitigation fees after 2020-03-01; and annual Auglaize River biological sampling. No civil
  penalty. The DSW enforcement listing links this order to docid 1080081, which is a different
  order, so the eDoc id comes from the portal's own index.
  The 2024-11-20 modified DFFO (eDoc 3301212, added 2026-10-27) modifies Orders 1 and 6 only:
  WWTP work and the interim limits both run to 2025-12-31; everything else stays in force. Its
  findings date PWS lime softening complete 2023-08-07 and name wells piped near the outfall as
  the augmentation water. The 2025-12-31 deadline has passed; completion, termination or a
  further modification is not in the record. [open] The portal's fourth 2PD00019 row (eDoc
  3480641) is an ODOT rest-area order on 2PP00019, mis-indexed, and is not shelved.
  178 effluent violations 2019-2023 in the Fact Sheet's Table 2 (titled "Outfall 001") — 150 at
  Outfall 001 itself plus 28 TFR violations at fictitious outfalls 020-022 (62 E. coli, 53 TFR across
  001/020-022, 17 chronic toxicity).
  ⚠️ PHASED LIMITS: cadmium, selenium, dibromochloromethane and carcinogenic additivity are
  monitor-only through month 24 and limited from month 25 (~2026-12-01), while Part I.C allows
  until month 36 (~2027-12-01) to comply. TFR limits are tiered across fictitious outfalls
  020-023, selected daily by the permittee's own stage-to-flow curve at station 802.
  Recorded document defects: the Fact Sheet prints station-603 winter ammonia as "30" (permit
  3.0); the issued tables drop the Fact Sheet's 0.019 mg/L chlorine limit while still
  cross-referencing it; the additivity equation's denominators are not the WLAs printed above
  them; and the brominated trihalomethanes behind the new limits are non-detect 2019-2021 and
  first appear in 2022, coincident with an unnamed new industrial user. [open]
