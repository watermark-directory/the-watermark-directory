notes: >-
  The zoning instrument that permits the Lima campus, and the corpus's ONLY source for the
  approval — no trustee minutes record the 2025-01-08 vote or the 2025-02-04 written notice,
  because the BZA is a separate body whose minutes are not held here. One 15-page scan carrying
  five instrument types; the 2018 warranty deed at pp. 11-14 is extracted separately. ⚠️ The
  source PDF has a ZERO-CHARACTER text layer on all 15 pages, so it contributes no passages to
  search or /ask and any text-based screen or query over it is structurally blind. ⚠️ The permit
  was granted under Article 11.2.3, a residual industrial catch-all, eight months BEFORE American
  Township adopted a data-center use category (11.2.4, per Res #09-082025 of 2025-09-08) — and the
  subsection numbers moved in that amendment, so 11.2.3 reads as "barrow pits" against the current
  resolution. The source is NOT publication-cleared; see pii-screen.yaml.
