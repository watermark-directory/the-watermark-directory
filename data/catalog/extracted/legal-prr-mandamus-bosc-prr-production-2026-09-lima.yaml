notes: The production the City reports as final for the Lima WWTP, answering the four items the
  2026-08 batches returned `nothing-produced` — D.7 (industrial-user inventory), D.8 (IU permits),
  D.9 (pretreatment annual reports) and E.10 (the CSO long-term control plan). 25 files at 24
  distinct vault addresses; one file produced twice across the two same-day batches, byte-identical,
  both kept. Byte-level custody manifest with a content-verified date per file; the plan produced
  for E.10 is an undated DRAFT whose content ends circa 2012, while the City's own 2026 CSO annual
  report describes an approved LTCP.
