notes: >-
  A secondary source: every claim is [reference]. A commissioned IMPLAN contribution estimate
  for 2025 ($9.1B GDP, ~69,600 jobs, 14,257 direct payroll jobs). Gross activity, not net impact;
  the report does not estimate public-service, electricity or water costs. Also: a 90-campus
  inventory with 13 pipeline sites outside Central Ohio, most of them network sites. The R.C.
  122.175 exemption cost ($554.9M state in 2024, $1,568.7M in 2025, against a ~$136M published
  estimate) and its break-even attribution (60% for old 100% agreements, 30% for recent 50%
  ones). A 4,479-district property-tax simulation: median 98% of a campus's bill stays with local
  governments, which is little homeowner relief. A community-benefit disclosure framework. The
  Technical Appendix (A-I) is unpublished and not held.
