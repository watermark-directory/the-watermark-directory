id: lima-council-instruments
title: Lima — City Council Primary-Instrument Set (Ordinance 198-26, the data-center moratorium)
scope: extracted
status: reviewed
producer:
  kind: manual
  source: >-
    Two City of Lima documents pulled 2026-09-16 from the City's PrimeGov agenda portal
    (https://limaoh.primegov.com/) and committed at data/documents/lima/council/ with a filename
    map: the regular council meeting agenda of 2026-09-14 (7 pp., native text layer) and its
    meeting packet (157 pp., MIXED layer). The packet is where the instruments are — 69 of its 157
    pages carry no extractable text, and ALL 33 ordinance texts are in that block, so a
    text-layer-only read finds the transmittal memos and misses every instrument. Ordinance 198-26
    at pp. 154-156 was read with pypdfium2 + tesseract at 450 DPI (--psm 6), with a 600 DPI crop for
    the vote grid; the transmittal memo at pp. 43-46 and the agenda were read from the native text
    layer. The meeting date was content-verified from the agenda's own heading, NOT from the
    filename, the portal's `dateTime` field, or news coverage — which matters, because every
    secondary source dates this 2026-09-15 and the meeting was Monday 2026-09-14.
