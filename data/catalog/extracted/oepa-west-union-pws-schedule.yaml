notes: >-
  The **Adams County Regional Water District's drinking-water identity**, from Ohio EPA's 2026
  Adams County PWS monitoring schedules (PDF pp. 4-6). System **OH0100012**, Community, **Ground
  Water** source, a Ground Water Rule "Substantial System"; one entry point (facility 152614,
  EP001) and distribution DS1. This is the key an Ohio EPA drinking-water records request needs.
  Do not confuse it with OH0100112, which is Manchester Village. The schedule lists sampling
  obligations, not results, and says nothing about any data-center customer. Only OH0100012 is
  transcribed; the other five Adams County systems in the same file are not.
