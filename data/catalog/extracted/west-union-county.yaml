notes: 'Clause-level structured read of the County''s DRAFT development agreement with Amazon Data
  Services, Inc. for the Buck Canyon campus (issue 1983). The draft is unsigned, with a blank
  Effective Date, resolution and signatures, so every term is [verified] only as a statement of
  the draft. It names the developer on parcel 183-00-00-079.000 for the first time in the corpus.
  Its Exhibit A ALTA survey labels the owner of record Buck Canyon Properties LLC (KY), Inst.
  2024-912, and shows the 1,016 ac was ASSEMBLED from at least seven predecessor tracts, one part
  owned by Hamerkop Development, LLC (field survey 2021-07-02). That corrects the "single tract"
  reading in parcel-assemblage. It also recites an ACEDA NDA of 2024-01-04, sets a $9M GMP against
  a fixed $9M developer contribution, makes the County the PTI/NPDES applicant for the campus
  wastewater plant (Exhibit H), and vests the project against later County rules (section 5.6).
  The Kimley-Horn memo cites an ODOT-approved "Project Galaxy" traffic study. No MW or water
  figure appears. Regenerate by re-reading the committed source PDF; nothing here is
  machine-derived.'
