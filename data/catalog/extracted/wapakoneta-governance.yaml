notes: >-
  The in-force text of the City's 2024 data-center ordinances as codified. Ord. 2024-46 carves "Data
  Warehouse (Center)" out of the zoning definition of "Warehouse", and Ord. 2024-48 adds data centers
  to the M-3 district's conditional uses. M-3 is the only district that admits one. Review is the
  generic 2010 conditional-use procedure in §1252.07: no data-center-specific standards, no required
  public hearing, and a permit that runs with the land. It is the publisher's codification, not the
  signed ordinances, which are still not in hand. The 2024 minutes record the readings and votes
  (both 7-0 on 2024-11-18) and that, at the second reading, the Planning Commission had made no
  comment, no utility-rate conversation had occurred and the engineering consultant had given no
  input.
