notes: >-
  Per-document extractions from the production the City reports as final for the Lima WWTP,
  answering request items D.7/D.8/D.9 (pretreatment) and E.10 (CSO). 22 artifacts over 21 of the
  22 distinct source files: 14 industrial discharge permits, the CY2023-CY2025 pretreatment
  annual reports, four permit-extension letters, and the CY2025 CSO annual report. Two source
  files are deliberately not read here — `IU_Inventory_List.xlsx`, a spreadsheet reconciled
  directly against the permits rather than vision-extracted, and `LTCP.pdf`, a 166-page undated
  DRAFT narrative control plan for which no genre fits and which the City's own CSO annual report
  shows is not the approved plan it operates under. The CSO read carries all 60 dated overflow
  rows across the 16 structures that discharged, with `estimated` true on the 20 events at CSOs
  #007 and above, whose flow the report states is CALCULATED as 2% of the combined overflow at
  CSOs #002-#006 rather than metered.
